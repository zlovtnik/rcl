<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <style>:root {
  --color: black;
  --bg: white;
  --head-bg: white;
  --link: #338;

  --blue: #ccf;
  --red: #fcc;
  --yellow: #ffc;
  --green: #cfc;
}

[data-theme='dark'] {
  --color: white;
  --bg: black;
  --head-bg: #333;
  --link: #aaf;

  --blue: #225;
  --red: #522;
  --yellow: #552;
  --green: #252;
}

html,
body {
  margin: 0;
  padding: 0;
  color: var(--color);
  background: var(--bg);
}

.app {
  margin: 10px;
  padding: 0;
}

.files-list {
  margin: 10px 0 0;
  width: 100%;
  border-collapse: collapse;
}
.files-list__head {
  border: 1px solid #999;
}
.files-list__head > tr > th {
  padding: 10px;
  border: 1px solid #999;
  text-align: left;
  font-weight: normal;
  background: var(--head-bg);
}
.files-list__body {
}
.files-list__file {
  cursor: pointer;
}
.files-list__file:hover {
  background: var(--blue);
}
.files-list__file > td {
  padding: 10px;
  border: 1px solid #999;
}
.files-list__file > td:first-child::before {
  content: '\01F4C4';
  margin-right: 1em;
}
.files-list__file_low {
  background: var(--red);
}
.files-list__file_medium {
  background: var(--yellow);
}
.files-list__file_high {
  background: var(--green);
}
.files-list__file_folder > td:first-child::before {
  content: '\01F4C1';
  margin-right: 1em;
}

.file-header {
  border: 1px solid #999;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
  background: var(--bg);
}

.file-header__back {
  margin: 10px;
  cursor: pointer;
  flex-shrink: 0;
  flex-grow: 0;
  text-decoration: underline;
  color: var(--link);
}

.file-header__name {
  margin: 10px;
  flex-shrink: 2;
  flex-grow: 2;
}

.file-header__stat {
  margin: 10px;
  flex-shrink: 0;
  flex-grow: 0;
}

.file-content {
  margin: 10px 0 0;
  border: 1px solid #999;
  padding: 10px;
  counter-reset: line;
  display: flex;
  flex-direction: column;
}

.code-line::before {
  content: counter(line);
  margin-right: 10px;
}
.code-line {
  margin: 0;
  padding: 0.3em;
  height: 1em;
  counter-increment: line;
}
.code-line_covered {
  background: var(--green);
}
.code-line_uncovered {
  background: var(--red);
}

#theme-toggle-label {
  margin-left: 1ch;
}
</style>
</head>

        var data = {"files":[{"path":["/","Users","rcs","git","rcl","src","batcher.rs"],"content":"use crate::config::PostgresConfig;\nuse crate::eip::PipelineConfig;\nuse crate::errors::{BatchPartialFailure, ProcessingError, ValidationError};\nuse crate::metrics::Metrics;\nuse crate::writer::WriterTrait;\n\nuse serde_json::Value;\nuse std::collections::HashMap;\nuse std::sync::Arc;\nuse std::time::{Duration, Instant};\nuse tokio::sync::broadcast;\nuse tokio::time;\nuse tracing::{error, info, warn};\n\n// Default batcher constants\nconst DEFAULT_FLUSH_INTERVAL_MS: u64 = 5_000; // 5 seconds\nconst DEFAULT_MAX_BATCH_SIZE: usize = 5_000;\nconst DEFAULT_MAX_BATCH_BYTES: usize = 10_485_760; // 10 MB\n\n#[derive(Clone, Debug)]\npub struct BatcherConfig {\n    pub flush_interval_ms: u64,\n    pub max_batch_size: usize,\n    pub max_batch_bytes: usize,\n    #[allow(dead_code)]\n    pub shutdown_timeout: Duration,\n}\n\nimpl Default for BatcherConfig {\n    fn default() -\u003e Self {\n        Self {\n            flush_interval_ms: DEFAULT_FLUSH_INTERVAL_MS,\n            max_batch_size: DEFAULT_MAX_BATCH_SIZE,\n            max_batch_bytes: DEFAULT_MAX_BATCH_BYTES,\n            shutdown_timeout: Duration::from_secs(30),\n        }\n    }\n}\n\nimpl BatcherConfig {\n    pub fn from_pipeline_config(\n        _pipeline: \u0026PipelineConfig,\n        postgres: \u0026PostgresConfig,\n        shutdown_timeout: Duration,\n    ) -\u003e Self {\n        Self {\n            flush_interval_ms: DEFAULT_FLUSH_INTERVAL_MS, // Could be made configurable later\n            max_batch_size: postgres.copy_batch_rows,\n            max_batch_bytes: DEFAULT_MAX_BATCH_BYTES, // Could be made configurable later\n            shutdown_timeout,\n        }\n    }\n}\n\n#[derive(Clone, Debug)]\npub struct PipelineBuffer {\n    pub messages: Vec\u003cValue\u003e,\n    pub table: String,\n    pub pipeline_name: String,\n    pub last_flush: Instant,\n    pub current_bytes: usize,\n    pub first_message_time: Option\u003cInstant\u003e,\n}\n\nimpl PipelineBuffer {\n    pub fn new(pipeline_name: String, table: String) -\u003e Self {\n        Self {\n            messages: Vec::new(),\n            table,\n            pipeline_name,\n            last_flush: Instant::now(),\n            current_bytes: 0,\n            first_message_time: None,\n        }\n    }\n\n    pub fn add_message(\n        \u0026mut self,\n        message: Value,\n        config: \u0026BatcherConfig,\n    ) -\u003e Result\u003c(), ProcessingError\u003e {\n        let message_size = serde_json::to_string(\u0026message)\n            .map_err(|e| {\n                ProcessingError::Validation(ValidationError::new(format!(\"json serialize: {}\", e)))\n            })?\n            .len();\n\n        // Check if adding this message would exceed byte limit\n        if self.current_bytes + message_size \u003e config.max_batch_bytes {\n            return Err(ProcessingError::Validation(ValidationError::new(\n                \"message too large for batch\".to_string(),\n            )));\n        }\n\n        if self.messages.is_empty() {\n            self.first_message_time = Some(Instant::now());\n        }\n\n        self.messages.push(message);\n        self.current_bytes += message_size;\n\n        Ok(())\n    }\n\n    pub fn should_flush(\u0026self, config: \u0026BatcherConfig, now: Instant) -\u003e Option\u003cFlushReason\u003e {\n        // Size-based flush\n        if self.messages.len() \u003e= config.max_batch_size {\n            return Some(FlushReason::Size);\n        }\n\n        // Byte-based flush\n        if self.current_bytes \u003e= config.max_batch_bytes {\n            return Some(FlushReason::Bytes);\n        }\n\n        // Time-based flush\n        if now.duration_since(self.last_flush) \u003e= Duration::from_millis(config.flush_interval_ms) {\n            return Some(FlushReason::Time);\n        }\n\n        None\n    }\n\n    pub fn clear(\u0026mut self) {\n        self.messages.clear();\n        self.current_bytes = 0;\n        self.last_flush = Instant::now();\n        self.first_message_time = None;\n    }\n\n    pub fn is_empty(\u0026self) -\u003e bool {\n        self.messages.is_empty()\n    }\n\n    #[allow(dead_code)]\n    pub fn len(\u0026self) -\u003e usize {\n        self.messages.len()\n    }\n}\n\n#[derive(Clone, Debug, PartialEq, Eq)]\npub enum FlushReason {\n    Time,\n    Size,\n    Bytes,\n    Shutdown,\n}\n\nimpl std::fmt::Display for FlushReason {\n    fn fmt(\u0026self, f: \u0026mut std::fmt::Formatter\u003c'_\u003e) -\u003e std::fmt::Result {\n        match self {\n            FlushReason::Time =\u003e write!(f, \"time\"),\n            FlushReason::Size =\u003e write!(f, \"size\"),\n            FlushReason::Bytes =\u003e write!(f, \"bytes\"),\n            FlushReason::Shutdown =\u003e write!(f, \"shutdown\"),\n        }\n    }\n}\n\npub struct Batcher {\n    buffers: HashMap\u003cString, PipelineBuffer\u003e,\n    config: BatcherConfig,\n    writer: Arc\u003cdyn WriterTrait\u003e,\n    metrics: Metrics,\n    #[allow(dead_code)]\n    shutdown_rx: broadcast::Receiver\u003c()\u003e,\n}\n\nimpl Batcher {\n    pub fn new(\n        config: BatcherConfig,\n        writer: Arc\u003cdyn WriterTrait\u003e,\n        metrics: Metrics,\n        shutdown_rx: broadcast::Receiver\u003c()\u003e,\n    ) -\u003e Self {\n        Self {\n            buffers: HashMap::new(),\n            config,\n            writer,\n            metrics,\n            shutdown_rx,\n        }\n    }\n\n    pub async fn add_message(\n        \u0026mut self,\n        pipeline_name: \u0026str,\n        table: \u0026str,\n        message: Value,\n    ) -\u003e Result\u003c(), ProcessingError\u003e {\n        let buffer_key = format!(\"{}:{}\", pipeline_name, table);\n\n        // Check if we need to flush first\n        let should_flush = {\n            if let Some(buffer) = self.buffers.get(\u0026buffer_key) {\n                let now = Instant::now();\n                buffer.should_flush(\u0026self.config, now)\n            } else {\n                None\n            }\n        };\n\n        // Add message to buffer\n        let buffer = self\n            .buffers\n            .entry(buffer_key.clone())\n            .or_insert_with(|| PipelineBuffer::new(pipeline_name.to_string(), table.to_string()));\n\n        buffer.add_message(message, \u0026self.config)?;\n        self.metrics.batch_messages_total.inc();\n\n        // Check if buffer should be flushed immediately after adding\n        let now = Instant::now();\n        let should_flush_after = buffer.should_flush(\u0026self.config, now);\n\n        if should_flush.is_some() || should_flush_after.is_some() {\n            // Prefer the pre-add flush reason (should_flush) if present; this\n            // preserves the original trigger detected before adding the message\n            // so metrics and logging reflect what caused the flush.\n            let reason = should_flush.or(should_flush_after).unwrap();\n            self.flush_buffer_by_key(\u0026buffer_key, reason).await?;\n        }\n\n        Ok(())\n    }\n\n    async fn flush_buffer_by_key(\n        \u0026mut self,\n        buffer_key: \u0026str,\n        reason: FlushReason,\n    ) -\u003e Result\u003c(), ProcessingError\u003e {\n        if let Some(mut buffer) = self.buffers.remove(buffer_key) {\n            self.flush_buffer(\u0026mut buffer, reason).await?;\n            self.buffers.insert(buffer_key.to_string(), buffer);\n        }\n        Ok(())\n    }\n\n    async fn flush_buffer(\n        \u0026mut self,\n        buffer: \u0026mut PipelineBuffer,\n        reason: FlushReason,\n    ) -\u003e Result\u003c(), ProcessingError\u003e {\n        if buffer.is_empty() {\n            return Ok(());\n        }\n\n        let batch_size = buffer.messages.len();\n        let batch_bytes = buffer.current_bytes;\n        let latency = buffer\n            .first_message_time\n            .map(|t| Instant::now().duration_since(t))\n            .unwrap_or(Duration::from_secs(0));\n\n        let messages = buffer.messages.clone();\n        buffer.clear();\n\n        self.metrics.batch_size.observe(batch_size as f64);\n        self.metrics.batch_bytes_total.inc_by(batch_bytes as u64);\n        self.metrics\n            .batch_latency_seconds\n            .observe(latency.as_secs_f64());\n        self.metrics\n            .batch_flush_total\n            .with_label_values(\u0026[\u0026reason.to_string()])\n            .inc();\n\n        info!(\n            pipeline = %buffer.pipeline_name,\n            table = %buffer.table,\n            batch_size = %batch_size,\n            batch_bytes = %batch_bytes,\n            reason = %reason,\n            \"flushing batch\"\n        );\n\n        // Attempt batch write with fallback to individual writes\n        match self\n            .writer\n            .write_batch(\u0026messages, \u0026buffer.table, \u0026buffer.pipeline_name)\n            .await\n        {\n            Ok(()) =\u003e Ok(()),\n            Err(e) =\u003e {\n                warn!(\n                    pipeline = %buffer.pipeline_name,\n                    table = %buffer.table,\n                    batch_size = %batch_size,\n                    error = %e,\n                    \"batch write failed, falling back to individual writes\"\n                );\n\n                // Fallback: try individual writes\n                let mut success_count = 0;\n                let mut failed_messages = Vec::new();\n\n                for message in messages {\n                    match self\n                        .writer\n                        .write(\u0026message, \u0026buffer.table, \u0026buffer.pipeline_name)\n                        .await\n                    {\n                        Ok(()) =\u003e success_count += 1,\n                        Err(write_err) =\u003e {\n                            error!(\n                                pipeline = %buffer.pipeline_name,\n                                table = %buffer.table,\n                                error = %write_err,\n                                \"individual message write failed\"\n                            );\n                            failed_messages.push((message, write_err));\n                        }\n                    }\n                }\n\n                if success_count == 0 {\n                    return Err(e); // All writes failed, return original batch error\n                }\n\n                // Some messages failed - track and return detailed error\n                let failed_count = batch_size - success_count;\n                warn!(\n                    pipeline = %buffer.pipeline_name,\n                    table = %buffer.table,\n                    success_count = %success_count,\n                    failed_count = %failed_count,\n                    total_count = %batch_size,\n                    \"partial batch write failure - some messages failed\"\n                );\n\n                Err(BatchPartialFailure::new(failed_count, batch_size, failed_messages).into())\n            }\n        }\n    }\n\n    #[allow(dead_code)]\n    pub async fn run_background_flush(\u0026mut self) -\u003e Result\u003c(), ProcessingError\u003e {\n        let _interval = time::interval(Duration::from_millis(1000)); // Check every second\n\n        loop {\n            tokio::select! {\n                result = self.shutdown_rx.recv() =\u003e {\n                    match result {\n                        Ok(()) | Err(broadcast::error::RecvError::Closed) =\u003e {\n                            info!(\"batcher received shutdown signal, flushing all buffers\");\n                            self.flush_all_buffers(FlushReason::Shutdown).await?;\n                            break;\n                        }\n                        Err(broadcast::error::RecvError::Lagged(n)) =\u003e {\n                            warn!(missed = n, \"batcher shutdown receiver lagged, continuing\");\n                            // Continue loop - this isn't a shutdown signal\n                        }\n                    }\n                }\n            }\n        }\n\n        Ok(())\n    }\n\n    pub async fn flush_pending_buffers(\u0026mut self) -\u003e Result\u003c(), ProcessingError\u003e {\n        let now = Instant::now();\n\n        // Collect keys that need flushing and flush them immediately\n        let buffer_keys: Vec\u003cString\u003e = self.buffers.keys().cloned().collect();\n\n        for key in buffer_keys {\n            if let Some(mut buffer) = self.buffers.remove(\u0026key) {\n                if let Some(reason) = buffer.should_flush(\u0026self.config, now) {\n                    if let Err(e) = self.flush_buffer(\u0026mut buffer, reason).await {\n                        // Re-insert buffer to prevent data loss, then propagate error\n                        self.buffers.insert(key, buffer);\n                        return Err(e);\n                    }\n                }\n                if !buffer.is_empty() {\n                    self.buffers.insert(key, buffer);\n                }\n            }\n        }\n\n        Ok(())\n    }\n\n    pub async fn flush_all_buffers(\u0026mut self, reason: FlushReason) -\u003e Result\u003c(), ProcessingError\u003e {\n        let buffer_keys: Vec\u003cString\u003e = self.buffers.keys().cloned().collect();\n\n        for key in buffer_keys {\n            if let Some(mut buffer) = self.buffers.remove(\u0026key) {\n                if !buffer.is_empty() {\n                    self.flush_buffer(\u0026mut buffer, reason.clone()).await?;\n                }\n            }\n        }\n\n        Ok(())\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use std::sync::Arc;\n\n    fn create_test_config() -\u003e BatcherConfig {\n        BatcherConfig {\n            flush_interval_ms: 100, // Short for testing\n            max_batch_size: 3,\n            max_batch_bytes: 1000,\n            shutdown_time ialize)]\npub struct ServiceConfig {\n    pub log_level: LogLevel,\n    pub metrics_port: u16,\n    pub otlp_endpoint: Option\u003cString\u003e,\n    #[serde(default = \"default_health_check_timeout_ms\")]\n    pub health_check_timeout_ms: u64,\n    #[serde(default = \"default_shutdown_timeout\")]\n    pub shutdown_timeout: String,\n}\n\nfn default_health_check_timeout_ms() -\u003e u64 {\n    5000\n}\n\nfn default_shutdown_timeout() -\u003e String {\n    \"30s\".to_string()\n}\n\nimpl ServiceConfig {\n    pub fn shutdown_timeout_duration(\u0026self) -\u003e std::time::Duration {\n        parse_duration(\u0026self.shutdown_timeout).unwrap_or(std::time::Duration::from_secs(30))\n    }\n}\n\nfn parse_duration(s: \u0026str) -\u003e Result\u003cstd::time::Duration, std::num::ParseIntError\u003e {\n    if s.ends_with('s') {\n        let secs: u64 = s.trim_end_matches('s').parse()?;\n        Ok(std::time::Duration::from_secs(secs))\n    } else {\n        // fallback to seconds if no suffix\n        let secs: u64 = s.parse()?;\n        Ok(std::time::Duration::from_secs(secs))\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n\n    #[test]\n    fn test_parse_duration_with_s() {\n        let d = parse_duration(\"45s\").unwrap();\n        assert_eq!(d.as_secs(), 45);\n    }\n\n    #[test]\n    fn test_parse_duration_plain_number() {\n        let d = parse_duration(\"10\").unwrap();\n        assert_eq!(d.as_secs(), 10);\n    }\n\n    #[test]\n    fn test_parse_duration_invalid() {\n        assert!(parse_duration(\"1m\").is_err());\n    }\n\n    #[test]\n    fn test_service_shutdown_timeout_duration() {\n        let svc = ServiceConfig {\n            log_level: LogLevel::Info,\n            metrics_port: 9000,\n            otlp_endpoint: None,\n            health_check_timeout_ms: 5000,\n            shutdown_timeout: \"60s\".to_string(),\n        };\n        let dur = svc.shutdown_timeout_duration();\n        assert_eq!(dur.as_secs(), 60);\n    }\n\n    #[test]\n    fn test_loglevel_display() {\n        assert_eq!(LogLevel::Debug.to_string(), \"debug\");\n        assert_eq!(LogLevel::Info.to_string(), \"info\");\n        assert_eq!(LogLevel::Warn.to_string(), \"warn\");\n        assert_eq!(LogLevel::Error.to_string(), \"error\");\n    }\n\n    #[test]\n    fn test_loglevel_equality() {\n        assert_eq!(LogLevel::Info, LogLevel::Info);\n        assert_ne!(LogLevel::Info, LogLevel::Debug);\n    }\n\n    #[test]\n    fn test_service_config_with_otlp_endpoint() {\n        let svc = ServiceConfig {\n            log_level: LogLevel::Debug,\n            metrics_port: 8080,\n            otlp_endpoint: Some(\"http://localhost:4317\".to_string()),\n            health_check_timeout_ms: 3000,\n            shutdown_timeout: \"30s\".to_string(),\n        };\n        assert_eq!(svc.metrics_port, 8080);\n        assert!(svc.otlp_endpoint.is_some());\n    }\n\n    #[test]\n    fn test_postgres_pool_config_validation_valid() {\n        let cfg = PostgresPoolConfig {\n            max_connections: 10,\n            acquire_timeout_ms: 5000,\n        };\n        assert!(cfg.validate().is_ok());\n    }\n\n    #[test]\n    fn test_postgres_pool_config_validation_zero_connections() {\n        let cfg = PostgresPoolConfig {\n            max_connections: 0,\n            acquire_timeout_ms: 5000,\n        };\n        assert!(cfg.validate().is_err());\n    }\n\n    #[test]\n    fn test_postgres_pool_config_validation_zero_timeout() {\n        let cfg = PostgresPoolConfig {\n            max_connections: 10,\n            acquire_timeout_ms: 0,\n        };\n        assert!(cfg.validate().is_err());\n    }\n\n    #[test]\n    fn test_postgres_config_validation_with_pool() {\n        let cfg = PostgresConfig {\n            url: \"postgres://localhost/db\".to_string(),\n            ssl_mode: None,\n            ssl_root_cert: None,\n            pool: Some(PostgresPoolConfig {\n                max_connections: 20,\n                acquire_timeout_ms: 10000,\n            }),\n            copy_enabled: true,\n            copy_batch_rows: 1000,\n            insert_batch_rows: 100,\n        };\n        assert!(cfg.validate().is_ok());\n    }\n\n    #[test]\n    fn test_postgres_config_validation_invalid_pool() {\n        let cfg = PostgresConfig {\n            url: \"postgres://localhost/db\".to_string(),\n            ssl_mode: None,\n            ssl_root_cert: None,\n            pool: Some(PostgresPoolConfig {\n                max_connections: 0,\n                acquire_timeout_ms: 10000,\n            }),\n            copy_enabled: true,\n            copy_batch_rows: 1000,\n            insert_batch_rows: 100,\n        };\n        assert!(cfg.validate().is_err());\n    }\n\n    #[test]\n    fn test_validate_table_identifier_simple() {\n        assert!(validate_table_identifier(\"users\").is_ok());\n        assert!(validate_table_identifier(\"orders\").is_ok());\n        assert!(validate_table_identifier(\"_temp\").is_ok());\n    }\n\n    #[test]\n    fn test_validate_table_identifier_with_schema() {\n        assert!(validate_table_identifier(\"public.users\").is_ok());\n        assert!(validate_table_identifier(\"staging.orders\").is_ok());\n        assert!(validate_table_identifier(\"schema_1.table_1\").is_ok());\n    }\n\n    #[test]\n    fn test_validate_table_identifier_single_char() {\n        assert!(validate_table_identifier(\"a\").is_ok());\n        assert!(validate_table_identifier(\"_\").is_ok());\n        assert!(validate_table_identifier(\"a.b\").is_ok());\n    }\n\n    #[test]\n    fn test_validate_table_identifier_empty() {\n        assert!(validate_table_identifier(\"\").is_err());\n    }\n\n    #[test]\n    fn test_validate_table_identifier_invalid_start() {\n        assert!(validate_table_identifier(\"1users\").is_err());\n        assert!(validate_table_identifier(\"-table\").is_err());\n    }\n\n    #[test]\n    fn test_validate_table_identifier_invalid_chars() {\n        assert!(validate_table_identifier(\"user-data\").is_err());\n        assert!(validate_table_identifier(\"user data\").is_err());\n        assert!(validate_table_identifier(\"user;data\").is_err());\n        assert!(validate_table_identifier(\"user'data\").is_err());\n    }\n\n    #[test]\n    fn test_validate_table_identifier_too_many_dots() {\n        assert!(validate_table_identifier(\"a.b.c\").is_err());\n    }\n\n    #[test]\n    fn test_validate_table_identifier_empty_parts() {\n        assert!(validate_table_identifier(\".table\").is_err());\n        assert!(validate_table_identifier(\"schema.\").is_err());\n    }\n\n    #[test]\n    fn test_validate_table_identifier_too_long() {\n        let long = \"a\".repeat(64);\n        assert!(validate_table_identifier(\u0026long).is_err());\n\n        let long_with_schema = format!(\"a.{}\", \"b\".repeat(64));\n        assert!(validate_table_identifier(\u0026long_with_schema).is_err());\n    }\n\n    #[test]\n    fn test_validate_table_identifier_sql_injection_attempts() {\n        assert!(validate_table_identifier(\"users; DROP TABLE users;--\").is_err());\n        assert!(validate_table_identifier(\"users' OR '1'='1\").is_err());\n        assert!(validate_table_identifier(\"users/**/\").is_err());\n    }\n}\n\n#[derive(Clone, Debug, Deserialize, Serialize)]\npub struct KafkaSecurityConfig {\n    pub tls: bool,\n    pub sasl_enabled: bool,\n    pub sasl_mechanism: Option\u003cString\u003e,\n    pub sasl_username: Option\u003cString\u003e,\n    pub sasl_password: Option\u003cString\u003e,\n    pub ssl_ca_location: Option\u003cString\u003e,\n    pub ssl_certificate_location: Option\u003cString\u003e,\n    pub ssl_key_location: Option\u003cString\u003e,\n    pub ssl_key_password: Option\u003cString\u003e,\n}\n\n#[derive(Clone, Debug, Deserialize, Serialize)]\npub struct KafkaFetchConfig {\n    pub max_bytes: i32,\n    pub max_wait_ms: i32,\n}\n\n#[derive(Clone, Debug, Deserialize, Serialize)]\npub struct KafkaConfig {\n    pub brokers: String,\n    pub group_id: String,\n    #[serde(default)]\n    pub security: Option\u003cKafkaSecurityConfig\u003e,\n    #[serde(default)]\n    pub fetch: Option\u003cKafkaFetchConfig\u003e,\n    pub session_timeout_ms: u32,\n    pub max_inflight_messages: usize,\n    pub producer_retries: i32,\n    pub dlq_message_timeout_ms: u32,\n    pub compression: String,\n    #[serde(default = \"default_dlq_readiness_timeout_secs\")]\n    pub dlq_readiness_timeout_secs: u64,\n    #[serde(default = \"default_dlq_readiness_backoff_secs\")]\n    pub dlq_readiness_backoff_secs: u64,\n    #[serde(default = \"default_staleness_threshold_seconds\")]\n    pub staleness_threshold_seconds: u64,\n}\n\nfn default_dlq_readiness_timeout_secs() -\u003e u64 {\n    30\n}\n\nfn default_dlq_readiness_backoff_secs() -\u003e u64 {\n    1\n}\n\nfn default_staleness_threshold_seconds() -\u003e u64 {\n    60\n}\n\n#[derive(Clone, Debug, Deserialize, Serialize)]\npub struct PostgresPoolConfig {\n    pub max_connections: u32,\n    pub acquire_timeout_ms: u64,\n}\n\nimpl PostgresPoolConfig {\n    pub fn validate(\u0026self) -\u003e Result\u003c()\u003e {\n        ensure!(\n            self.max_connections \u003e 0,\n            \"max_connections must be greater than 0\"\n        );\n        ensure!(\n            self.acquire_timeout_ms \u003e 0,\n            \"acquire_timeout_ms must be greater than 0\"\n        );\n        Ok(())\n    }\n}\n\n#[derive(Clone, Debug, Deserialize, Serialize)]\npub struct PostgresConfig {\n    pub url: String,\n    pub ssl_mode: Option\u003cString\u003e,\n    pub ssl_root_cert: Option\u003cString\u003e,\n    #[serde(default)]\n    pub pool: Option\u003cPostgresPoolConfig\u003e,\n    pub copy_enabled: bool,\n    pub copy_batch_rows: usize,\n    pub insert_batch_rows: usize,\n}\n\nimpl PostgresConfig {\n    pub fn validate(\u0026self) -\u003e Result\u003c()\u003e {\n        if let Some(ref pool) = self.pool {\n            pool.validate()?;\n        }\n        Ok(())\n    }\n}\n\n#[derive(Clone, Debug, Deserialize, Serialize)]\npub struct Config {\n    pub service: ServiceConfig,\n    pub kafka: KafkaConfig,\n    pub postgres: PostgresConfig,\n    pub pipelines: Vec\u003cPipelineConfig\u003e,\n}\n\nimpl Config {\n    /// Load configuration from the path pointed to by the `RCL_CONFIG_PATH` env var.\n    pub fn from_env() -\u003e Result\u003cSelf\u003e {\n        let path = env::var(\"RCL_CONFIG_PATH\")\n            .context(\"RCL_CONFIG_PATH env var is required to load configuration\")?;\n\n        Self::from_file(path)\n    }\n\n    /// Load configuration from a JSON file, applying environment overrides where present.\n    pub fn from_file\u003cP: AsRef\u003cPath\u003e\u003e(path: P) -\u003e Result\u003cSelf\u003e {\n        let path_ref = path.as_ref();\n        let raw = fs::read_to_string(path_ref)\n            .with_context(|| format!(\"failed to read config file at {}\", path_ref.display()))?;\n\n        let mut cfg: Self = serde_json::from_str(\u0026raw)\n            .with_context(|| format!(\"failed to parse config file at {}\", path_ref.display()))?;\n\n        if let Ok(brokers) = env::var(\"RCL_KAFKA_BROKERS\") {\n            if !brokers.trim().is_empty() {\n                cfg.kafka.brokers = brokers;\n            }\n        }\n\n        if let Ok(group_id) = env::var(\"RCL_KAFKA_GROUP_ID\") {\n            if !group_id.trim().is_empty() {\n                cfg.kafka.group_id = group_id;\n            }\n        }\n\n        if let Ok(pg_url) = env::var(\"RCL_POSTGRES_URL\") {\n            if !pg_url.trim().is_empty() {\n                cfg.postgres.url = pg_url;\n            }\n        }\n\n        // Kafka SASL secrets\n        if let Ok(sasl_user) = env::var(\"RCL_KAFKA_SASL_USERNAME\") {\n            if let Some(sec) = \u0026mut cfg.kafka.security {\n                sec.sasl_username = Some(sasl_user);\n            }\n        }\n        if let Ok(sasl_pass) = env::var(\"RCL_KAFKA_SASL_PASSWORD\") {\n            if let Some(sec) = \u0026mut cfg.kafka.security {\n                sec.sasl_password = Some(sasl_pass);\n            }\n        }\n\n        cfg.validate().with_context(|| {\n            format!(\n                \"configuration loaded from {} is invalid\",\n                path_ref.display()\n            )\n        })?;\n\n        Ok(cfg)\n    }\n\n    fn validate(\u0026self) -\u003e Result\u003c()\u003e {\n        self.postgres.validate()?;\n\n        ensure!(\n            self.service.metrics_port \u003e 0,\n            \"service.metrics_port must be greater than zero\"\n        );\n\n        ensure!(\n            self.service.health_check_timeout_ms \u003e 0,\n            \"health_check_timeout_ms must be greater than 0\"\n        );\n\n        ensure!(\n            !self.kafka.brokers.trim().is_empty(),\n            \"kafka.brokers is required (set via config file or RCL_KAFKA_BROKERS env)\"\n        );\n        ensure!(\n            !self.kafka.group_id.trim().is_empty(),\n            \"kafka.group_id is required (set via config file or RCL_KAFKA_GROUP_ID env)\"\n        );\n        ensure!(\n            self.kafka.session_timeout_ms \u003e 0,\n            \"kafka.session_timeout_ms must be \u003e 0\"\n        );\n        ensure!(\n            self.kafka.max_inflight_messages \u003e 0,\n            \"kafka.max_inflight_messages must be \u003e 0\"\n        );\n        ensure!(\n            self.kafka.producer_retries \u003e= 0,\n            \"kafka.producer_retries must be \u003e= 0\"\n        );\n        ensure!(\n            self.kafka.dlq_message_timeout_ms \u003e 0,\n            \"kafka.dlq_message_timeout_ms must be \u003e 0\"\n        );\n        ensure!(\n            !self.kafka.compression.trim().is_empty(),\n            \"kafka.compression is required (e.g. lz4, snappy, gzip)\"\n        );\n\n        if let Some(fetch) = \u0026self.kafka.fetch {\n            ensure!(fetch.max_bytes \u003e 0, \"kafka.fetch.max_bytes must be \u003e 0\");\n            ensure!(fetch.max_wait_ms \u003e 0, \"kafka.fetch.max_wait_ms must be \u003e 0\");\n        }\n\n        if self.pipelines.is_empty() {\n            bail!(\"at least one pipeline configuration is required\");\n        }\n\n        let mut pipeline_names = HashSet::new();\n        let mut topics = HashSet::new();\n\n        for pipeline in \u0026self.pipelines {\n            ensure!(\n                !pipeline.name.trim().is_empty(),\n                \"pipeline.name is required\"\n            );\n            if !pipeline_names.insert(\u0026pipeline.name) {\n                bail!(\"duplicate pipeline name: {}\", pipeline.name);\n            }\n\n            ensure!(\n                !pipeline.topic.trim().is_empty(),\n                \"pipeline.topic is required\"\n            );\n            if !topics.insert(\u0026pipeline.topic) {\n                bail!(\"duplicate topic across pipelines: {}\", pipeline.topic);\n            }\n\n            validate_table_identifier(\u0026pipeline.staging_table).with_context(|| {\n                format!(\"invalid staging_table for pipeline '{}'\", pipeline.name)\n            })?;\n\n            if let Some(dlq) = \u0026pipeline.dlq {\n                ensure!(\n                    !dlq.topic.trim().is_empty(),\n                    \"pipeline.dlq.topic is required\"\n                );\n                ensure!(dlq.max_retries \u003e 0, \"pipeline.dlq.max_retries must be \u003e 0\");\n                ensure!(\n                    dlq.max_payload_bytes \u003e 0,\n                    \"pipeline.dlq.max_payload_bytes must be \u003e 0\"\n                );\n            }\n            ensure!(\n                pipeline.backpressure.channel_capacity \u003e 0,\n                \"pipeline.backpressure.channel_capacity must be \u003e 0\"\n            );\n\n            if self.postgres.copy_batch_rows \u003e pipeline.backpressure.channel_capacity {\n                eprintln!(\n                    \"WARN: pipeline '{}': postgres.copy_batch_rows ({}) \u003e backpressure.channel_capa r: Arc\u003cStreamConsumer\u003e,\n    batcher: Arc\u003ctokio::sync::Mutex\u003cBatcher\u003e\u003e,\n    metrics: Metrics,\n    health: Arc\u003cHealthRegistry\u003e,\n    pipelines_by_topic: HashMap\u003cString, Pipeline\u003e,\n    producer: Option\u003cFutureProducer\u003e,\n}\n\nimpl ConsumerContext {\n    async fn add_to_batcher(\n        \u0026self,\n        pipeline_name: \u0026str,\n        table: \u0026str,\n        message: Value,\n    ) -\u003e Result\u003c(), ProcessingError\u003e {\n        let mut batcher = self.batcher.lock().await;\n        batcher.add_message(pipeline_name, table, message).await\n    }\n}\n\nasync fn handle_decode_error(\n    health: \u0026Arc\u003cHealthRegistry\u003e,\n    metrics: \u0026Metrics,\n    pipeline: \u0026Pipeline,\n    ctx: \u0026MessageContext,\n    error_msg: String,\n) {\n    if let Err(err) = health.update_pipeline_error(\u0026pipeline.name, error_msg.clone()) {\n        warn!(\"Failed to update pipeline error status: {}\", err);\n    }\n    metrics.decode_failures.inc();\n    warn!(context = %ctx.correlation_id(), error = %error_msg, \"decode error\");\n}\n\nimpl ConsumerContext {\n    async fn process_message(\n        \u0026self,\n        payload: \u0026str,\n        pipeline: \u0026Pipeline,\n        ctx: \u0026MessageContext,\n    ) -\u003e Result\u003c(), ProcessingError\u003e {\n        let mut decoded = decode_and_validate(payload.as_bytes(), \u0026pipeline.config)?;\n\n        if let serde_json::Value::Object(ref mut map) = decoded {\n            map.insert(\n                \"_meta_topic\".to_string(),\n                serde_json::Value::String(ctx.topic.clone()),\n            );\n            map.insert(\n                \"_meta_partition\".to_string(),\n                serde_json::Value::Number(ctx.partition.into()),\n            );\n            map.insert(\n                \"_meta_offset\".to_string(),\n                serde_json::Value::Number(ctx.offset.into()),\n            );\n            map.ins                         // timeout, empty poll\n                        last_poll.store(\n                            SystemTime::now()\n                                .duration_since(UNIX_EPOCH)\n                                .unwrap()\n                                .as_millis() as u64,\n                            Ordering::Relaxed,\n                        );\n                    }\n                }\n            }\n        }\n    }\n}\n\nasync fn run_heartbeat_task(\n    last_poll: Arc\u003cAtomicU64\u003e,\n    health: Arc\u003cHealthRegistry\u003e,\n    metrics: Metrics,\n    staleness_threshold_seconds: u64,\n    mut shutdown_rx: broadcast::Receiver\u003c()\u003e,\n) {\n    let mut interval = interval(Duration::from_secs(30));\n    loop {\n        tokio::select! {\n            _ = shutdown_rx.recv() =\u003e {\n                info!(\"heartbeat task shutting down\");\n                break;\n            }\n            _ = interval.tick() =\u003e {\n                let now = SystemTime::now()\n                    .duration_since(UNIX_EPOCH)\n                    .unwrap()\n                    .as_millis() as u64;\n                let last = last_poll.load(Ordering::Relaxed);\n                metrics.last_poll_timestamp.set(last as i64);\n                if now - last \u003e staleness_threshold_seconds * 1000 {\n                    let _ = health.set_kafka_status(ComponentStatus::Unhealthy);\n                } else {\n                    let _ = health.set_kafka_status(ComponentStatus::Healthy);\n                }\n            }\n        }\n    }\n}\n\nasync fn run_processing_loop(\n    rx: mpsc::Receiver\u003c(MessageContext, OwnedMessage)\u003e,\n    context: ConsumerContext,\n    consumer: Arc\u003cStreamConsumer\u003e,\n) {\n    let mut stream = ReceiverStream::new(rx);\n    let mut latest_offsets: HashMap\u003c(String, i32), i64\u003e = HashMap::new();\n\n    while let Some((ctx, msg)) = stream.next().await {\n        let pipeline = match context.pipelines_by_topic.get(\u0026ctx.topic) {\n            Some(p) =\u003e p,\n            None =\u003e {\n                warn!(context = %ctx.correlation_id(), \"no pipeline for topic\");\n                continue;\n            }\n        };\n\n        let payload = match msg.payload_view::\u003cstr\u003e() {\n            Some(Ok(p)) =\u003e p.to_string(),\n            Some(Err(e)) =\u003e {\n                handle_decode_error(\n                    \u0026context.health,\n                    \u0026context.metrics,\n                    pipeline,\n                    \u0026ctx,\n                    format!(\"utf8 decode failed: {}\", e),\n                )\n                .await;\n                continue;\n            }\n            None =\u003e {\n                handle_decode_error(\n                    \u0026context.health,\n                    \u0026context.metrics,\n                    pipeline,\n                    \u0026ctx,\n                    \"empty payload\".to_string(),\n                )\n                .await;\n                continue;\n            }\n        };\n\n        match context.process_message(\u0026payload, pipeline, \u0026ctx).await {\n            Ok(_) =\u003e {\n                latest_offsets.insert((ctx.topic.clone(), ctx.partition), ctx.offset + 1);\n                if let Err(err) = commit_offset(\u0026consumer, \u0026ctx) {\n                    context.metrics.processing_failures.inc();\n                    warn!(context = %ctx.correlation_id(), error = %err, \"offset commit failed\");\n                }\n            }\n            Err(reason) =\u003e {\n                context\n                    .handle_processing_error(pipeline, \u0026ctx, \u0026reason, \u0026payload)\n                    .await;\n            }\n        }\n    }\n\n    // Final commit\n    if !latest_offsets.is_empty() {\n        info!(\"Performing final offset commit\");\n        let mut tpl = TopicPartitionList::new();\n        for ((topic, partition), offset) in latest_offsets {\n            if let Err(e) = tpl.add_partition_offset(\u0026topic, partition, Offset::Offset(offset)) {\n                warn!(\"Failed to add partition offset to list: {}\", e);\n            }\n        }\n        if let Err(e) = consumer.commit(\u0026tpl, CommitMode::Sync) {\n            error!(\"Final offset commit failed: {}\", e);\n        } else {\n            info!(\"Final offset commit successful\");\n        }\n    }\n}\n\npub async fn replay(\n    cfg: Arc\u003cConfig\u003e,\n    writer: Arc\u003cdyn WriterTrait\u003e,\n    _metrics: Metrics,\n    topic: String,\n    partition: i32,\n    start_offset: i64,\n    end_offset: i64,\n) -\u003e Result\u003c()\u003e {\n    let pipelines_by_topic: HashMap\u003cString, Pipeline\u003e = cfg\n        .pipelines\n        .iter()\n        .map(|p| {\n            let pipeline = Pipeline::from_config(p)?;\n            Ok((p.topic.clone(), pipeline))\n        })\n        .collect::\u003cResult\u003cHashMap\u003c_, _\u003e\u003e\u003e()?;\n\n    let pipeline = pipelines_by_topic\n        .get(\u0026topic)\n        .ok_or_else(|| anyhow::anyhow!(\"No pipeline found for topic {}\", topic))?\n        .clone();\n\n    let consumer: StreamConsumer = rdkafka::config::ClientConfig::new()\n        .set(\"bootstrap.servers\", \u0026cfg.kafka.brokers)\n        .set(\"group.id\", format!(\"rcl-replay-{}\", uuid::Uuid::new_v4()))\n        .set(\"enable.auto.commit\", \"false\")\n        .set(\"auto.offset.reset\", \"earliest\")\n        .create()?;\n\n    let mut tpl = TopicPartitionList::new();\n    tpl.add_partition_offset(\u0026topic, partition, Offset::Offset(start_offset))?;\n    consumer.assign(\u0026tpl)?;\n\n    info!(\n        \"Replaying {}:{} from {} to {}\",\n        topic, partition, start_offset, end_offset\n    );\n\n    // For replay, we'll use the writer directly since batching isn't needed\n    let context = ConsumerContext {\n        consumer: Arc::new(consumer),\n        batcher: Arc::new(tokio::sync::Mutex::new(Batcher::new(\n            BatcherConfig::default(),\n            writer.clone(),\n            _metrics.clone(),\n            ShutdownCoordinator::default().subscribe(),\n        ))), // Not used in replay\n        metrics: _metrics,\n        health: Arc::new(HealthRegistry::new(Duration::from_secs(30))), // Not used in replay\n        pipelines_by_topic,\n        producer: None, // DLQ not used in replay\n    };\n\n    let mut stream = context.consumer.stream();\n\n    while let Some(message) = stream.next().await {\n        match message {\n            Ok(msg) =\u003e {\n                if msg.offset() \u003e end_offset {\n                    info!(\"Reached end offset {}\", end_offset);\n                    break;\n                }\n\n                let ctx = MessageContext {\n                    topic: msg.topic().to_string(),\n                    partition: msg.partition(),\n                    offset: msg.offset(),\n                    timestamp: msg.timestamp().to_millis().unwrap_or(0),\n                };\n\n                match msg.payload() {\n                    Some(payload) =\u003e match std::str::from_utf8(payload) {\n                        Ok(payload_str) =\u003e {\n                            match context.process_message(payload_str, \u0026pipeline, \u0026ctx).await {\n                                Ok(_) =\u003e {\n                                    info!(context = %ctx.correlation_id(), \"replayed successfully\");\n                                }\n                                Err(e) =\u003e {\n                                    error!(context = %ctx.correlation_id(), error = %e, \"processing failed during replay; stopping\");\n                                    return Err(e.into());\n                                }\n                            }\n                        }\n                        Err(e) =\u003e {\n                            error!(context = %ctx.correlation_id(), error = %e, \"invalid UTF-8 payload\");\n                            return Err(e.into());\n                        }\n                    },\n                    None =\u003e {\n                        warn!(context = %ctx.correlation_id(), \"missing payload\");\n                    }\n                }\n            }\n            Err(e) =\u003e {\n                error!(\"Kafka error: {}\", e);\n                return Err(e.into());\n            }\n        }\n    }\n\n    Ok(())\n}\n\npub async fn run(\n    cfg: Arc\u003cConfig\u003e,\n    writer: Arc\u003cdyn WriterTrait\u003e,\n    metrics: Metrics,\n    shutdown_rx: broadcast::Receiver\u003c()\u003e,\n    health: Arc\u003cHealthRegistry\u003e,\n) -\u003e Result\u003c()\u003e {\n    let pipelines_by_topic: HashMap\u003cString, Pipeline\u003e = cfg\n        .pipelines\n        .iter()\n        .map(|p| {\n            let pipeline = Pipeline::from_config(p)?;\n            Ok((p.topic.clone(), pipeline))\n        })\n        .collect::\u003cResult\u003cHashMap\u003c_, _\u003e\u003e\u003e()?;\n\n    for p in \u0026cfg.pipelines {\n        health.register_pipeline(\u0026p.name);\n    }\n\n    let shutdown_rx_heartbeat = shutdown_rx.resubscribe();\n    let shutdown_rx_fetch = shutdown_rx.resubscribe();\n\n    let capacity = cfg\n        .pipelines\n        .iter()\n        .map(|p| p.backpressure.channel_capacity)\n        .max()\n        .unwrap_or(1024);\n\n    let consumer = Arc::new(build_consumer(\u0026cfg.kafka)?);\n    let last_poll = Arc::new(AtomicU64::new(\n        SystemTime::now()\n            .duration_since(UNIX_EPOCH)\n            .unwrap()\n            .as_millis() as u64,\n    ));\n\n    consumer.subscribe(\n        \u0026cfg.pipelines\n            .iter()\n            .map(|p| p.topic.as_str())\n            .collect::\u003cVec\u003c_\u003e\u003e(),\n    )?;\n\n    let dlq_enabled = cfg.pipelines.iter().any(|p| p.dlq.is_some());\n    let producer = if dlq_enabled {\n        Some(dlq::build_producer(\u0026cfg.kafka)?)\n    } else {\n        None\n    };\n\n    // Create batcher subscribed to the main shutdown receiver so it\n    // observes the same shutdown event as other tasks.\n    let shutdown_rx_batcher = shutdown_rx.resubscribe();\n    let first_pipeline = cfg\n        .pipelines\n        .first()\n        .ok_or_else(|| anyhow::anyhow!(\"No pipelines configured\"))?;\n    let batcher_config = BatcherConfig::from_pipeline_config(\n        first_pipeline, // Use first pipeline for config, could be made per-pipeline later\n        \u0026cfg.postgres,\n        cfg.service.shutdown_timeout_duration(),\n    );\n    let batcher = Arc::new(tokio::sync::Mutex::new(Batcher::new(\n        batcher_config,\n        writer.clone(),\n        metrics.clone(),\n        shutdown_rx_batcher,\n    )));\n\n    let (tx, rx) = mpsc::channel::\u003c(MessageContext, OwnedMessage)\u003e(capacity);\n\n    let context = ConsumerContext {\n        consumer: consumer.clone(),\n        batcher: batcher.clone(),\n        metrics: metrics.clone(),\n        health: health.clone(),\n        pipelines_by_topic,\n        producer,\n    };\n\n    let fetch_loop = tokio::spawn(run_fetch_loop(\n        consumer.clone(),\n        tx,\n        metrics.clone(),\n        health.clone(),\n        last_poll.clone(),\n        shutdown_rx_fetch,\n    ));\n\n    let heartbeat_task = tokio::spawn(run_heartbeat_task(\n        last_poll,\n        health.clone(),\n        metrics,\n        cfg.kafka.staleness_threshold_seconds,\n        shutdown_rx_heartbeat,\n    ));\n\n    let processing_loop = tokio::spawn(run_processing_loop(rx, context, consumer));\n\n    // Spawn batcher background flush task. Use a resubscribe so this task\n    // listens to the same shutdown broadcast passed into `run`.\n    let mut shutdown_rx_for_task = shutdown_rx.resubscribe();\n    let batcher_task = tokio::spawn(async move {\n        let mut interval = tokio::time::interval(std::time::Duration::from_millis(1000)); // Check every second\n\n        loop {\n            tokio::select! {\n                _ = shutdown_rx_for_task.recv() =\u003e {\n                    info!(\"batcher received shutdown signal, flushing all buffers\");\n                    let mut batcher_guard = batcher.lock().await;\n                    if let Err(e) = batcher_guard.flush_all_buffers(crate::batcher::FlushReason::Shutdown).await {\n                        error!(\"batcher shutdown flush failed: {}\", e);\n                    }\n                    break;\n                }\n                _ = interval.tick() =\u003e {\n                    let mut batcher_guard = batcher.lock().await;\n                    if let Err(e) = batcher_guard.flush_pending_buffers().await {\n                        error!(\"batcher background flush failed: {}\", e);\n                    }\n                }\n            }\n        }\n    });\n\n    tokio::try_join!(fetch_loop, processing_loop, heartbeat_task, batcher_task)?;\n    info!(\"consumer loops stopped\");\n    Ok(())\n}\n\nfn build_consumer(cfg: \u0026KafkaConfig) -\u003e Result\u003cStreamConsumer\u003e {\n    let mut client_config = rdkafka::config::ClientConfig::new();\n    client_config\n        .set(\"bootstrap.servers\", \u0026cfg.brokers)\n        .set(\"group.id\", \u0026cfg.group_id)\n        .set(\"enable.partition.eof\", \"false\")\n        .set(\"session.timeout.ms\", cfg.session_timeout_ms.to_string())\n        .set(\"enable.auto.commit\", \"false\")\n        .set(\"enable.auto.offset.store\", \"false\")\n        .set(\n            \"max.in.flight.requests.per.connection\",\n            cfg.max_inflight_messages.to_string(),\n        );\n\n    if let Some(fetch) = \u0026cfg.fetch {\n        client_config.set(\"fetch.message.max.bytes\", fetch.max_bytes.to_string());\n        client_config.set(\"fetch.wait.max.ms\", fetch.max_wait_ms.to_string());\n    }\n\n    if let Some(sec) = \u0026cfg.security {\n        let protocol = if sec.sasl_enabled \u0026\u0026 sec.tls {\n            Some(\"SASL_SSL\")\n        } else if sec.sasl_enabled {\n            Some(\"SASL_PLAINTEXT\")\n        } else if sec.tls {\n            Some(\"SSL\")\n        } else {\n            None\n        };\n        if let Some(p) = protocol {\n            client_config.set(\"security.protocol\", p);\n        }\n\n        if sec.tls {\n            if let Some(ca) = \u0026sec.ssl_ca_location {\n                client_config.set(\"ssl.ca.location\", ca);\n            }\n            if let Some(cert) = \u0026sec.ssl_certificate_location {\n                client_config.set(\"ssl.certificate.location\", cert);\n            }\n            if let Some(key) = \u0026sec.ssl_key_location {\n                client_config.set(\"ssl.key.location\", key);\n            }\n            if let Some(pass) = \u0026sec.ssl_key_password {\n                client_config.set(\"ssl.key.password\", pass);\n            }\n        }\n\n        if sec.sasl_enabled {\n            if let Some(mech) = \u0026sec.sasl_mechanism {\n                client_config.set(\"sasl.mechanism\", mech);\n            }\n            if let Some(user) = \u0026sec.sasl_username {\n                client_config.set(\"sasl.username\", user);\n            }\n            if let Some(pass) = \u0026sec.sasl_password {\n                client_config.set(\"sasl.password\", pass);\n            }\n        }\n    }\n\n    let consumer: StreamConsumer = client_config.create()?;\n    Ok(consumer)\n}\n\nfn commit_offset(\n    consumer: \u0026StreamConsumer,\n    ctx: \u0026MessageContext,\n) -\u003e Result\u003c(), rdkafka::error::KafkaError\u003e {\n    let mut tpl = rdkafka::TopicPartitionList::new();\n    tpl.add_partition_offset(\n        \u0026ctx.topic,\n        ctx.partition,\n        rdkafka::Offset::Offset(ctx.offset + 1),\n    )?;\n    consumer.commit(\u0026tpl, CommitMode::Async)\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use crate::batcher::BatcherConfig;\n    use crate::eip::PipelineConfig;\n    use crate::metrics::Metrics;\n    use crate::writer::WriterTrait;\n    use async_trait::async_trait;\n    use prometheus::Registry;\n    use std::sync::Arc;\n\n    struct MockWriter;\n    #[async_trait]\n    impl WriterTrait for MockWriter {\n        async fn write(\n            \u0026self,\n            _value: \u0026serde_json::Value,\n            _table: \u0026str,\n            _pipeline_name: \u0026str,\n        ) -\u003e Result\u003c(), ProcessingError\u003e {\n            Ok(())\n        }\n\n        async fn write_batch(\n            \u0026self,\n            _values: \u0026[serde_json::Value],\n            _table: \u0026str,\n            _pipeline_name: \u0026str,\n        ) -\u003e Result\u003c(), ProcessingError\u003e {\n            Ok(())\n        }\n    }\n\n    fn make_metrics() -\u003e Metrics {\n        Metrics::register(\u0026Registry::new()).unwrap()\n    }\n\n    fn make_pipeline_config() -\u003e PipelineConfig {\n        PipelineConfig {\n            name: \"p1\".to_string(),\n            topic: \"t1\".to_string(),\n            debezium_envelope: false,\n            staging_table: \"staging.table\".to_string(),\n            dlq: None,\n            stages: vec![],\n            required_fields: vec![],\n            backpressure: crate::eip::BackpressureConfig::default(),\n        }\n    }\n\n    #[tokio::test]\n    async fn test_handle_decode_error_updates_metrics_and_health() {\n        let metrics = make_metrics();\n        let health = Arc::new(HealthRegistry::new(std::time::Duration::from_secs(60)));\n        let cfg = make_pipeline_config();\n        let pipeline = Pipeline::from_config(\u0026cfg).unwrap();\n\n        let ctx = crate::types::MessageContext::new(\"t1\".to_string(), 0, 1, 0);\n\n        // initial decode_failures value\n        let before = metrics.decode_failures.get();\n\n        handle_decode_error(\u0026health, \u0026metrics, \u0026pipeline, \u0026ctx, \"bad json\".to_string()).await;\n\n        let after = metrics.decode_failures.get();\n        assert_eq!(after, before + 1);\n\n        // pipeline error count should be incremented\n        let status = health.get_status();\n        let p = status.pipelines.get(\"p1\");\n        // pipeline may not be registered in this test, so update_pipeline_error may fail silently\n        // ensure function executes without panic\n        let _ = p;\n    }\n\n    #[tokio::test]\n    async fn test_process_message_adds_to_batcher() {\n        let metrics = make_metrics();\n        let health = Arc::new(HealthRegistry::new(std::time::Duration::from_secs(60)));\n\n        // Setup batcher with mock writer\n        let writer = Arc::new(MockWriter);\n        let batcher_cfg = BatcherConfig::default();\n        let (shutdown_coordinator, _) = crate::shutdown::ShutdownCoordinator::new();\n        let batcher = Arc::new(tokio::sync::Mutex::new(crate::batcher::Batcher::new(\n            batcher_cfg,\n            writer,\n            metrics.clone(),\n            shutdown_coordinator.subscribe(),\n        )));\n\n        let pipeline_cfg = make_pipeline_config();\n        let pipeline = Pipeline::from_config(\u0026pipeline_cfg).unwrap();\n\n        let mut pipelines_by_topic = std::collections::HashMap::new();\n        pipelines_by_topic.insert(pipeline_cfg.topic.clone(), pipeline.clone());\n\n        let ctx = ConsumerContext {\n            consumer: Arc::new(rdkafka::config::ClientConfig::new().create().unwrap()),\n            batcher: batcher.clone(),\n            metrics: metrics.clone(),\n            health: health.clone(),\n            pipelines_by_topic: pipelines_by_topic.clone(),\n            producer: None,\n        };\n\n        let payload = serde_json::json!({\"id\": 9, \"operation_type\": \"c\"}).to_string();\n        let msg_ctx = crate::types::MessageContext::new(\"t1\".to_string(), 0, 5, 0);\n\n        // Process message - should add to batcher without error\n        let res = ctx.process_message(\u0026payload, \u0026pipeline, \u0026msg_ctx).await;\n        assert!(res.is_ok());\n\n        // Now flush all buffers to force writer invocation; if no panic, success.\n        let mut guard = batcher.lock().await;\n        let _ = guard\n            .flush_all_buffers(crate::batcher::FlushReason::Shutdown)\n            .await;\n    }\n\n    #[tokio::test]\n    async fn test_handle_processing_error_increments_processing_and_decode_metrics() {\n        let metrics = make_metrics();\n        let health = Arc::new(HealthRegistry::new(std::time::Duration::from_secs(60)));\n\n        let writer = Arc::new(MockWriter);\n        let batcher_cfg = BatcherConfig::default();\n        let (shutdown_coordinator, _) = crate::shutdown::ShutdownCoordinator::new();\n        let batcher = Arc::new(tokio::sync::Mutex::new(crate::batcher::Batcher::new(\n            batcher_cfg,\n            writer,\n            metrics.clone(),\n            shutdown_coordinator.subscribe(),\n        )));\n\n        let pipeline_cfg = make_pipeline_config();\n        let pipeline = Pipeline::from_config(\u0026pipeline_cfg).unwrap();\n\n        let mut pipelines_by_topic = std::collections::HashMap::new();\n        pipelines_by_topic.insert(pipeline_cfg.topic.clone(), pipeline.clone());\n\n        let ctx = ConsumerContext {\n            consumer: Arc::new(rdkafka::config::ClientConfig::new().create().unwrap()),\n            batcher: batcher.clone(),\n            metrics: metrics.clone(),\n            health: health.clone(),\n            pipelines_by_topic: pipelines_by_topic.clone(),\n            producer: None,\n        };\n\n        let msg_ctx = crate::types::MessageContext::new(\"t1\".to_string(), 0, 5, 0);\n\n        // Validation error should increment decode_failures\n        let val_err = ProcessingError::Validation(ValidationError::new(\"bad\"));\n        let before = metrics.decode_failures.get();\n        ctx.handle_processing_error(\u0026pipeline, \u0026msg_ctx, \u0026val_err, \"payload\")\n            .await;\n        assert_eq!(metrics.decode_failures.get(), before + 1);\n\n        // Transport error should increment processing_failures\n        let io_err = sqlx::Error::Io(std::io::Error::new(std::io::ErrorKind::TimedOut, \"to\"));\n        let t_err = crate::errors::TransportError::new(\"test\", io_err);\n        let p_err = ProcessingError::Transport(t_err);\n        let before2 = metrics.processing_failures.get();\n        ctx.handle_processing_error(\u0026pipeline, \u0026msg_ctx, \u0026p_err, \"payload\")\n            .await;\n        assert_eq!(metrics.processing_failures.get(), before2 + 1);\n    }\n\n    #[tokio::test]\n    async fn test_commit_offset_returns_err_without_brokers() {\n        // Create a minimal consumer (no brokers configured) and expect commit to fail\n        let consumer: StreamConsumer = rdkafka::config::ClientConfig::new().create().unwrap();\n        let ctx = crate::types::MessageContext::new(\"t-x\".to_string(), 1, 42, 0);\n\n        // commit_offset is synchronous but requires the rdkafka reactor which needs a runtime.\n        let res = commit_offset(\u0026consumer, \u0026ctx);\n        assert!(\n            res.is_err(),\n            \"commit_offset should error when no brokers configured\"\n        );\n    }\n\n    #[tokio::test]\n    async fn test_process_message_stage_error_returns_processing_error() {\n        use crate::eip::{Pipeline, Stage, StageContext, StageError, StageResult};\n        use async_trait::async_trait;\n\n        struct ErrorStage;\n        #[async_trait]\n        impl Stage for ErrorStage {\n            async fn process(\n                \u0026self,\n                _ctx: \u0026StageContext,\n                _msg: serde_json::Value,\n            ) -\u003e Result\u003cStageResult, ProcessingError\u003e {\n                Ok(StageResult::Error(StageError::new(\"TEST\", \"boom\")))\n            }\n\n            fn name(\u0026self) -\u003e \u0026str {\n                \"error\"\n            }\n        }\n\n        let metrics = make_metrics();\n        let health = Arc::new(HealthRegistry::new(std::time::Duration::from_secs(60)));\n\n        let writer = Arc::new(MockWriter);\n        let batcher_cfg = BatcherConfig::default();\n        let (shutdown_coordinator, _) = crate::shutdown::ShutdownCoordinator::new();\n        let batcher = Arc::new(tokio::sync::Mutex::new(crate::batcher::Batcher::new(\n            batcher_cfg,\n            writer,\n            metrics.clone(),\n            shutdown_coordinator.subscribe(),\n        )));\n\n        // Build a pipeline manually with an ErrorStage\n        let cfg = make_pipeline_config();\n        let pipeline = Pipeline {\n            name: cfg.name.clone(),\n            stages: vec![Box::new(ErrorStage)],\n            config: cfg.clone(),\n        };\n\n        let mut pipelines_by_topic = std::collections::HashMap::new();\n        pipelines_by_topic.insert(cfg.topic.clone(), pipeline.clone());\n\n        let ctx = ConsumerContext {\n            consumer: Arc::new(rdkafka::config::ClientConfig::new().create().unwrap()),\n            batcher: batcher.clone(),\n            metrics: metrics.clone(),\n            health: health.clone(),\n            pipelines_by_topic: pipelines_by_topic.clone(),\n            producer: None,\n        };\n\n        let payload = serde_json::json!({\"id\":1, \"operation_type\": \"c\"}).to_string();\n        let msg_ctx = crate::types::MessageContext::new(\"t1\".to_string(), 0, 5, 0);\n\n        let res = ctx.process_message(\u0026payload, \u0026pipeline, \u0026msg_ctx).await;\n        assert!(res.is_err(), \"expected processing error from stage\");\n    }\n\n    #[tokio::test]\n    async fn test_replay_missing_pipeline_returns_error() {\n        use std::sync::Arc;\n\n        // Build a config with no pipelines (manual construction)\n        let cfg = Arc::new(crate::config::Config {\n            service: crate::config::ServiceConfig {\n                log_level: crate::config::LogLevel::Info,\n                metrics_port: 9000,\n                otlp_endpoint: None,\n ign(\u0026tpl);\n        assert!(res.is_err(), \"consumer.assign should error without brokers\");\n    }\n\n    #[test]\n    fn test_message_context_correlation_id_format() {\n        let ctx = crate::types::MessageContext::new(\"orders\".to_string(), 3, 1500, 0);\n        let correlation_id = ctx.correlation_id();\n        assert_eq!(correlation_id, \"orders:3:1500\");\n    }\n\n    #[test]\n    fn test_message_context_correlation_id_various_partitions() {\n        let test_cases = vec![\n            (\"topic1\", 0, 0, \"topic1:0:0\"),\n            (\"topic_name\", 99, 999999, \"topic_name:99:999999\"),\n            (\"cdc.users\", 5, 12345, \"cdc.users:5:12345\"),\n        ];\n\n        for (topic, partition, offset, expected) in test_cases {\n            let ctx = crate::types::MessageContext::new(topic.to_string(), partition, offset, 0);\n            assert_eq!(ctx.correlation_id(), expected);\n        }\n    }\n\n    #[tokio::test]\n    async fn test_decode_error_with_invalid_json() {\n        let metrics = make_metrics();\n        let health = Arc::new(HealthRegistry::new(std::time::Duration::from_secs(60)));\n        let cfg = make_pipeline_config();\n        let pipeline = Pipeline::from_config(\u0026cfg).unwrap();\n\n        let ctx = crate::types::MessageContext::new(\"t1\".to_string(), 0, 10, 0);\n\n        let before = metrics.decode_failures.get();\n        handle_decode_error(\u0026health, \u0026metrics, \u0026pipeline, \u0026ctx, \"not json at all\".to_string()).await;\n        let after = metrics.decode_failures.get();\n        \n        // Should increment decode failures\n        assert_eq!(after, before + 1);\n    }\n\n    #[tokio::test]\n    async fn test_processing_error_dlq_available() {\n        let metrics = make_metrics();\n        let health = Arc::new(HealthRegistry::new(std::time::Duration::from_secs(60)));\n\n        let writer = Arc::new(MockWriter);\n        let batcher_cfg = BatcherConfig::default();\n        let (shutdown_coordinator
