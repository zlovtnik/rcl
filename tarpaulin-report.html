ts":{"Line":239}},{"line":537,"address":[],"length":0,"stats":{"Line":10}},{"line":541,"address":[],"length":0,"stats":{"Line":71}},{"line":542,"address":[],"length":0,"stats":{"Line":142}},{"line":543,"address":[],"length":0,"stats":{"Line":0}},{"line":546,"address":[],"length":0,"stats":{"Line":133}},{"line":547,"address":[],"length":0,"stats":{"Line":4}},{"line":550,"address":[],"length":0,"stats":{"Line":841}},{"line":553,"address":[],"length":0,"stats":{"Line":128}},{"line":554,"address":[],"length":0,"stats":{"Line":4}},{"line":562,"address":[],"length":0,"stats":{"Line":4}},{"line":566,"address":[],"length":0,"stats":{"Line":26}},{"line":569,"address":[],"length":0,"stats":{"Line":55}},{"line":571,"address":[],"length":0,"stats":{"Line":4}},{"line":575,"address":[],"length":0,"stats":{"Line":30}}],"covered":40,"coverable":156},{"path":["/","Users","rcs","git","rcl","src","consumer.rs"],"content":"use crate::batcher::{Batcher, BatcherConfig};\nuse crate::config::{Config, KafkaConfig};\nuse crate::decoder::decode_and_validate;\nuse crate::dlq;\nuse crate::eip::{MessageMetadata, Pipeline, StageContext};\nuse crate::errors::{ProcessingError, ValidationError};\nuse crate::health::{ComponentStatus, HealthRegistry};\nuse crate::metrics::Metrics;\nuse crate::shutdown::ShutdownCoordinator;\nuse crate::types::MessageContext;\nuse crate::writer::WriterTrait;\nuse anyhow::Result;\nuse futures::StreamExt;\nuse rdkafka::consumer::{CommitMode, Consumer, StreamConsumer};\nuse rdkafka::message::OwnedMessage;\nuse rdkafka::producer::FutureProducer;\nuse rdkafka::Message;\nuse serde_json::Value;\nuse std::collections::HashMap;\nuse std::sync::atomic::{AtomicU64, Ordering};\nuse std::sync::Arc;\nuse std::time::{SystemTime, UNIX_EPOCH};\nuse tokio::sync::{broadcast, mpsc};\nuse tokio::time::{interval, Duration};\nuse tokio_stream::wrappers::ReceiverStream;\nuse tracing::{error, info, warn};\n\nuse rdkafka::Offset;\nuse rdkafka::TopicPartitionList;\n\nstruct ConsumerContext {\n    consumer: Arc\u003cStreamConsumer\u003e,\n    batcher: Arc\u003ctokio::sync::Mutex\u003cBatcher\u003e\u003e,\n    metrics: Metrics,\n    health: Arc\u003cHealthRegistry\u003e,\n    pipelines_by_topic: HashMap\u003cString, Pipeline\u003e,\n    producer: Option\u003cFutureProducer\u003e,\n}\n\nimpl ConsumerContext {\n    async fn add_to_batcher(\n        \u0026self,\n        pipeline_name: \u0026str,\n        table: \u0026str,\n        message: Value,\n    ) -\u003e Result\u003c(), ProcessingError\u003e {\n        let mut batcher = self.batcher.lock().await;\n        batcher.add_message(pipeline_name, table, message).await\n    }\n}\n\nasync fn handle_decode_error(\n    health: \u0026Arc\u003cHealthRegistry\u003e,\n    metrics: \u0026Metrics,\n    pipeline: \u0026Pipeline,\n    ctx: \u0026MessageContext,\n    error_msg: String,\n) {\n    if let Err(err) = health.update_pipeline_error(\u0026pipeline.name, error_msg.clone()) {\n        warn!(\"Failed to update pipeline error status: {}\", err);\n    }\n    metrics.decode_failures.inc();\n    warn!(context = %ctx.correlation_id(), error = %error_msg, \"decode error\");\n}\n\nimpl ConsumerContext {\n    async fn process_message(\n        \u0026self,\n        payload: \u0026str,\n        pipeline: \u0026Pipeline,\n        ctx: \u0026MessageContext,\n    ) -\u003e Result\u003c(), ProcessingError\u003e {\n        let mut decoded = decode_and_validate(payload.as_bytes(), \u0026pipeline.config)?;\n\n        if let serde_json::Value::Object(ref mut map) = decoded {\n            map.insert(\n                \"_meta_topic\".to_string(),\n                serde_json::Value::String(ctx.topic.clone()),\n            );\n            map.insert(\n                \"_meta_partition\".to_string(),\n                serde_json::Value::Number(ctx.partition.into()),\n            );\n            map.insert(\n                \"_meta_offset\".to_string(),\n                serde_json::Value::Number(ctx.offset.into()),\n            );\n            map.insert(\n                \"_meta_ingest_ts\".to_string(),\n                serde_json::Value::Number(ctx.timestamp.into()),\n            );\n        }\n\n        // Execute EIP pipeline\n        let stage_ctx = StageContext {\n            correlation_id: ctx.correlation_id().to_string(),\n            pipeline_name: pipeline.name.clone(),\n            message_metadata: MessageMetadata::from_kafka(\n                ctx.topic.clone(),\n                ctx.partition,\n                ctx.offset,\n                Some(ctx.timestamp),\n            ),\n        };\n\n        let processed_messages = pipeline.execute(\u0026stage_ctx, decoded).await?;\n\n        // Batch processed messages\n        for msg in processed_messages {\n            // Check for routing metadata\n            let candidate = msg\n                .get(\"_destination_table\")\n                .and_then(|v| v.as_str())\n                .unwrap_or(\u0026pipeline.config.staging_table);\n\n            let table = crate::config::validate_table_identifier(candidate)\n                .map_err(|e| ProcessingError::Validation(ValidationError::new(e.to_string())))?;\n\n            self.add_to_batcher(\u0026pipeline.name, table, msg.clone())\n                .await?;\n        }\n\n        Ok(())\n    }\n\n    async fn handle_processing_error(\n        \u0026self,\n        pipeline: \u0026Pipeline,\n        ctx: \u0026MessageContext,\n        reason: \u0026ProcessingError,\n        payload: \u0026str,\n    ) {\n        if let Err(err) = self\n            .health\n            .update_pipeline_error(\u0026pipeline.name, reason.to_string())\n        {\n            warn!(\"Failed to update pipeline error status: {}\", err);\n        }\n\n        match reason {\n            ProcessingError::Transport(_) =\u003e self.metrics.processing_failures.inc(),\n            _ =\u003e self.metrics.decode_failures.inc(),\n        }\n\n        let public_reason = reason.public_reason();\n        if let (Some(producer), Some(dlq_cfg)) =\n            (self.producer.as_ref(), pipeline.config.dlq.as_ref())\n        {\n            if let Err(err) =\n                dlq::publish(producer, \u0026pipeline.name, dlq_cfg, ctx, reason, payload).await\n            {\n                error!(\n                    context = %ctx.correlation_id(),\n                    error = %err,\n                    \"dlq publish failed\"\n                );\n            } else {\n                self.metrics.dlq_total.inc();\n                warn!(\n                    context = %ctx.correlation_id(),\n                    reason_code = %public_reason.code,\n                    reason_message = %public_reason.message,\n                    \"sent to dlq\"\n                );\n            }\n        } else {\n            warn!(\n                context = %ctx.correlation_id(),\n                reason_code = %public_reason.code,\n                reason_message = %public_reason.message,\n                \"dlq disabled; message skipped\"\n            );\n        }\n    }\n}\n\nasync fn run_fetch_loop(\n    consumer: Arc\u003cStreamConsumer\u003e,\n    tx: mpsc::Sender\u003c(MessageContext, OwnedMessage)\u003e,\n    metrics: Metrics,\n    health: Arc\u003cHealthRegistry\u003e,\n    last_poll: Arc\u003cAtomicU64\u003e,\n    mut shutdown_rx: broadcast::Receiver\u003c()\u003e,\n) {\n    let mut stream = consumer.stream();\n    loop {\n        tokio::select! {\n            _ = shutdown_rx.recv() =\u003e {\n                info!(\"fetch loop shutting down\");\n                break;\n            }\n            message = tokio::time::timeout(Duration::from_secs(30), stream.next()) =\u003e {\n                match message {\n                    Ok(Some(Ok(msg))) =\u003e {\n                        last_poll.store(\n                            SystemTime::now()\n                                .duration_since(UNIX_EPOCH)\n                                .unwrap()\n                                .as_millis() as u64,\n                            Ordering::Relaxed,\n                        );\n                        let _ = health.set_kafka_status(ComponentStatus::Healthy);\n                        let ctx = MessageContext {\n                            topic: msg.topic().to_string(),\n                            partition: msg.partition(),\n                            offset: msg.offset(),\n                            timestamp: msg.timestamp().to_millis().unwrap_or(0),\n                        };\n                        metrics.messages_total.inc();\n                        if let Some(ts) = msg.timestamp().to_millis() {\n                            if let Ok(now) = SystemTime::now().duration_since(UNIX_EPOCH) {\n                                let lag = now.as_millis() as i64 - ts;\n                                metrics\n                                    .lag_ms\n                                    .with_label_values(\u0026[\u0026ctx.topic, \u0026ctx.partition.to_string()])\n                                    .set(lag);\n                            }\n                        }\n                        if tx.send((ctx, msg.detach())).await.is_err() {\n                            warn!(\"channel closed; stopping fetch loop\");\n                            break;\n                        }\n                    }\n                    Ok(Some(Err(err))) =\u003e {\n                        last_poll.store(\n                            SystemTime::now()\n                                .duration_since(UNIX_EPOCH)\n                                .unwrap()\n                                .as_millis() as u64,\n                            Ordering::Relaxed,\n                        );\n                        let _ = health.set_kafka_status(ComponentStatus::Unhealthy);\n                        metrics.processing_failures.inc();\n                        warn!(error = %err, \"consumer poll error\");\n                    }\n                    Ok(None) =\u003e break,\n                    Err(_) =\u003e {\n                        // timeout, empty poll\n                        last_poll.store(\n                            SystemTime::now()\n                                .duration_since(UNIX_EPOCH)\n                                .unwrap()\n                                .as_millis() as u64,\n                            Ordering::Relaxed,\n                        );\n                    }\n                }\n            }\n        }\n    }\n}\n\nasync fn run_heartbeat_task(\n    last_poll: Arc\u003cAtomicU64\u003e,\n    health: Arc\u003cHealthRegistry\u003e,\n    metrics: Metrics,\n    staleness_threshold_seconds: u64,\n    mut shutdown_rx: broadcast::Receiver\u003c()\u003e,\n) {\n    let mut interval = interval(Duration::from_secs(30));\n    loop {\n        tokio::select! {\n            _ = shutdown_rx.recv() =\u003e {\n                info!(\"heartbeat task shutting down\");\n                break;\n            }\n            _ = interval.tick() =\u003e {\n                let now = SystemTime::now()\n                    .duration_since(UNIX_EPOCH)\n                    .unwrap()\n                    .as_millis() as u64;\n                let last = last_poll.load(Ordering::Relaxed);\n                metrics.last_poll_timestamp.set(last as i64);\n                if now - last \u003e staleness_threshold_seconds * 1000 {\n                    let _ = health.set_kafka_status(ComponentStatus::Unhealthy);\n                } else {\n                    let _ = health.set_kafka_status(ComponentStatus::Healthy);\n                }\n            }\n        }\n    }\n}\n\nasync fn run_processing_loop(\n    rx: mpsc::Receiver\u003c(MessageContext, OwnedMessage)\u003e,\n    context: ConsumerContext,\n    consumer: Arc\u003cStreamConsumer\u003e,\n) {\n    let mut stream = ReceiverStream::new(rx);\n    let mut latest_offsets: HashMap\u003c(String, i32), i64\u003e = HashMap::new();\n\n    while let Some((ctx, msg)) = stream.next().await {\n        let pipeline = match context.pipelines_by_topic.get(\u0026ctx.topic) {\n            Some(p) =\u003e p,\n            None =\u003e {\n                warn!(context = %ctx.correlation_id(), \"no pipeline for topic\");\n                continue;\n            }\n        };\n\n        let payload = match msg.payload_view::\u003cstr\u003e() {\n            Some(Ok(p)) =\u003e p.to_string(),\n            Some(Err(e)) =\u003e {\n                handle_decode_error(\n                    \u0026context.health,\n                    \u0026context.metrics,\n                    pipeline,\n                    \u0026ctx,\n                    format!(\"utf8 decode failed: {}\", e),\n                )\n                .await;\n                continue;\n            }\n            None =\u003e {\n                handle_decode_error(\n                    \u0026context.health,\n                    \u0026context.metrics,\n                    pipeline,\n                    \u0026ctx,\n                    \"empty payload\".to_string(),\n                )\n                .await;\n                continue;\n            }\n        };\n\n        match context.process_message(\u0026payload, pipeline, \u0026ctx).await {\n            Ok(_) =\u003e {\n                latest_offsets.insert((ctx.topic.clone(), ctx.partition), ctx.offset + 1);\n                if let Err(err) = commit_offset(\u0026consumer, \u0026ctx) {\n                    context.metrics.processing_failures.inc();\n                    warn!(context = %ctx.correlation_id(), error = %err, \"offset commit failed\");\n                }\n            }\n            Err(reason) =\u003e {\n                context\n                    .handle_processing_error(pipeline, \u0026ctx, \u0026reason, \u0026payload)\n                    .await;\n            }\n        }\n    }\n\n    // Final commit\n    if !latest_offsets.is_empty() {\n        info!(\"Performing final offset commit\");\n        let mut tpl = TopicPartitionList::new();\n        for ((topic, partition), offset) in latest_offsets {\n            if let Err(e) = tpl.add_partition_offset(\u0026topic, partition, Offset::Offset(offset)) {\n                warn!(\"Failed to add partition offset to list: {}\", e);\n            }\n        }\n        if let Err(e) = consumer.commit(\u0026tpl, CommitMode::Sync) {\n            error!(\"Final offset commit failed: {}\", e);\n        } else {\n            info!(\"Final offset commit successful\");\n        }\n    }\n}\n\npub async fn replay(\n    cfg: Arc\u003cConfig\u003e,\n    writer: Arc\u003cdyn WriterTrait\u003e,\n    _metrics: Metrics,\n    topic: String,\n    partition: i32,\n    start_offset: i64,\n    end_offset: i64,\n) -\u003e Result\u003c()\u003e {\n    let pipelines_by_topic: HashMap\u003cString, Pipeline\u003e = cfg\n        .pipelines\n        .iter()\n        .map(|p| {\n            let pipeline = Pipeline::from_config(p)?;\n            Ok((p.topic.clone(), pipeline))\n        })\n        .collect::\u003cResult\u003cHashMap\u003c_, _\u003e\u003e\u003e()?;\n\n    let pipeline = pipelines_by_topic\n        .get(\u0026topic)\n        .ok_or_else(|| anyhow::anyhow!(\"No pipeline found for topic {}\", topic))?\n        .clone();\n\n    let consumer: StreamConsumer = rdkafka::config::ClientConfig::new()\n        .set(\"bootstrap.servers\", \u0026cfg.kafka.brokers)\n        .set(\"group.id\", format!(\"rcl-replay-{}\", uuid::Uuid::new_v4()))\n        .set(\"enable.auto.commit\", \"false\")\n        .set(\"auto.offset.reset\", \"earliest\")\n        .create()?;\n\n    let mut tpl = TopicPartitionList::new();\n    tpl.add_partition_offset(\u0026topic, partition, Offset::Offset(start_offset))?;\n    consumer.assign(\u0026tpl)?;\n\n    info!(\n        \"Replaying {}:{} from {} to {}\",\n        topic, partition, start_offset, end_offset\n    );\n\n    // For replay, we'll use the writer directly since batching isn't needed\n    let context = ConsumerContext {\n        consumer: Arc::new(consumer),\n        batcher: Arc::new(tokio::sync::Mutex::new(Batcher::new(\n            BatcherConfig::default(),\n            writer.clone(),\n            _metrics.clone(),\n            ShutdownCoordinator::default().subscribe(),\n        ))), // Not used in replay\n        metrics: _metrics,\n        health: Arc::new(HealthRegistry::new(Duration::from_secs(30))), // Not used in replay\n        pipelines_by_topic,\n        producer: None, // DLQ not used in replay\n    };\n\n    let mut stream = context.consumer.stream();\n\n    while let Some(message) = stream.next().await {\n        match message {\n            Ok(msg) =\u003e {\n                if msg.offset() \u003e end_offset {\n                    info!(\"Reached end offset {}\", end_offset);\n                    break;\n                }\n\n                let ctx = MessageContext {\n                    topic: msg.topic().to_string(),\n                    partition: msg.partition(),\n                    offset: msg.offset(),\n                    timestamp: msg.timestamp().to_millis().unwrap_or(0),\n                };\n\n                match msg.payload() {\n                    Some(payload) =\u003e match std::str::from_utf8(payload) {\n                        Ok(payload_str) =\u003e {\n                            match context.process_message(payload_str, \u0026pipeline, \u0026ctx).await {\n                                Ok(_) =\u003e {\n                                    info!(context = %ctx.correlation_id(), \"replayed successfully\");\n                                }\n                                Err(e) =\u003e {\n                                    error!(context = %ctx.correlation_id(), error = %e, \"processing failed during replay; stopping\");\n                                    return Err(e.into());\n                                }\n                            }\n                        }\n                        Err(e) =\u003e {\n                            error!(context = %ctx.correlation_id(), error = %e, \"invalid UTF-8 payload\");\n                            return Err(e.into());\n                        }\n                    },\n                    None =\u003e {\n                        warn!(context = %ctx.correlation_id(), \"missing payload\");\n                    }\n                }\n            }\n            Err(e) =\u003e {\n                error!(\"Kafka error: {}\", e);\n                return Err(e.into());\n            }\n        }\n    }\n\n    Ok(())\n}\n\npub async fn run(\n    cfg: Arc\u003cConfig\u003e,\n    writer: Arc\u003cdyn WriterTrait\u003e,\n    metrics: Metrics,\n    shutdown_rx: broadcast::Receiver\u003c()\u003e,\n    health: Arc\u003cHealthRegistry\u003e,\n) -\u003e Result\u003c()\u003e {\n    let pipelines_by_topic: HashMap\u003cString, Pipeline\u003e = cfg\n        .pipelines\n        .iter()\n        .map(|p| {\n            let pipeline = Pipeline::from_config(p)?;\n            Ok((p.topic.clone(), pipeline))\n        })\n        .collect::\u003cResult\u003cHashMap\u003c_, _\u003e\u003e\u003e()?;\n\n    for p in \u0026cfg.pipelines {\n        health.register_pipeline(\u0026p.name);\n    }\n\n    let shutdown_rx_heartbeat = shutdown_rx.resubscribe();\n    let shutdown_rx_fetch = shutdown_rx.resubscribe();\n\n    let capacity = cfg\n        .pipelines\n        .iter()\n        .map(|p| p.backpressure.channel_capacity)\n        .max()\n        .unwrap_or(1024);\n\n    let consumer = Arc::new(build_consumer(\u0026cfg.kafka)?);\n    let last_poll = Arc::new(AtomicU64::new(\n        SystemTime::now()\n            .duration_since(UNIX_EPOCH)\n            .unwrap()\n            .as_millis() as u64,\n    ));\n\n    consumer.subscribe(\n        \u0026cfg.pipelines\n            .iter()\n            .map(|p| p.topic.as_str())\n            .collect::\u003cVec\u003c_\u003e\u003e(),\n    )?;\n\n    let dlq_enabled = cfg.pipelines.iter().any(|p| p.dlq.is_some());\n    let producer = if dlq_enabled {\n        Some(dlq::build_producer(\u0026cfg.kafka)?)\n    } else {\n        None\n    };\n\n    // Create batcher subscribed to the main shutdown receiver so it\n    // observes the same shutdown event as other tasks.\n    let shutdown_rx_batcher = shutdown_rx.resubscribe();\n    let first_pipeline = cfg\n        .pipelines\n        .first()\n        .ok_or_else(|| anyhow::anyhow!(\"No pipelines configured\"))?;\n    let batcher_config = BatcherConfig::from_pipeline_config(\n        first_pipeline, // Use first pipeline for config, could be made per-pipeline later\n        \u0026cfg.postgres,\n        cfg.service.shutdown_timeout_duration(),\n    );\n    let batcher = Arc::new(tokio::sync::Mutex::new(Batcher::new(\n        batcher_config,\n        writer.clone(),\n        metrics.clone(),\n        shutdown_rx_batcher,\n    )));\n\n    let (tx, rx) = mpsc::channel::\u003c(MessageContext, OwnedMessage)\u003e(capacity);\n\n    let context = ConsumerContext {\n        consumer: consumer.clone(),\n        batcher: batcher.clone(),\n        metrics: metrics.clone(),\n        health: health.clone(),\n        pipelines_by_topic,\n        producer,\n    };\n\n    let fetch_loop = tokio::spawn(run_fetch_loop(\n        consumer.clone(),\n        tx,\n        metrics.clone(),\n        health.clone(),\n        last_poll.clone(),\n        shutdown_rx_fetch,\n    ));\n\n    let heartbeat_task = tokio::spawn(run_heartbeat_task(\n        last_poll,\n        health.clone(),\n        metrics,\n        cfg.kafka.staleness_threshold_seconds,\n        shutdown_rx_heartbeat,\n    ));\n\n    let processing_loop = tokio::spawn(run_processing_loop(rx, context, consumer));\n\n    // Spawn batcher background flush task. Use a resubscribe so this task\n    // listens to the same shutdown broadcast passed into `run`.\n    let mut shutdown_rx_for_task = shutdown_rx.resubscribe();\n    let batcher_task = tokio::spawn(async move {\n        let mut interval = tokio::time::interval(std::time::Duration::from_millis(1000)); // Check every second\n\n        loop {\n            tokio::select! {\n                _ = shutdown_rx_for_task.recv() =\u003e {\n                    info!(\"batcher received shutdown signal, flushing all buffers\");\n                    let mut batcher_guard = batcher.lock().await;\n                    if let Err(e) = batcher_guard.flush_all_buffers(crate::batcher::FlushReason::Shutdown).await {\n                        error!(\"batcher shutdown flush failed: {}\", e);\n                    }\n                    break;\n                }\n                _ = interval.tick() =\u003e {\n                    let mut batcher_guard = batcher.lock().await;\n                    if let Err(e) = batcher_guard.flush_pending_buffers().await {\n                        error!(\"batcher background flush failed: {}\", e);\n                    }\n                }\n            }\n        }\n    });\n\n    tokio::try_join!(fetch_loop, processing_loop, heartbeat_task, batcher_task)?;\n    info!(\"consumer loops stopped\");\n    Ok(())\n}\n\nfn build_consumer(cfg: \u0026KafkaConfig) -\u003e Result\u003cStreamConsumer\u003e {\n    let mut client_config = rdkafka::config::ClientConfig::new();\n    client_config\n        .set(\"bootstrap.servers\", \u0026cfg.brokers)\n        .set(\"group.id\", \u0026cfg.group_id)\n        .set(\"enable.partition.eof\", \"false\")\n        .set(\"session.timeout.ms\", cfg.session_timeout_ms.to_string())\n        .set(\"enable.auto.commit\", \"false\")\n        .set(\"enable.auto.offset.store\", \"false\")\n        .set(\n            \"max.in.flight.requests.per.connection\",\n            cfg.max_inflight_messages.to_string(),\n        );\n\n    if let Some(fetch) = \u0026cfg.fetch {\n        client_config.set(\"fetch.message.max.bytes\", fetch.max_bytes.to_string());\n        client_config.set(\"fetch.wait.max.ms\", fetch.max_wait_ms.to_string());\n    }\n\n    if let Some(sec) = \u0026cfg.security {\n        let protocol = if sec.sasl_enabled \u0026\u0026 sec.tls {\n            Some(\"SASL_SSL\")\n        } else if sec.sasl_enabled {\n            Some(\"SASL_PLAINTEXT\")\n        } else if sec.tls {\n            Some(\"SSL\")\n        } else {\n            None\n        };\n        if let Some(p) = protocol {\n            client_config.set(\"security.protocol\", p);\n        }\n\n        if sec.tls {\n            if let Some(ca) = \u0026sec.ssl_ca_location {\n                client_config.set(\"ssl.ca.location\", ca);\n            }\n            if let Some(cert) = \u0026sec.ssl_certificate_location {\n                client_config.set(\"ssl.certificate.location\", cert);\n            }\n            if let Some(key) = \u0026sec.ssl_key_location {\n                client_config.set(\"ssl.key.location\", key);\n            }\n            if let Some(pass) = \u0026sec.ssl_key_password {\n                client_config.set(\"ssl.key.password\", pass);\n            }\n        }\n\n        if sec.sasl_enabled {\n            if let Some(mech) = \u0026sec.sasl_mechanism {\n                client_config.set(\"sasl.mechanism\", mech);\n            }\n            if let Some(user) = \u0026sec.sasl_username {\n                client_config.set(\"sasl.username\", user);\n            }\n            if let Some(pass) = \u0026sec.sasl_password {\n                client_config.set(\"sasl.password\", pass);\n            }\n        }\n    }\n\n    let consumer: StreamConsumer = client_config.create()?;\n    Ok(consumer)\n}\n\nfn commit_offset(\n    consumer: \u0026StreamConsumer,\n    ctx: \u0026MessageContext,\n) -\u003e Result\u003c(), rdkafka::error::KafkaError\u003e {\n    let mut tpl = rdkafka::TopicPartitionList::new();\n    tpl.add_partition_offset(\n        \u0026ctx.topic,\n        ctx.partition,\n        rdkafka::Offset::Offset(ctx.offset + 1),\n    )?;\n    consumer.commit(\u0026tpl, CommitMode::Async)\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use crate::batcher::BatcherConfig;\n    use crate::eip::PipelineConfig;\n    use crate::metrics::Metrics;\n    us umer.assign(\u0026tpl);\n        assert!(res.is_err(), \"consumer.assign should error without brokers\");\n    }\n\n    #[test]\n    fn test_message_context_correlation_id_format() {\n        let ctx = crate::types::MessageContext::new(\"orders\".to_string(), 3, 1500, 0);\n        let correlation_id = ctx.correlation_id();\n        assert_eq!(correlation_id, \"orders:3:1500\");\n    }\n\n    #[test]\n    fn test_message_context_correlation_id_various_partitions() {\n        let test_cases = vec![\n            (\"topic1\", 0, 0, \"topic1:0:0\"),\n            (\"topic_name\", 99, 999999, \"topic_name:99:999999\"),\n            (\"cdc.users\", 5, 12345, \"cdc.users:5:12345\"),\n        ];\n\n        for (topic, partition, offset, expected) in test_cases {\n            let ctx = crate::types::MessageContext::new(topic.to_string(), partition, offset, 0);\n            assert_eq!(ctx.correlation_id(), expected);\n        }\n    }\n\n    #[tokio::test]\n    async fn test_decode_error_with_invalid_json() {\n        let metrics = make_metrics();\n        let health = Arc::new(HealthRegistry::new(std::time::Duration::from_secs(60)));\n        let cfg = make_pipeline_config();\n        let pipeline = Pipeline::from_config(\u0026cfg).unwrap();\n\n        let ctx = crate::types::MessageContext::new(\"t1\".to_string(), 0, 10, 0);\n\n        let before = metrics.decode_failures.get();\n        handle_decode_error(\u0026health, \u0026metrics, \u0026pipeline, \u0026ctx, \"not json at all\".to_string()).await;\n        let after = metrics.decode_failures.get();\n        \n        // Should increment decode failures\n        assert_eq!(after, before + 1);\n    }\n\n    #[tokio::test]\n    async fn test_processing_error_dlq_available() {\n        let metrics = make_metrics();\n        let health = Arc::new(HealthRegistry::new(std::time::Duration::from_secs(60)));\n\n        let writer = Arc::new(MockWriter);\n        let batcher_cfg = BatcherConfig::default();\n        let (shutdown_coo .ok_or_else(|| DebeziumError::new(\"missing payload\"))?;\n\n    let op_str = payload\n        .get(\"op\")\n        .and_then(|v| v.as_str())\n        .ok_or_else(|| DebeziumError::new(\"missing op code\"))?;\n\n    let operation = Operation::try_from(op_str)\n        .map_err(|e| DebeziumError::new(format!(\"invalid operation: {}\", e)))?;\n\n    let source_row = match operation {\n        Operation::Create | Operation::Read | Operation::Update =\u003e payload.get(\"after\"),\n        Operation::Delete =\u003e payload.get(\"before\"),\n    };\n\n    let row = source_row\n        .cloned()\n        .ok_or_else(|| DebeziumError::new(\"envelope missing before/after\"))?;\n\n    if let Value::Object(mut obj) = row {\n        obj.insert(\n            \"operation_type\".to_string(),\n            Value::String(operation.to_string()),\n        );\n        Ok(Value::Object(obj))\n    } else {\n        Err(DebeziumError::new(\"before/after payload is not an object\").into())\n    }\n}\n\nfn validate_required_fields(\n    value: \u0026Value,\n    pipeline: \u0026PipelineConfig,\n) -\u003e Result\u003c(), ValidationError\u003e {\n    for field in \u0026pipeline.required_fields {\n        let mut current = Some(value);\n\n        for part in field.split('.') {\n            current = match current.and_then(|v| v.get(part)) {\n                Some(v) if !v.is_null() =\u003e Some(v),\n                _ =\u003e {\n                    return Err(ValidationError::new(format!(\n                        \"missing required field `{}`\",\n                        field\n                    )))\n                }\n            };\n        }\n    }\n    Ok(())\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use crate::eip::BackpressureConfig;\n    use serde_json::json;\n\n    fn make_pipeline(debezium: bool, required: Vec\u003c\u0026str\u003e) -\u003e PipelineConfig {\n        PipelineConfig {\n            name: \"test\".to_string(),\n            topic: \"t\".to_string(),\n            debezium_envelope: debezium,\n            staging_table: \"staging.test\".to_string(),\n            dlq: None,\n            stages: vec![],\n            required_fields: required.into_iter().map(|s| s.to_string()).collect(),\n            backpressure: BackpressureConfig {\n                channel_capacity: 100,\n            },\n        }\n    }\n\n    #[test]\n    fn test_decode_debezium_create() {\n        let payload = json!({\n            \"payload\": {\n                \"op\": \"c\",\n                \"after\": { \"id\": 1, \"name\": \"alice\" }\n            }\n        })\n        .to_string();\n\n        let cfg = make_pipeline(true, vec![]);\n        let res = decode_and_validate(payload.as_bytes(), \u0026cfg).unwrap();\n        assert_eq!(res.get(\"id\").and_then(|v| v.as_i64()), Some(1));\n        assert_eq!(res.get(\"name\").and_then(|v| v.as_str()), Some(\"alice\"));\n        assert_eq!(\n            res.get(\"operation_type\").and_then(|v| v.as_str()),\n            Some(\"c\")\n        );\n    }\n\n    #[test]\n    fn test_decode_debezium_missing_op() {\n        let payload = json!({\n            \"payload\": { \"after\": {\"id\": 1} }\n        })\n        .to_string();\n\n        let cfg = make_pipeline(true, vec![]);\n        let err = decode_and_validate(payload.as_bytes(), \u0026cfg).unwrap_err();\n        match err {\n            ProcessingError::Debezium(_) =\u003e {}\n            _ =\u003e panic!(\"expected Debezium error\"),\n        }\n    }\n\n    #[test]\n    fn test_validate_required_fields_missing() {\n        let payload = json!({ \"id\": 1 }).to_string();\n        let cfg = make_pipeline(false, vec![\"name\"]);\n        let err = decode_and_validate(payload.as_bytes(), \u0026cfg).unwrap_err();\n        match err {\n            ProcessingError::Validation(_) =\u003e {}\n            _ =\u003e panic!(\"expected Validation error\"),\n        }\n    }\n\n    #[test]\n    fn test_invalid_json() {\n        let payload = b\"{ invalid json }\";\n        let cfg = make_pipeline(false, vec![]);\n        let err = decode_and_validate(payload, \u0026cfg).unwrap_err();\n        match err {\n            ProcessingError::JsonDecode(_) =\u003e {}\n            _ =\u003e panic!(\"expected JsonDecode error\"),\n        }\n    }\n}\n","traces":[{"line":6,"address":[],"length":0,"stats":{"Line":10}},{"line":10,"address":[],"length":0,"stats":{"Line":30}},{"line":11,"address":[],"length":0,"stats":{"Line":10}},{"line":14,"address":[],"length":0,"stats":{"Line":6}},{"line":17,"address":[],"length":0,"stats":{"Line":9}},{"line":18,"address":[],"length":0,"stats":{"Line":7}},{"line":21,"address":[],"length":0,"stats":{"Line":2}},{"line":22,"address":[],"length":0,"stats":{"Line":4}},{"line":25,"address":[],"length":0,"stats":{"Line":2}},{"line":27,"address":[],"length":0,"stats":{"Line":1}},{"line":29,"address":[],"length":0,"stats":{"Line":2}},{"line":30,"address":[],"length":0,"stats":{"Line":2}},{"line":32,"address":[],"length":0,"stats":{"Line":1}},{"line":33,"address":[],"length":0,"stats":{"Line":0}},{"line":36,"address":[],"length":0,"stats":{"Line":1}},{"line":37,"address":[],"length":0,"stats":{"Line":0}},{"line":40,"address":[],"length":0,"stats":{"Line":1}},{"line":42,"address":[],"length":0,"stats":{"Line":0}},{"line":44,"address":[],"length":0,"stats":{"Line":1}},{"line":51,"address":[],"length":0,"stats":{"Line":0}},{"line":55,"address":[],"length":0,"stats":{"Line":8}},{"line":59,"address":[],"length":0,"stats":{"Line":9}},{"line":60,"address":[],"length":0,"stats":{"Line":2}},{"line":62,"address":[],"length":0,"stats":{"Line":3}},{"line":63,"address":[],"length":0,"stats":{"Line":3}},{"line":64,"address":[],"length":0,"stats":{"Line":0}},{"line":66,"address":[],"length":0,"stats":{"Line":1}},{"line":67,"address":[],"length":0,"stats":{"Line":1}},{"line":68,"address":[],"length":0,"stats":{"Line":1}},{"line":74,"address":[],"length":0,"stats":{"Line":7}}],"covered":25,"coverable":30},{"path":["/","Users","rcs","git","rcl","src","dlq.rs"],"content":"use crate::config::KafkaConfig;\nuse crate::eip::DlqConfig;\nuse crate::errors::{ProcessingError, PublicErrorReason};\nuse crate::types::MessageContext;\nuse anyhow::Result;\nuse chrono::Utc;\nuse futures::StreamExt;\nuse rdkafka::consumer::{Consumer, StreamConsumer};\nuse rdkafka::message::{Header, OwnedHeaders};\nuse rdkafka::producer::{FutureProducer, FutureRecord};\nuse rdkafka::Message;\nuse serde::{Deserialize, Serialize};\nuse std::borrow::Cow;\nuse std::fs::File;\nuse std::io::Write;\nuse std::time::{Duration, Instant};\nuse tracing::warn;\n\nconst MAX_DLQ_PREVIEW_BYTES: usize = 4_096;\n\nasync fn wait_for_kafka_readiness(\n    consumer: \u0026StreamConsumer,\n    readiness_timeout_secs: u64,\n    readiness_backoff_secs: u64,\n) -\u003e Result\u003c()\u003e {\n    let readiness_timeout = Duration::from_secs(readiness_timeout_secs);\n    let readiness_backoff = Duration::from_secs(readiness_backoff_secs);\n    let start = Instant::now();\n    loop {\n        match consumer.fetch_metadata(None, Duration::from_millis(100)) {\n            Ok(_) =\u003e break,\n            Err(e) =\u003e {\n                if start.elapsed() \u003e readiness_timeout {\n                    return Err(anyhow::anyhow!(\n                        \"Kafka readiness check timed out after {}s: {}\",\n                        readiness_timeout.as_secs(),\n                        e\n                    ));\n                }\n                tokio::time::sleep(readiness_backoff).await;\n            }\n        }\n    }\n    Ok(())\n}\n\npub fn build_producer(cfg: \u0026KafkaConfig) -\u003e Result\u003cFutureProducer\u003e {\n    let producer: FutureProducer = rdkafka::config::ClientConfig::new()\n        .set(\"bootstrap.servers\", \u0026cfg.brokers)\n        .set(\"enable.idempotence\", \"true\")\n        .set(\"acks\", \"all\")\n        .set(\"retries\", cfg.producer_retries.to_string())\n        .set(\"compression.type\", \u0026cfg.compression)\n        .set(\"message.timeout.ms\", cfg.dlq_message_timeout_ms.to_string())\n        .create()?;\n    Ok(producer)\n}\n\nfn build_dlq_consumer(cfg: \u0026KafkaConfig, group_id: String) -\u003e Result\u003cStreamConsumer\u003e {\n    let consumer: StreamConsumer = rdkafka::config::ClientConfig::new()\n        .set(\"bootstrap.servers\", \u0026cfg.brokers)\n        .set(\"group.id\", group_id)\n        .set(\"auto.offset.reset\", \"earliest\")\n        .set(\"enable.auto.commit\", \"false\")\n        .create()?;\n    Ok(consumer)\n}\n\n#[derive(Serialize)]\npub struct DlqPayload\u003c'a\u003e {\n    pub context: \u0026'a MessageContext,\n    pub reason: PublicErrorReason,\n    pub pipeline: \u0026'a str,\n    pub payload: Cow\u003c'a, str\u003e,\n    pub original_size: usize,\n    pub truncated: bool,\n}\n\npub async fn publish(\n    producer: \u0026FutureProducer,\n    pipeline_name: \u0026str,\n    dlq_cfg: \u0026DlqConfig,\n    ctx: \u0026MessageContext,\n    reason: \u0026ProcessingError,\n    raw_payload: \u0026str,\n) -\u003e Result\u003c()\u003e {\n    let correlation = ctx.correlation_id();\n    let public_reason = reason.public_reason();\n    let timestamp = Utc::now().to_rfc3339();\n    let retry_count = \"0\";\n    let original_size = raw_payload.len();\n    let (payload, truncated) =\n        sanitize_payload(raw_payload, original_size, dlq_cfg.max_payload_bytes);\n    let body = serde_json::to_string(\u0026DlqPayload {\n        context: ctx,\n        reason: public_reason.clone(),\n        pipeline: pipeline_name,\n        payload,\n        original_size,\n        truncated,\n    })?;\n\n    let headers = OwnedHeaders::new()\n        .insert(Header {\n            key: \"error_type\",\n            value: Some(public_reason.code.as_bytes()),\n        })\n        .insert(Header {\n            key: \"timestamp\",\n            value: Some(timestamp.as_bytes()),\n        })\n        .insert(Header {\n            key: \"retry_count\",\n            value: Some(retry_count.as_bytes()),\n        })\n        .insert(Header {\n            key: \"original_topic\",\n            value: Some(ctx.topic.as_bytes()),\n        });\n\n    let record = FutureRecord::to(\u0026dlq_cfg.topic)\n        .payload(\u0026body)\n        .key(\u0026correlation)\n        .headers(headers);\n\n    producer\n        .send(record, Duration::from_secs(5))\n        .await\n        .map_err(|(e, _)| anyhow::anyhow!(\"dlq send failed: {e}\"))?;\n    Ok(())\n}\n\nfn sanitize_payload\u003c'a\u003e(\n    raw_payload: \u0026'a str,\n    original_size: usize,\n    max_payload_bytes: usize,\n) -\u003e (Cow\u003c'a, str\u003e, bool) {\n    if original_size \u003c= max_payload_bytes {\n        return (Cow::Borrowed(raw_payload), false);\n    }\n\n    let preview_limit = max_payload_bytes.min(MAX_DLQ_PREVIEW_BYTES);\n    let preview = truncate_utf8(raw_payload, preview_limit);\n    let payload = format!(\"{}...\u003cpayload omitted - too large\u003e\", preview);\n\n    (Cow::Owned(payload), true)\n}\n\nfn truncate_utf8(input: \u0026str, max_bytes: usize) -\u003e \u0026str {\n    if input.is_empty() || max_bytes == 0 {\n        return \"\";\n    }\n\n    let mut end = 0;\n    for (idx, ch) in input.char_indices() {\n        let next = idx + ch.len_utf8();\n        if next \u003e max_bytes {\n            break;\n        }\n        end = next;\n    }\n\n    \u0026input[..end]\n}\n\n#[derive(Deserialize)]\nstruct OwnedDlqPayload {\n    context: MessageContext,\n    #[allow(dead_code)]\n    reason: OwnedPublicErrorReason,\n    #[allow(dead_code)]\n    pipeline: String,\n    payload: String,\n    #[allow(dead_code)]\n    original_size: usize,\n    truncated: bool,\n}\n\n#[derive(Deserialize)]\nstruct OwnedPublicErrorReason {\n    #[allow(dead_code)]\n    code: String,\n    #[allow(dead_code)]\n    message: String,\n}\n\npub async fn drain(\n    cfg: \u0026KafkaConfig,\n    topic: \u0026str,\n    output_file: Option\u003cString\u003e,\n    requeue: bool,\n) -\u003e Result\u003c()\u003e {\n    let consumer = build_dlq_consumer(cfg, format!(\"rcl-dlq-drain-{}\", uuid::Uuid::new_v4()))?;\n\n    consumer.subscribe(\u0026[topic])?;\n\n    let producer = if requeue {\n        Some(build_producer(cfg)?)\n    } else {\n        None\n    };\n\n    let mut file = if let Some(path) = output_file {\n        Some(File::create(path)?)\n    } else {\n        None\n    };\n\n    println!(\"Draining DLQ topic: {}\", topic);\n\n    wait_for_kafka_readiness(\n        \u0026consumer,\n        cfg.dlq_readiness_timeout_secs,\n        cfg.dlq_readiness_backoff_secs,\n    )\n    .await?;\n\n    let mut count = 0;\n    let mut stream = consumer.stream();\n\n    loop {\n        match tokio::time::timeout(Duration::from_secs(2), stream.next()).await {\n            Ok(Some(Ok(msg))) =\u003e {\n                if let Some(payload_str) = msg.payload_view::\u003cstr\u003e().and_then(|r| r.ok()) {\n                    match serde_json::from_str::\u003cOwnedDlqPayload\u003e(payload_str) {\n                        Ok(dlq_msg) =\u003e {\n                            if let Some(p) = \u0026producer {\n                                if dlq_msg.truncated {\n                                    eprintln!(\n                                        \"Skipping requeue for truncated message at offset {}\",\n                                        msg.offset()\n                                    );\n                                    if let Some(f) = \u0026mut file {\n                                        writeln!(f, \"{}\", payload_str)?;\n                                    }\n                                } else {\n                                    if let Some(f) = \u0026mut file {\n                                        writeln!(f, \"{}\", payload_str)?;\n                                    }\n                                    let key = dlq_msg.context.correlation_id();\n                                    let record = FutureRecord::to(\u0026dlq_msg.context.topic)\n                                        .payload(\u0026dlq_msg.payload)\n                                        .key(\u0026key);\n\n                                    match p.send(record, Duration::from_secs(5)).await {\n                                        Ok(_) =\u003e {\n                                            println!(\n                                                \"Requeued message from offset {} to {}\",\n                                                msg.offset(),\n                                                dlq_msg.context.topic\n                                            );\n                                        }\n                                        Err((e, _)) =\u003e {\n                                            eprintln!(\n                                                \"Failed to requeue message at offset {}: {}\",\n                                                msg.offset(),\n                                                e\n                                            );\n                                        }\n                                    }\n                                    println!(\n                                        \"Requeued message from offset {} to {}\",\n                                        msg.offset(),\n                                        dlq_msg.context.topic\n                                    );\n                                }\n                            } else if let Some(f) = \u0026mut file {\n                                writeln!(f, \"{}\", payload_str)?;\n                            }\n                        }\n                        Err(e) =\u003e {\n                            eprintln!(\n                                \"Failed to parse DLQ message at offset {}: {}\",\n                                msg.offset(),\n                                e\n                            );\n                        }\n                    }\n                } else {\n                    warn!(\n                        topic = %msg.topic(),\n                        partition = msg.partition(),\n                        offset = msg.offset(),\n                        payload_len = msg.payload().map(|p| p.len()).unwrap_or(0),\n                        \"Skipping DLQ message with invalid UTF-8 payload\"\n                    );\n                }\n\n                // Commit offset to mark as processed (drained)\n                let mut tpl = rdkafka::TopicPartitionList::new();\n                tpl.add_partition_offset(\n                    topic,\n                    msg.partition(),\n                    rdkafka::Offset::Offset(msg.offset() + 1),\n                )?;\n                consumer.commit(\u0026tpl, rdkafka::consumer::CommitMode::Async)?;\n\n                count += 1;\n            }\n            Ok(Some(Err(e))) =\u003e {\n                eprintln!(\"Error receiving message: {}\", e);\n                break;\n            }\n            Ok(None) =\u003e break,\n            Err(_) =\u003e {\n                println!(\"Drain complete (timeout). Processed {} messages.\", count);\n                break;\n            }\n        }\n    }\n\n    Ok(())\n}\n\npub async fn inspect(cfg: \u0026KafkaConfig, topic: \u0026str, limit: usize) -\u003e Result\u003c()\u003e {\n    let consumer = build_dlq_consumer(cfg, format!(\"rcl-dlq-inspector-{}\", uuid::Uuid::new_v4()))?;\n\n    consumer.subscribe(\u0026[topic])?;\n\n    println!(\"Inspecting DLQ topic: {}\", topic);\n    let mut count = 0;\n\n    wait_for_kafka_readiness(\n        \u0026consumer,\n        cfg.dlq_readiness_timeout_secs,\n        cfg.dlq_readiness_backoff_secs,\n    )\n    .await?;\n\n    while count \u003c limit {\n        match tokio::time::timeout(Duration::from_secs(5), consumer.recv()).await {\n            Ok(Ok(m)) =\u003e {\n                if let Some(payload) = m.payload_view::\u003cstr\u003e() {\n                    match payload {\n                        Ok(s) =\u003e println!(\"Offset {}: {}\", m.offset(), s),\n                        Err(e) =\u003e println!(\"Offset {}: [Invalid UTF-8] {:?}\", m.offset(), e),\n                    }\n                }\n                count += 1;\n            }\n            Ok(Err(e)) =\u003e {\n                eprintln!(\"Error receiving message: {}\", e);\n                break;\n            }\n            Err(_) =\u003e {\n                println!(\"Timeout waiting for messages.\");\n                break;\n            }\n        }\n    }\n    Ok(())\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use crate::types::MessageContext;\n\n    #[test]\n    fn test_truncate_utf8_empty_and_zero() {\n        assert_eq!(truncate_utf8(\"\", 10), \"\");\n        assert_eq!(truncate_utf8(\"hello\", 0), \"\");\n    }\n\n    #[test]\n    fn test_truncate_utf8_multibyte() {\n        // 'é' is two bytes in UTF-8; ensure we don't cut in the middle\n        let s = \"aébc\"; // bytes: a (1) é (2) b (1) c (1)\n                        // limit 2 bytes should only include 'a'\n        assert_eq!(truncate_utf8(s, 2), \"a\");\n        // limit 3 bytes should include 'a' and 'é'\n        assert_eq!(truncate_utf8(s, 3), \"aé\");\n    }\n\n    #[test]\n    fn test_sanitize_payload_small() {\n        let raw = \"small payload\";\n        let (payload, truncated) = sanitize_payload(raw, raw.len(), 100);\n        assert!(!truncated);\n        assert!(matches!(payload, std::borrow::Cow::Borrowed(_)));\n    }\n\n    #[test]\n    fn test_sanitize_payload_large() {\n        let raw = \"x\".repeat(10_000);\n        let (payload, truncated) = sanitize_payload(\u0026raw, raw.len(), 1024);\n        assert!(truncated);\n        let s = payload.into_owned();\n        assert!(s.contains(\"\u003cpayload omitted - too large\u003e\"));\n    }\n\n    #[test]\n    fn test_dlq_payload_serialize() {\n        let ctx = MessageContext::new(\"topic-a\".to_string(), 1, 2, 3);\n        let reason = crate::errors::ProcessingError::Validation(\n            crate::errors::ValidationError::new(\"bad\".to_string()),\n        );\n        let raw = \"ok\";\n        let dlq_cfg = crate::eip::DlqConfig {\n            topic: \"dlq\".to_string(),\n            max_payload_bytes: 1024,\n            max_retries: 3,\n        };\n\n        let (payload, truncated) = sanitize_payload(raw, raw.len(), dlq_cfg.max_payload_bytes);\n        let body = serde_json::to_string(\u0026DlqPayload {\n            context: \u0026ctx,\n            reason: reason.public_reason(),\n            pipeline: \"p1\",\n            payload,\n            original_size: raw.len(),\n            truncated,\n        })\n        .unwrap();\n\n        // Should be valid JSON and contain expected fields\n        let v: serde_json::Value = serde_json::from_str(\u0026body).unwrap();\n        assert_eq!(v.get(\"pipeline\").and_then(|p| p.as_str()), Some(\"p1\"));\n        assert_eq!(v.get(\"payload\").and_then(|p| p.as_str()), Some(\"ok\"));\n    }\n\n    #[test]\n    fn test_truncate_utf8_emoji_and_boundaries() {\n        // emoji are 4 bytes; ensure truncation doesn't cut them\n        let s = \"a🙂b\"; // a (1) 🙂 (4) b (1)\n                        // limit 2 bytes -\u003e only 'a'\n        assert_eq!(truncate_utf8(s, 2), \"a\");\n        // limit 5 bytes -\u003e include emoji\n        assert_eq!(truncate_utf8(s, 5), \"a🙂\");\n    }\n\n    #[test]\n    fn test_sanitize_payload_zero_max() {\n        let raw = \"non empty\";\n        let (payload, truncated) = sanitize_payload(raw, raw.len(), 0);\n        // with max 0 we should get an owned truncated placeholder\n        assert!(truncated);\n        let s = payload.into_owned();\n        assert!(s.contains(\"payload omitted\"));\n    }\n\n    #[test]\n    fn test_sanitize_payload_within_limit() {\n        let raw = \"test payload\";\n        let original_size = raw.len();\n        let (payload, truncated) = sanitize_payload(raw, original_size, 1000);\n\n        assert!(!truncated);\n        assert_eq!(payload.as_ref(), raw);\n    }\n\n    #[test]\n    fn test_sanitize_payload_exceeds_limit() {\n        let raw = \"this is a very long payload that exceeds the max size\";\n        let original_size = raw.len();\n        let max = 20;\n\n        let (payload, truncated) = sanitize_payload(raw, original_size, max);\n        assert!(truncated);\n        let s = payload.into_owned();\n        assert!(s.contains(\"payload omitted\"));\n    }\n\n    #[test]\n    fn test_truncate_utf8_empty() {\n        assert_eq!(truncate_utf8(\"\", 100), \"\");\n    }\n\n    #[test]\n    fn test_truncate_utf8_zero_max() {\n        assert_eq!(truncate_utf8(\"hello\", 0), \"\");\n    }\n\n    #[test]\n    fn test_truncate_utf8_exact_fit() {\n        let s = \"hello\";\n        assert_eq!(truncate_utf8(s, 5), \"hello\");\n    }\n\n    #[test]\n    fn test_truncate_utf8_mid_char() {\n        // Even with enough bytes for one multi-byte char, it truncates properly\n        let s = \"a🙂\";\n        assert_eq!(truncate_utf8(s, 2), \"a\"); // 2 bytes -\u003e can't fit emoji (4 bytes)\n    }\n\n    #[test]\n    fn test_dlq_payload_serialization() {\n        let ctx = MessageContext::new(\"topic\".to_string(), 0, 42, 123);\n        let reason = crate::errors::PublicErrorReason {\n            code: \"ERR001\".to_string(),\n            message: \"test error\".to_string(),\n        };\n\n        let payload_str = DlqPayload {\n            context: \u0026ctx,\n            reason,\n            pipeline: \"p1\",\n            payload: std::borrow::Cow::Borrowed(\"test\"),\n            original_size: 4,\n            truncated: false,\n        };\n\n        let json = serde_json::to_string(\u0026payload_str).unwrap();\n        assert!(json.contains(\"topic\"));\n        assert!(json.contains(\"ERR001\"));\n        assert!(json.contains(\"test\"));\n    }\n\n    #[test]\n    fn test_dlq_payload_truncated_flag() {\n        let ctx = MessageContext::new(\"topic\".to_string(), 0, 42, 123);\n        let reason = crate::errors::PublicErrorReason {\n            code: \"ERR001\".to_string(),\n            message: \"test error\".to_string(),\n        };\n\n        let payload_str = DlqPayload {\n            context: \u0026ctx,\n            reason,\n            pipeline: \"p1\",\n            payload: std::borrow::Cow::Borrowed(\"test\"),\n            original_size: 1000,\n            truncated: true,\n        };\n\n        let json = serde_json::to_string(\u0026payload_str).unwrap();\n        assert!(json.contains(\"\\\"truncated\\\":true\"));\n    }\n\n    #[test]\n    fn test_max_dlq_preview_bytes_constant() {\n        assert_eq!(MAX_DLQ_PREVIEW_BYTES, 4_096);\n    }\n\n    #[test]\n    fn test_truncate_utf8_multibyte_chars() {\n        // Test with various multibyte characters\n        let s = \"a€b\"; // € is 3 bytes\n        assert_eq!(truncate_utf8(s, 2), \"a\");\n        assert_eq!(truncate_utf8(s, 4), \"a€\");\n    }\n}\n","traces":[{"line":21,"address":[],"length":0,"stats":{"Line":0}},{"line":26,"address":[],"length":0,"stats":{"Line":0}},{"line":27,"address":[],"length":0,"stats":{"Line":0}},{"line":28,"address":[],"length":0,"stats":{"Line":0}},{"line":30,"address":[],"length":0,"stats":{"Line":0}},{"line":31,"address":[],"length":0,"stats":{"Line":0}},{"line":32,"address":[],"length":0,"stats":{"Line":0}},{"line":33,"address":[],"length":0,"stats":{"Line":0}},{"line":34,"address":[],"length":0,"stats":{"Line":0}},{"line":35,"address":[],"length":0,"stats":{"Line":0}},{"line":36,"address":[],"length":0,"stats":{"Line":0}},{"line":37,"address":[],"length":0,"stats":{"Line":0}},{"line":47,"address":[],"length":0,"stats":{"Line":0}},{"line":48,"address":[],"length":0,"stats":{"Line":0}},{"line":49,"address":[],"length":0,"stats":{"Line":0}},{"line":52,"address":[],"length":0,"stats":{"Line":0}},{"line":53,"address":[],"length":0,"stats":{"Line":0}},{"line":54,"address":[],"length":0,"stats":{"Line":0}},{"line":59,"address":[],"length":0,"stats":{"Line":0}},{"line":6
