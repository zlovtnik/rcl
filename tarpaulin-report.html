lse(|| DebeziumError::new(\"missing payload\"))?;\n\n    let op_str = payload\n        .get(\"op\")\n        .and_then(|v| v.as_str())\n        .ok_or_else(|| DebeziumError::new(\"missing op code\"))?;\n\n    let operation = Operation::try_from(op_str)\n        .map_err(|e| DebeziumError::new(format!(\"invalid operation: {}\", e)))?;\n\n    let source_row = match operation {\n        Operation::Create | Operation::Read | Operation::Update =\u003e payload.get(\"after\"),\n        Operation::Delete =\u003e payload.get(\"before\"),\n    };\n\n    let row = source_row\n        .cloned()\n        .ok_or_else(|| DebeziumError::new(\"envelope missing before/after\"))?;\n\n    if let Value::Object(mut obj) = row {\n        obj.insert(\n            \"operation_type\".to_string(),\n            Value::String(operation.to_string()),\n        );\n        Ok(Value::Object(obj))\n    } else {\n        Err(DebeziumError::new(\"before/after payload is not an object\").into())\n    }\n}\n\nfn validate_required_fields(\n    value: \u0026Value,\n    pipeline: \u0026PipelineConfig,\n) -\u003e Result\u003c(), ValidationError\u003e {\n    for field in \u0026pipeline.required_fields {\n        let mut current = Some(value);\n\n        for part in field.split('.') {\n            current = match current.and_then(|v| v.get(part)) {\n                Some(v) if !v.is_null() =\u003e Some(v),\n                _ =\u003e {\n                    return Err(ValidationError::new(format!(\n                        \"missing required field `{}`\",\n                        field\n                    )))\n                }\n            };\n        }\n    }\n    Ok(())\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use crate::eip::BackpressureConfig;\n    use serde_json::json;\n\n    fn make_pipeline(debezium: bool, required: Vec\u003c\u0026str\u003e) -\u003e PipelineConfig {\n        PipelineConfig {\n            name: \"test\".to_string(),\n            topic: \"t\".to_string(),\n            debezium_envelope: debezium,\n            staging_table: \"staging.test\".to_string(),\n            dlq: None,\n            stages: vec![],\n            required_fields: required.into_iter().map(|s| s.to_string()).collect(),\n            backpressure: BackpressureConfig {\n                channel_capacity: 100,\n            },\n        }\n    }\n\n    #[test]\n    fn test_decode_debezium_create() {\n        let payload = json!({\n            \"payload\": {\n                \"op\": \"c\",\n                \"after\": { \"id\": 1, \"name\": \"alice\" }\n            }\n        })\n        .to_string();\n\n        let cfg = make_pipeline(true, vec![]);\n        let res = decode_and_validate(payload.as_bytes(), \u0026cfg).unwrap();\n        assert_eq!(res.get(\"id\").and_then(|v| v.as_i64()), Some(1));\n        assert_eq!(res.get(\"name\").and_then(|v| v.as_str()), Some(\"alice\"));\n        assert_eq!(\n            res.get(\"operation_type\").and_then(|v| v.as_str()),\n            Some(\"c\")\n        );\n    }\n\n    #[test]\n    fn test_decode_debezium_missing_op() {\n        let payload = json!({\n            \"payload\": { \"after\": {\"id\": 1} }\n        })\n        .to_string();\n\n        let cfg = make_pipeline(true, vec![]);\n        let err = decode_and_validate(payload.as_bytes(), \u0026cfg).unwrap_err();\n        match err {\n            ProcessingError::Debezium(_) =\u003e {}\n            _ =\u003e panic!(\"expected Debezium error\"),\n        }\n    }\n\n    #[test]\n    fn test_validate_required_fields_missing() {\n        let payload = json!({ \"id\": 1 }).to_string();\n        let cfg = make_pipeline(false, vec![\"name\"]);\n        let err = decode_and_validate(payload.as_bytes(), \u0026cfg).unwrap_err();\n        match err {\n            ProcessingError::Validation(_) =\u003e {}\n            _ =\u003e panic!(\"expected Validation error\"),\n        }\n    }\n\n    #[test]\n    fn test_invalid_json() {\n        let payload = b\"{ invalid json }\";\n        let cfg = make_pipeline(false, vec![]);\n        let err = decode_and_validate(payload, \u0026cfg).unwrap_err();\n        match err {\n            ProcessingError::JsonDecode(_) =\u003e {}\n            _ =\u003e panic!(\"expected JsonDecode error\"),\n        }\n    }\n}\n","traces":[{"line":6,"address":[],"length":0,"stats":{"Line":10}},{"line":10,"address":[],"length":0,"stats":{"Line":30}},{"line":11,"address":[],"length":0,"stats":{"Line":10}},{"line":14,"address":[],"length":0,"stats":{"Line":6}},{"line":17,"address":[],"length":0,"stats":{"Line":9}},{"line":18,"address":[],"length":0,"stats":{"Line":7}},{"line":21,"address":[],"length":0,"stats":{"Line":2}},{"line":22,"address":[],"length":0,"stats":{"Line":4}},{"line":25,"address":[],"length":0,"stats":{"Line":2}},{"line":27,"address":[],"length":0,"stats":{"Line":1}},{"line":29,"address":[],"length":0,"stats":{"Line":2}},{"line":30,"address":[],"length":0,"stats":{"Line":2}},{"line":32,"address":[],"length":0,"stats":{"Line":1}},{"line":33,"address":[],"length":0,"stats":{"Line":0}},{"line":36,"address":[],"length":0,"stats":{"Line":1}},{"line":37,"address":[],"length":0,"stats":{"Line":0}},{"line":40,"address":[],"length":0,"stats":{"Line":1}},{"line":42,"address":[],"length":0,"stats":{"Line":0}},{"line":44,"address":[],"length":0,"stats":{"Line":1}},{"line":51,"address":[],"length":0,"stats":{"Line":0}},{"line":55,"address":[],"length":0,"stats":{"Line":8}},{"line":59,"address":[],"length":0,"stats":{"Line":9}},{"line":60,"address":[],"length":0,"stats":{"Line":2}},{"line":62,"address":[],"length":0,"stats":{"Line":3}},{"line":63,"address":[],"length":0,"stats":{"Line":3}},{"line":64,"address":[],"length":0,"stats":{"Line":0}},{"line":66,"address":[],"length":0,"stats":{"Line":1}},{"line":67,"address":[],"length":0,"stats":{"Line":1}},{"line":68,"address":[],"length":0,"stats":{"Line":1}},{"line":74,"address":[],"length":0,"stats":{"Line":7}}],"covered":25,"coverable":30},{"path":["/","Users","rcs","git","rcl","src","dlq.rs"],"content":"use crate::config::KafkaConfig;\nuse crate::eip::DlqConfig;\nuse crate::errors::{ProcessingError, PublicErrorReason};\nuse crate::types::MessageContext;\nuse anyhow::Result;\nuse chrono::Utc;\nuse futures::StreamExt;\nuse rdkafka::consumer::{Consumer, StreamConsumer};\nuse rdkafka::message::{Header, OwnedHeaders};\nuse rdkafka::producer::{FutureProducer, FutureRecord};\nuse rdkafka::Message;\nuse serde::{Deserialize, Serialize};\nuse std::borrow::Cow;\nuse std::fs::File;\nuse std::io::Write;\nuse std::time::{Duration, Instant};\nuse tracing::warn;\n\nconst MAX_DLQ_PREVIEW_BYTES: usize = 4_096;\n\nasync fn wait_for_kafka_readiness(\n    consumer: \u0026StreamConsumer,\n    readiness_timeout_secs: u64,\n    readiness_backoff_secs: u64,\n) -\u003e Result\u003c()\u003e {\n    let readiness_timeout = Duration::from_secs(readiness_timeout_secs);\n    let readiness_backoff = Duration::from_secs(readiness_backoff_secs);\n    let start = Instant::now();\n    loop {\n        match consumer.fetch_metadata(None, Duration::from_millis(100)) {\n            Ok(_) =\u003e break,\n            Err(e) =\u003e {\n                if start.elapsed() \u003e readiness_timeout {\n                    return Err(anyhow::anyhow!(\n                        \"Kafka readiness check timed out after {}s: {}\",\n                        readiness_timeout.as_secs(),\n                        e\n                    ));\n                }\n                tokio::time::sleep(readiness_backoff).await;\n            }\n        }\n    }\n    Ok(())\n}\n\npub fn build_producer(cfg: \u0026KafkaConfig) -\u003e Result\u003cFutureProducer\u003e {\n    let producer: FutureProducer = rdkafka::config::ClientConfig::new()\n        .set(\"bootstrap.servers\", \u0026cfg.brokers)\n        .set(\"enable.idempotence\", \"true\")\n        .set(\"acks\", \"all\")\n        .set(\"retries\", cfg.producer_retries.to_string())\n        .set(\"compression.type\", \u0026cfg.compression)\n        .set(\"message.timeout.ms\", cfg.dlq_message_timeout_ms.to_string())\n        .create()?;\n    Ok(producer)\n}\n\nfn build_dlq_consumer(cfg: \u0026KafkaConfig, group_id: String) -\u003e Result\u003cStreamConsumer\u003e {\n    let consumer: StreamConsumer = rdkafka::config::ClientConfig::new()\n        .set(\"bootstrap.servers\", \u0026cfg.brokers)\n        .set(\"group.id\", group_id)\n        .set(\"auto.offset.reset\", \"earliest\")\n        .set(\"enable.auto.commit\", \"false\")\n        .create()?;\n    Ok(consumer)\n}\n\n#[derive(Serialize)]\npub struct DlqPayload\u003c'a\u003e {\n    pub context: \u0026'a MessageContext,\n    pub reason: PublicErrorReason,\n    pub pipeline: \u0026'a str,\n    pub payload: Cow\u003c'a, str\u003e,\n    pub original_size: usize,\n    pub truncated: bool,\n}\n\npub async fn publish(\n    producer: \u0026FutureProducer,\n    pipeline_name: \u0026str,\n    dlq_cfg: \u0026DlqConfig,\n    ctx: \u0026MessageContext,\n    reason: \u0026ProcessingError,\n    raw_payload: \u0026str,\n) -\u003e Result\u003c()\u003e {\n    let correlation = ctx.correlation_id();\n    let public_reason = reason.public_reason();\n    let timestamp = Utc::now().to_rfc3339();\n    let retry_count = \"0\";\n    let original_size = raw_payload.len();\n    let (payload, truncated) =\n        sanitize_payload(raw_payload, original_size, dlq_cfg.max_payload_bytes);\n    let body = serde_json::to_string(\u0026DlqPayload {\n        context: ctx,\n        reason: public_reason.clone(),\n        pipeline: pipeline_name,\n        payload,\n        original_size,\n        truncated,\n    })?;\n\n    let headers = OwnedHeaders::new()\n        .insert(Header {\n            key: \"error_type\",\n            value: Some(public_reason.code.as_bytes()),\n        })\n        .insert(Header {\n            key: \"timestamp\",\n            value: Some(timestamp.as_bytes()),\n        })\n        .insert(Header {\n            key: \"retry_count\",\n            value: Some(retry_count.as_bytes()),\n        })\n        .insert(Header {\n            key: \"original_topic\",\n            value: Some(ctx.topic.as_bytes()),\n        });\n\n    let record = FutureRecord::to(\u0026dlq_cfg.topic)\n        .payload(\u0026body)\n        .key(\u0026correlation)\n        .headers(headers);\n\n    producer\n        .send(record, Duration::from_secs(5))\n        .await\n        .map_err(|(e, _)| anyhow::anyhow!(\"dlq send failed: {e}\"))?;\n    Ok(())\n}\n\nfn sanitize_payload\u003c'a\u003e(\n    raw_payload: \u0026'a str,\n    original_size: usize,\n    max_payload_bytes: usize,\n) -\u003e (Cow\u003c'a, str\u003e, bool) {\n    if original_size \u003c= max_payload_bytes {\n        return (Cow::Borrowed(raw_payload), false);\n    }\n\n    let preview_limit = max_payload_bytes.min(MAX_DLQ_PREVIEW_BYTES);\n    let preview = truncate_utf8(raw_payload, preview_limit);\n    let payload = format!(\"{}...\u003cpayload omitted - too large\u003e\", preview);\n\n    (Cow::Owned(payload), true)\n}\n\nfn truncate_utf8(input: \u0026str, max_bytes: usize) -\u003e \u0026str {\n    if input.is_empty() || max_bytes == 0 {\n        return \"\";\n    }\n\n    let mut end = 0;\n    for (idx, ch) in input.char_indices() {\n        let next = idx + ch.len_utf8();\n        if next \u003e max_bytes {\n            break;\n        }\n        end = next;\n    }\n\n    \u0026input[..end]\n}\n\n#[derive(Deserialize)]\nstruct OwnedDlqPayload {\n    context: MessageContext,\n    #[allow(dead_code)]\n    reason: OwnedPublicErrorReason,\n    #[allow(dead_code)]\n    pipeline: String,\n    payload: String,\n    #[allow(dead_code)]\n    original_size: usize,\n    truncated: bool,\n}\n\n#[derive(Deserialize)]\nstruct OwnedPublicErrorReason {\n    #[allow(dead_code)]\n    code: String,\n    #[allow(dead_code)]\n    message: String,\n}\n\npub async fn drain(\n    cfg: \u0026KafkaConfig,\n    topic: \u0026str,\n    output_file: Option\u003cString\u003e,\n    requeue: bool,\n) -\u003e Result\u003c()\u003e {\n    let consumer = build_dlq_consumer(cfg, format!(\"rcl-dlq-drain-{}\", uuid::Uuid::new_v4()))?;\n\n    consumer.subscribe(\u0026[topic])?;\n\n    let producer = if requeue {\n        Some(build_producer(cfg)?)\n    } else {\n        None\n    };\n\n    let mut file = if let Some(path) = output_file {\n        Some(File::create(path)?)\n    } else {\n        None\n    };\n\n    println!(\"Draining DLQ topic: {}\", topic);\n\n    wait_for_kafka_readiness(\n        \u0026consumer,\n        cfg.dlq_readiness_timeout_secs,\n        cfg.dlq_readiness_backoff_secs,\n    )\n    .await?;\n\n    let mut count = 0;\n    let mut stream = consumer.stream();\n\n    loop {\n        match tokio::time::timeout(Duration::from_secs(2), stream.next()).await {\n            Ok(Some(Ok(msg))) =\u003e {\n                if let Some(payload_str) = msg.payload_view::\u003cstr\u003e().and_then(|r| r.ok()) {\n                    match serde_json::from_str::\u003cOwnedDlqPayload\u003e(payload_str) {\n                        Ok(dlq_msg) =\u003e {\n                            if let Some(p) = \u0026producer {\n                                if dlq_msg.truncated {\n                                    eprintln!(\n                                        \"Skipping requeue for truncated message at offset {}\",\n                                        msg.offset()\n                                    );\n                                    if let Some(f) = \u0026mut file {\n                                        writeln!(f, \"{}\", payload_str)?;\n                                    }\n                                } else {\n                                    if let Some(f) = \u0026mut file {\n                                        writeln!(f, \"{}\", payload_str)?;\n                                    }\n                                    let key = dlq_msg.context.correlation_id();\n                                    let record = FutureRecord::to(\u0026dlq_msg.context.topic)\n                                        .payload(\u0026dlq_msg.payload)\n                                        .key(\u0026key);\n\n                                    match p.send(record, Duration::from_secs(5)).await {\n                                        Ok(_) =\u003e {\n                                            println!(\n                                                \"Requeued message from offset {} to {}\",\n                                                msg.offset(),\n                                                dlq_msg.context.topic\n                                            );\n                                        }\n                                        Err((e, _)) =\u003e {\n                                            eprintln!(\n                                                \"Failed to requeue message at offset {}: {}\",\n                                                msg.offset(),\n                                                e\n                                            );\n                                        }\n                                    }\n                                    println!(\n                                        \"Requeued message from offset {} to {}\",\n                                        msg.offset(),\n                                        dlq_msg.context.topic\n                                    );\n                                }\n                            } else if let Some(f) = \u0026mut file {\n                                writeln!(f, \"{}\", payload_str)?;\n                            }\n                        }\n                        Err(e) =\u003e {\n                            eprintln!(\n                                \"Failed to parse DLQ message at offset {}: {}\",\n                                msg.offset(),\n                                e\n                            );\n                        }\n                    }\n                } else {\n                    warn!(\n                        topic = %msg.topic(),\n                        partition = msg.partition(),\n                        offset = msg.offset(),\n                        payload_len = msg.payload().map(|p| p.len()).unwrap_or(0),\n                        \"Skipping DLQ message with invalid UTF-8 payload\"\n                    );\n                }\n\n                // Commit offset to mark as processed (drained)\n                let mut tpl = rdkafka::TopicPartitionList::new();\n                tpl.add_partition_offset(\n                    topic,\n                    msg.partition(),\n                    rdkafka::Offset::Offset(msg.offset() + 1),\n                )?;\n                consumer.commit(\u0026tpl, rdkafka::consumer::CommitMode::Async)?;\n\n                count += 1;\n            }\n            Ok(Some(Err(e))) =\u003e {\n                eprintln!(\"Error receiving message: {}\", e);\n                break;\n            }\n            Ok(None) =\u003e break,\n            Err(_) =\u003e {\n                println!(\"Drain complete (timeout). Processed {} messages.\", count);\n                break;\n            }\n        }\n    }\n\n    Ok(())\n}\n\npub async fn inspect(cfg: \u0026KafkaConfig, topic: \u0026str, limit: usize) -\u003e Result\u003c()\u003e {\n    let consumer = build_dlq_consumer(cfg, format!(\"rcl-dlq-inspector-{}\", uuid::Uuid::new_v4()))?;\n\n    consumer.subscribe(\u0026[topic])?;\n\n    println!(\"Inspecting DLQ topic: {}\", topic);\n    let mut count = 0;\n\n    wait_for_kafka_readiness(\n        \u0026consumer,\n        cfg.dlq_readiness_timeout_secs,\n        cfg.dlq_readiness_backoff_secs,\n    )\n    .await?;\n\n    while count \u003c limit {\n        match tokio::time::timeout(Duration::from_secs(5), consumer.recv()).await {\n            Ok(Ok(m)) =\u003e {\n                if let Some(payload) = m.payload_view::\u003cstr\u003e() {\n                    match payload {\n                        Ok(s) =\u003e println!(\"Offset {}: {}\", m.offset(), s),\n                        Err(e) =\u003e println!(\"Offset {}: [Invalid UTF-8] {:?}\", m.offset(), e),\n                    }\n                }\n                count += 1;\n            }\n            Ok(Err(e)) =\u003e {\n                eprintln!(\"Error receiving message: {}\", e);\n                break;\n            }\n            Err(_) =\u003e {\n                println!(\"Timeout waiting for messages.\");\n                break;\n            }\n        }\n    }\n    Ok(())\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use crate::types::MessageContext;\n\n    #[test]\n    fn test_truncate_utf8_empty_and_zero() {\n        assert_eq!(truncate_utf8(\"\", 10), \"\");\n        assert_eq!(truncate_utf8(\"hello\", 0), \"\");\n    }\n\n    #[test]\n    fn test_truncate_utf8_multibyte() {\n        // 'é' is two bytes in UTF-8; ensure we don't cut in the middle\n        let s = \"aébc\"; // bytes: a (1) é (2) b (1) c (1)\n                        // limit 2 bytes should only include 'a'\n        assert_eq!(truncate_utf8(s, 2), \"a\");\n        // limit 3 bytes should include 'a' and 'é'\n        assert_eq!(truncate_utf8(s, 3), \"aé\");\n    }\n\n    #[test]\n    fn test_sanitize_payload_small() {\n        let raw = \"small payload\";\n        let (payload, truncated) = sanitize_payload(raw, raw.len(), 100);\n        assert!(!truncated);\n        assert!(matches!(payload, std::borrow::Cow::Borrowed(_)));\n    }\n\n    #[test]\n    fn test_sanitize_payload_large() {\n        let raw = \"x\".repeat(10_000);\n        let (payload, truncated) = sanitize_payload(\u0026raw, raw.len(), 1024);\n        assert!(truncated);\n        let s = payload.into_owned();\n        assert!(s.contains(\"\u003cpayload omitted - too large\u003e\"));\n    }\n\n    #[test]\n    fn test_dlq_payload_serialize() {\n        let ctx = MessageContext::new(\"topic-a\".to_string(), 1, 2, 3);\n        let reason = crate::errors::ProcessingError::Validation(\n            crate::errors::ValidationError::new(\"bad\".to_string()),\n        );\n        let raw = \"ok\";\n        let dlq_cfg = crate::eip::DlqConfig {\n            topic: \"dlq\".to_string(),\n            max_payload_bytes: 1024,\n            max_retries: 3,\n        };\n\n        let (payload, truncated) = sanitize_payload(raw, raw.len(), dlq_cfg.max_payload_bytes);\n        let body = serde_json::to_string(\u0026DlqPayload {\n            context: \u0026ctx,\n            reason: reason.public_reason(),\n            pipeline: \"p1\",\n            payload,\n            original_size: raw.len(),\n            truncated,\n        })\n        .unwrap();\n\n        // Should be valid JSON and contain expected fields\n        let v: serde_json::Value = serde_json::from_str(\u0026body).unwrap();\n        assert_eq!(v.get(\"pipeline\").and_then(|p| p.as_str()), Some(\"p1\"));\n        assert_eq!(v.get(\"payload\").and_then(|p| p.as_str()), Some(\"ok\"));\n    }\n\n    #[test]\n    fn test_truncate_utf8_emoji_and_boundaries() {\n        // emoji are 4 bytes; ensure truncation doesn't cut them\n        let s = \"a🙂b\"; // a (1) 🙂 (4) b (1)\n                        // limit 2 bytes -\u003e only 'a'\n        assert_eq!(truncate_utf8(s, 2), \"a\");\n        // limit 5 bytes -\u003e include emoji\n        assert_eq!(truncate_utf8(s, 5), \"a🙂\");\n    }\n\n    #[test]\n    fn test_sanitize_payload_zero_max() {\n        let raw = \"non empty\";\n        let (payload, truncated) = sanitize_payload(raw, raw.len(), 0);\n        // with max 0 we should get an owned truncated placeholder\n        assert!(truncated);\n        let s = payload.into_owned();\n        assert!(s.contains(\"payload omitted\"));\n    }\n\n    #[test]\n    fn test_sanitize_payload_within_limit() {\n        let raw = \"test payload\";\n        let original_size = raw.len();\n        let (payload, truncated) = sanitize_payload(raw, original_size, 1000);\n\n        assert!(!truncated);\n        assert_eq!(payload e::errors::PublicErrorReason {\n            code: \"ERR001\".to_string(),\n            message: \"test error\".to_string(),\n        };\n\n        let payload_str = DlqPayload {\n            context: \u0026ctx,\n            reason,\n            pipeline: \"p1\",\n            payload: std::borrow::Cow::Borrowed(\"test\"),\n            original_size: 1000,\n            truncated: true,\n        };\n\n        let json = serde_json::to_string(\u0026payload_str).unwrap();\n        assert!(json.contains(\"\\\"truncated\\\":true\"));\n    }\n\n    #[test]\n    fn test_max_dlq_preview_bytes_constant() {\n        assert_eq!(MAX_DLQ_PREVIEW_BYTES, 4_096);\n    }\n\n    #[test]\n    fn test_truncate_utf8_multibyte_chars() {\n        // Test with various multibyte characters\n        let s = \"a€b\"; // € is 3 bytes\n        assert_eq!(truncate_utf8(s, 2), \"a\");\n        assert_eq!(truncate_utf8(s, 4), \"a€\");\n    }\n}\n","traces":[{"line":21,"address":[],"length":0,"stats":{"Line":0}},{"line":26,"address":[],"length":0,"stats":{"Line":0}},{"line":27,"address":[],"length":0,"stats":{"Line":0}},{"line":28,"address":[],"length":0,"stats":{"Line":0}},{"line":30,"address":[],"length":0,"stats":{"Line":0}},{"line":31,"address":[],"length":0,"stats":{"Line":0}},{"line":32,"address":[],"length":0,"stats":{"Line":0}},{"line":33,"address":[],"length":0,"stats":{"Line":0}},{"line":34,"address":[],"length":0,"stats":{"Line":0}},{"line":35,"address":[],"length":0,"stats":{"Line":0}},{"line":36,"address":[],"length":0,"stats":{"Line":0}},{"line":37,"address":[],"length":0,"stats":{"Line":0}},{"line":47,"address":[],"length":0,"stats":{"Line":0}},{"line":48,"address":[],"length":0,"stats":{"Line":0}},{"line":49,"address":[],"length":0,"stats":{"Line":0}},{"line":52,"address":[],"length":0,"stats":{"Line":0}},{"line":53,"address":[],"length":0,"stats":{"Line":0}},{"line":54,"address":[],"length":0,"stats":{"Line":0}},{"line":59,"address":[],"length":0,"stats":{"Line":0}},{"line":60,"addre h":0,"stats":{"Line":0}},{"line":351,"address":[],"length":0,"stats":{"Line":0}}],"covered":10,"coverable":128},{"path":["/","Users","rcs","git","rcl","src","eip.rs"],"content":"use crate::errors::ProcessingError;\nuse crate::stages::{\n    FilterStage, IdempotentReceiverStage, RouterStage, SplitterStage, TransformerStage,\n};\nuse anyhow::Result;\nuse async_trait::async_trait;\nuse serde_json::Value;\nuse std::collections::HashMap;\n\n/// Core abstractions for Enterprise Integration Patterns\n\n#[derive(Clone, Debug)]\n#[allow(dead_code)]\npub struct StageContext {\n    pub correlation_id: String,\n    pub pipeline_name: String,\n    pub message_metadata: MessageMetadata,\n}\n\n#[derive(Clone, Debug)]\n#[allow(dead_code)]\npub struct MessageMetadata {\n    pub topic: String,\n    pub partition: i32,\n    pub offset: i64,\n    pub timestamp: Option\u003ci64\u003e,\n    pub headers: HashMap\u003cString, String\u003e,\n}\n\nimpl MessageMetadata {\n    pub fn from_kafka(topic: String, partition: i32, offset: i64, timestamp: Option\u003ci64\u003e) -\u003e Self {\n        Self {\n            topic,\n            partition,\n            offset,\n            timestamp,\n            headers: HashMap::new(),\n        }\n    }\n}\n\n#[derive(Clone, Debug)]\npub enum StageResult {\n    /// Continue to next stage with this message\n    Continue(Value),\n    /// Skip this message (filtered out)\n    Skip,\n    /// Split into multiple messages\n    Split(Vec\u003cValue\u003e),\n    /// Error processing (send to DLQ if configured)\n    #[allow(dead_code)]\n    Error(StageError),\n}\n\n#[derive(Clone, Debug)]\npub struct StageError {\n    pub code: String,\n    pub message: String,\n    pub retryable: bool,\n}\n\nimpl std::fmt::Display for StageError {\n    fn fmt(\u0026self, f: \u0026mut std::fmt::Formatter\u003c'_\u003e) -\u003e std::fmt::Result {\n        write!(f, \"{}: {}\", self.code, self.message)\n    }\n}\n\nimpl StageError {\n    pub fn new(code: impl Into\u003cString\u003e, message: impl Into\u003cString\u003e) -\u003e Self {\n        Self {\n            code: code.into(),\n            message: message.into(),\n            retryable: false,\n        }\n    }\n}\n\n#[async_trait]\npub trait Stage: Send + Sync {\n    /// Process a message through this stage\n    async fn process(\u0026self, ctx: \u0026StageContext, msg: Value)\n        -\u003e Result\u003cStageResult, ProcessingError\u003e;\n\n    /// Stage name for metrics/logging\n    #[allow(dead_code)]\n    fn name(\u0026self) -\u003e \u0026str;\n\n    /// Initialize stage (setup connections, caches, etc.)\n    #[allow(dead_code)]\n    async fn initialize(\u0026self) -\u003e Result\u003c(), ProcessingError\u003e {\n        Ok(())\n    }\n\n    /// Cleanup resources\n    #[allow(dead_code)]\n    async fn shutdown(\u0026self) -\u003e Result\u003c(), ProcessingError\u003e {\n        Ok(())\n    }\n\n    /// Health check\n    #[allow(dead_code)]\n    async fn health_check(\u0026self) -\u003e Result\u003c(), ProcessingError\u003e {\n        Ok(())\n    }\n}\n\npub struct Pipeline {\n    pub name: String,\n    pub stages: Vec\u003cBox\u003cdyn Stage\u003e\u003e,\n    pub config: PipelineConfig,\n}\n\nimpl Pipeline {\n    pub fn from_config(config: \u0026PipelineConfig) -\u003e Result\u003cSelf\u003e {\n        let mut stages = Vec::new();\n        for stage_def in \u0026config.stages {\n            let stage = StageFactory::create(stage_def)?;\n            stages.push(stage);\n        }\n\n        Ok(Self {\n            name: config.name.clone(),\n            stages,\n            config: config.clone(),\n        })\n    }\n\n    pub async fn execute(\n        \u0026self,\n        ctx: \u0026StageContext,\n        msg: Value,\n    ) -\u003e Result\u003cVec\u003cValue\u003e, ProcessingError\u003e {\n        let mut current_messages = vec![msg];\n\n        for stage in \u0026self.stages {\n            let mut next_messages = Vec::new();\n\n            for msg in current_messages {\n                let result = stage.process(ctx, msg).await?;\n                match result {\n                    StageResult::Continue(new_msg) =\u003e next_messages.push(new_msg),\n                    StageResult::Skip =\u003e {\n                        // Skip this message\n                    }\n                    StageResult::Split(msgs) =\u003e {\n                        next_messages.extend(msgs);\n                    }\n                    StageResult::Error(err) =\u003e {\n                        return Err(ProcessingError::Stage(err));\n                    }\n                }\n            }\n\n            current_messages = next_messages;\n\n            if current_messages.is_empty() {\n                break;\n            }\n        }\n\n        Ok(current_messages)\n    }\n}\n\nimpl Clone for Pipeline {\n    fn clone(\u0026self) -\u003e Self {\n        // Recreate the pipeline from config since stages can't be cloned\n        Self::from_config(\u0026self.config)\n            .expect(\"Pipeline::clone failed: config was valid at construction\")\n    }\n}\n\n#[derive(Clone, Debug, serde::Deserialize, serde::Serialize)]\npub struct PipelineConfig {\n    pub name: String,\n    pub topic: String,\n    pub debezium_envelope: bool,\n    pub staging_table: String,\n    pub dlq: Option\u003cDlqConfig\u003e,\n    pub stages: Vec\u003cStageDefinition\u003e,\n    // Legacy fields for compatibility\n    pub required_fields: Vec\u003cString\u003e,\n    #[serde(default)]\n    pub backpressure: BackpressureConfig,\n}\n\n#[derive(Clone, Debug, serde::Deserialize, serde::Serialize)]\npub struct BackpressureConfig {\n    #[serde(default = \"BackpressureConfig::default_channel_capacity\")]\n    pub channel_capacity: usize,\n}\n\nimpl Default for BackpressureConfig {\n    fn default() -\u003e Self {\n        Self {\n            channel_capacity: Self::DEFAULT_CHANNEL_CAPACITY,\n        }\n    }\n}\n\nimpl BackpressureConfig {\n    pub const DEFAULT_CHANNEL_CAPACITY: usize = 20_000;\n\n    pub fn default_channel_capacity() -\u003e usize {\n        Self::DEFAULT_CHANNEL_CAPACITY\n    }\n}\n\n#[derive(Clone, Debug, serde::Deserialize, serde::Serialize)]\npub struct StageDefinition {\n    pub r#type: String,\n    pub name: String,\n    pub config: Value,\n}\n\n#[derive(Clone, Debug, serde::Deserialize, serde::Serialize)]\npub struct DlqConfig {\n    pub topic: String,\n    pub max_retries: u16,\n    #[serde(default = \"DlqConfig::default_max_payload_bytes\")]\n    pub max_payload_bytes: usize,\n}\n\nimpl DlqConfig {\n    pub const DEFAULT_MAX_PAYLOAD_BYTES: usize = 1_000_000;\n\n    pub fn default_max_payload_bytes() -\u003e usize {\n        Self::DEFAULT_MAX_PAYLOAD_BYTES\n    }\n}\n\npub struct StageFactory;\n\nimpl StageFactory {\n    pub fn create(def: \u0026StageDefinition) -\u003e Result\u003cBox\u003cdyn Stage\u003e\u003e {\n        match def.r#type.as_str() {\n            \"filter\" =\u003e Ok(Box::new(FilterStage::from_config(\n                def.name.clone(),\n                def.config.clone(),\n            )?)),\n            \"transformer\" =\u003e Ok(Box::new(TransformerStage::from_config(\n                def.name.clone(),\n                def.config.clone(),\n            )?)),\n            \"router\" =\u003e Ok(Box::new(RouterStage::from_config(\n                def.name.clone(),\n                def.config.clone(),\n            )?)),\n            \"splitter\" =\u003e Ok(Box::new(SplitterStage::from_config(\n                def.name.clone(),\n                def.config.clone(),\n            )?)),\n            \"idempotent_receiver\" =\u003e Ok(Box::new(IdempotentReceiverStage::from_config(\n                def.name.clone(),\n                def.config.clone(),\n            )?)),\n            _ =\u003e Err(anyhow::anyhow!(\"unknown stage type: {}\", def.r#type)),\n        }\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use serde_json::json;\n\n    fn create_test_context() -\u003e StageContext {\n        StageContext {\n            correlation_id: \"test-correlation\".to_string(),\n            pipeline_name: \"test-pipeline\".to_string(),\n            message_metadata: MessageMetadata::from_kafka(\"test-topic\".to_string(), 0, 0, None),\n        }\n    }\n\n    fn create_filter_stage() -\u003e Box\u003cdyn Stage\u003e {\n        let stage_def = StageDefinition {\n            name: \"filter\".to_string(),\n            r#type: \"filter\".to_string(),\n            config: json!({\n                \"mode\": \"include\",\n                \"conditions\": [\n                    {\n                        \"field\": \"status\",\n                        \"equals\": \"active\"\n                    }\n                ],\n                \"logic\": \"AND\"\n            }),\n        };\n        StageFactory::create(\u0026stage_def).unwrap()\n    }\n\n    fn create_transformer_stage() -\u003e Box\u003cdyn Stage\u003e {\n        let stage_def = StageDefinition {\n            name: \"transformer\".to_string(),\n            r#type: \"transformer\".to_string(),\n            config: json!({\n                \"transformations\": [\n                    {\n                        \"type\": \"add_field\",\n                        \"name\": \"processed_at\",\n                        \"value\": \"{{now}}\"\n                    }\n                ]\n            }),\n        };\n        StageFactory::create(\u0026stage_def).unwrap()\n    }\n\n    fn create_router_stage() -\u003e Box\u003cdyn Stage\u003e {\n        let stage_def = StageDefinition {\n            name: \"router\".to_string(),\n            r#type: \"router\".to_string(),\n            config: json!({\n                \"route_by\": \"category\",\n                \"routes\": {\n                    \"electronics\": \"inventory\"\n                },\n                \"default\": \"general\",\n                \"metadata_field\": \"destination\"\n            }),\n        };\n        StageFactory::create(\u0026stage_def).unwrap()\n    }\n\n    #[t age is missing the expected payload bytes.\n    #[allow(dead_code)]\n    #[error(\"missing payload\")]\n    MissingPayload,\n    /// Raised when payload bytes cannot be converted to UTF-8.\n    #[error(\"invalid utf8: {0}\")]\n    InvalidUtf8(#[from] std::str::Utf8Error),\n    /// Raised when JSON parsing fails while decoding the payload.\n    #[error(\"json decode error: {0}\")]\n    JsonDecode(#[from] JsonError),\n    /// Raised when the Debezium envelope is malformed or incomplete.\n    #[error(\"debezium unwrap failed: {0}\")]\n    Debezium(#[from] DebeziumError),\n    /// Raised when a message violates pipeline validation rules.\n    #[error(\"validation failed: {0}\")]\n    Validation(#[from] ValidationError),\n    /// Raised when downstream transport or storage calls fail.\n    #[error(\"transport: {0}\")]\n    Transport(#[from] TransportError),\n    /// Raised when a pipeline stage fails.\n    #[error(\"stage error: {0}\")]\n    Stage(crate::eip::StageError),\n    /// Raised when batch write partially fails - some messages succeeded, some failed.\n    #[error(\"batch partial failure: {0}\")]\n    BatchPartialFailure(#[from] BatchPartialFailure),\n}\n\n#[derive(Debug, Error)]\n#[error(\"{message}\")]\npub struct DebeziumError {\n    message: String,\n}\n\nimpl DebeziumError {\n    pub fn new(message: impl Into\u003cString\u003e) -\u003e Self {\n        Self {\n            message: message.into(),\n        }\n    }\n}\n\n#[derive(Debug, Error)]\n#[error(\"{message}\")]\npub struct ValidationError {\n    message: String,\n}\n\nimpl ValidationError {\n    pub fn new(message: impl Into\u003cString\u003e) -\u003e Self {\n        Self {\n            message: message.into(),\n        }\n    }\n}\n\n#[derive(Debug, Error)]\n#[error(\"batch partial failure: {failed_count} of {total_count} messages failed\")]\npub struct BatchPartialFailure {\n    pub failed_count: usize,\n    pub total_count: usize,\n    pub failed_messages: Vec\u003c(serde_json::Value, ProcessingError)\u003e,\n}\n\nimpl BatchPartialFailure {\n    pub fn new(\n        failed_count: usize,\n        total_count: usize,\n        failed_messages: Vec\u003c(serde_json::Value, ProcessingError)\u003e,\n    ) -\u003e Self {\n        Self {\n            failed_count,\n            total_count,\n            failed_messages,\n        }\n    }\n}\n\n#[derive(Debug, Error)]\n#[error(\"{context}: {source}\")]\npub struct TransportError {\n    context: \u0026'static str,\n    #[source]\n    source: TransportSource,\n}\n\nimpl TransportError {\n    pub fn new(context: \u0026'static str, source: impl Into\u003cTransportSource\u003e) -\u003e Self {\n        Self {\n            context,\n            source: source.into(),\n        }\n    }\n}\n\n#[derive(Debug, Error)]\npub enum TransportSource {\n    #[error(transparent)]\n    Sqlx(#[from] SqlxError),\n    #[error(transparent)]\n    Json(#[from] JsonError),\n    #[error(transparent)]\n    Csv(#[from] csv::Error),\n    #[error(\"utf8 error: {0}\")]\n    Utf8(#[from] std::string::FromUtf8Error),\n}\n\n#[derive(Debug, Serialize, Clone)]\npub struct PublicErrorReason {\n    pub code: String,\n    pub message: String,\n}\n\nimpl TransportError {\n    pub fn is_retryable(\u0026self) -\u003e bool {\n        self.source.is_retryable()\n    }\n}\n\nimpl TransportSource {\n    pub fn is_retryable(\u0026self) -\u003e bool {\n        match self {\n            TransportSource::Json(_) =\u003e false,\n            TransportSource::Sqlx(e) =\u003e match e {\n                SqlxError::Io(_) | SqlxError::PoolTimedOut | SqlxError::Tls(_) =\u003e true,\n                // PoolClosed and WorkerCrashed are treated as non-retryable because they indicate\n                // the connection pool is in a terminal state. Retrying with the same pool instance\n                // would be futile. These should propagate up to trigger a service restart/recovery.\n                SqlxError::PoolClosed | SqlxError::WorkerCrashed =\u003e false,\n                SqlxError::Database(db_err) =\u003e is_transient_db_error(\u0026**db_err),\n                _ =\u003e false,\n            },\n            TransportSource::Csv(_) =\u003e false,\n            TransportSource::Utf8(_) =\u003e false,\n        }\n    }\n}\n\nfn is_transient_db_error(err: \u0026dyn sqlx::error::DatabaseError) -\u003e bool {\n    if let Some(code) = err.code() {\n        match code.as_ref() {\n            // 40001: serialization_failure\n            // 40P01: deadlock_detected\n            \"40001\" | \"40P01\" =\u003e true,\n            // 53300: too_many_connections\n            // 53400: configuration_limit_exceeded\n            \"53300\" | \"53400\" =\u003e true,\n            // 57P01: admin_shutdown\n            // 57P02: crash_shutdown\n            // 57P03: cannot_connect_now\n            \"57P01\" | \"57P02\" | \"57P03\" =\u003e true,\n            // 08xxx: Connection exceptions\n            c if c.starts_with(\"08\") =\u003e true,\n            _ =\u003e false,\n        }\n    } else {\n        // If there's no error code, we assume it's not a transient DB error (e.g. generic error)\n        // unless we want to be conservative. But usually DB errors have codes.\n        false\n    }\n}\n\nimpl ProcessingError {\n    pub fn public_reason(\u0026self) -\u003e PublicErrorReason {\n        match self {\n            ProcessingError::MissingPayload =\u003e PublicErrorReason {\n                code: \"missing_payload\".to_string(),\n                message: \"payload is missing\".to_string(),\n            },\n            ProcessingError::InvalidUtf8(_) =\u003e PublicErrorReason {\n                code: \"invalid_utf8\".to_string(),\n                message: \"payload is not valid utf-8\".to_string(),\n            },\n            ProcessingError::JsonDecode(_) =\u003e PublicErrorReason {\n                code: \"json_decode\".to_string(),\n                message: \"failed to decode json\".to_string(),\n            },\n            ProcessingError::Debezium(_) =\u003e PublicErrorReason {\n                code: \"debezium\".to_string(),\n                message: \"failed to unwrap debezium envelope\".to_string(),\n            },\n            ProcessingError::Validation(_) =\u003e PublicErrorReason {\n                code: \"validation\".to_string(),\n                message: \"validation failed\".to_string(),\n            },\n            ProcessingError::Transport(_) =\u003e PublicErrorReason {\n                code: \"transport\".to_string(),\n                message: \"transport error\".to_string(),\n            },\n            ProcessingError::Stage(e) =\u003e PublicErrorReason {\n                code: e.code.clone(),\n                message: e.message.clone(),\n            },\n            ProcessingError::BatchPartialFailure(e) =\u003e PublicErrorReason {\n                code: \"batch_partial_failure\".to_string(),\n                message: format!(\n                    \"{} of {} messages failed in batch\",\n                    e.failed_count, e.total_count\n                ),\n            },\n        }\n    }\n\n    pub fn is_retryable(\u0026self) -\u003e bool {\n        match self {\n            ProcessingError::Transport(e) =\u003e e.is_retryable(),\n            ProcessingError::Stage(e) =\u003e e.retryable,\n            ProcessingError::BatchPartialFailure(_) =\u003e false, // Partial failures are not retryable as a whole\n            _ =\u003e false,\n        }\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use std::io;\n\n    #[test]\n    fn test_retryable_errors() {\n        // Transient errors\n        let io_err = SqlxError::Io(io::Error::new(io::ErrorKind::TimedOut, \"timeout\"));\n        let t_err = TransportError::new(\"test\", io_err);\n        let p_err = ProcessingError::Transport(t_err);\n        assert!(p_err.is_retryable());\n\n        let pool_err = SqlxError::PoolTimedOut;\n        let t_err = TransportError::new(\"test\", pool_err);\n        let p_err = ProcessingError::Transport(t_err);\n        assert!(p_err.is_retryable());\n    }\n\n    #[test]\n    fn test_permanent_errors() {\n        // Permanent errors\n        let row_err = SqlxError::RowNotFound;\n        let t_err = TransportError::new(\"test\", row_err);\n        let p_err = ProcessingError::Transport(t_err);\n        assert!(!p_err.is_retryable());\n\n        let json_err = serde_json::from_str::\u003cserde_json::Value\u003e(\"invalid\").unwrap_err();\n        let t_err = TransportError::new(\"test\", json_err);\n        let p_err = ProcessingError::Transport(t_err);\n        assert!(!p_err.is_retryable());\n\n        // Validation error (not transport)\n        let val_err = ValidationError::new(\"bad\");\n        let p_err = ProcessingError::Validation(val_err);\n        assert!(!p_err.is_retryable());\n    }\n\n    #[test]\n    fn test_pool_closed_not_retryable() {\n        let pool_closed_err = SqlxError::PoolClosed;\n        let t_err = TransportError::new(\"test\", pool_closed_err);\n        let p_err = ProcessingError::Transport(t_err);\n        assert!(!p_err.is_retryable(), \"PoolClosed should not be retryable\");\n    }\n\n    #[test]\n    fn test_worker_crashed_not_retryable() {\n        let worker_crashed_err = SqlxError::WorkerCrashed;\n        let t_err = TransportError::new(\"test\", worker_crashed_err);\n        let p_err = ProcessingError::Transport(t_err);\n        assert!(\n            !p_err.is_retryable(),\n            \"WorkerCrashed should not be retryable\"\n        );\n    }\n\n    #[test]\n    fn test_stage_error_not_retryable() {\n        let stage_err = crate::eip::StageError {\n            code: \"stage_error\".to_string(),\n            message: \"pipeline stage error\".to_string(),\n            retryable: false,\n        };\n        let p_err = ProcessingError::Stage(stage_err);\n        assert!(!p_err.is_retryable(), \"Stage error should not be retryable\");\n    }\n\n    #[test]\n    fn test_stage_error_public_reason() {\n        let stage_err ss":[],"length":0,"stats":{"Line":1}}],"covered":36,"coverable":51},{"path":["/","Users","rcs","git","rcl","src","health.rs"],"content":"use chrono::{DateTime, Utc};\nuse serde::Serialize;\nuse std::collections::HashMap;\nuse std::sync::RwLock;\nuse std::time::Duration;\n\n#[derive(Debug, Clone, Serialize, PartialEq)]\n#[serde(rename_all = \"lowercase\")]\npub enum ComponentStatus {\n    Healthy,\n    Degraded,\n    Unhealthy,\n}\n\n#[derive(Debug, Clone, Serialize)]\npub struct PipelineHealth {\n    pub status: ComponentStatus,\n    pub registered_at: DateTime\u003cUtc\u003e,\n    pub last_processed_at: Option\u003cDateTime\u003cUtc\u003e\u003e,\n    pub error_count: u64,\n    pub last_error: Option\u003cString\u003e,\n}\n\nimpl Default for PipelineHealth {\n    fn default() -\u003e Self {\n        Self {\n            status: ComponentStatus::Healthy,\n            registered_at: Utc::now(),\n            last_processed_at: None,\n            error_count: 0,\n            last_error: None,\n        }\n    }\n}\n\n#[derive(Debug, Clone, Serialize)]\npub struct SystemHealth {\n    pub status: ComponentStatus,\n    pub kafka: ComponentStatus,\n    pub postgres: ComponentStatus,\n    pub pipelines: HashMap\u003cString, PipelineHealth\u003e,\n}\n\npub struct HealthRegistry {\n    kafka_status: RwLock\u003cComponentStatus\u003e,\n    postgres_status: RwLock\u003cComponentStatus\u003e,\n    pipelines: RwLock\u003cHashMap\u003cString, PipelineHealth\u003e\u003e,\n    timeout: Duration,\n}\n\nimpl HealthRegistry {\n    pub fn new(timeout: Duration) -\u003e Self {\n        Self {\n            kafka_status: RwLock::new(ComponentStatus::Healthy),\n            postgres_status: RwLock::new(ComponentStatus::Healthy),\n            pipelines: RwLock::new(HashMap::new()),\n            timeout,\n        }\n    }\n\n    pub fn register_pipeline(\u0026self, name: \u0026str) {\n        let mut pipelines = self\n            .pipelines\n            .write()\n            .expect(\"Pipeline registry lock poisoned\");\n        pipelines.insert(name.to_string(), PipelineHealth::default());\n    }\n\n    pub fn update_pipeline_success(\u0026self, name: \u0026str) -\u003e Result\u003c(), String\u003e {\n        let mut pipelines = self\n            .pipelines\n            .write()\n            .map_err(|e| format!(\"Lock poisoned: {}\", e))?;\n        if let Some(p) = pipelines.get_mut(name) {\n            p.status = ComponentStatus::Healthy;\n            p.last_processed_at = Some(Utc::now());\n        } else {\n            return Err(format!(\"Pipeline '{}' not registered\", name));\n        }\n        Ok(())\n    }\n\n    pub fn update_pipeline_error(\u0026self, name: \u0026str, error: String) -\u003e Result\u003c(), String\u003e {\n        let mut pipelines = self\n            .pipelines\n            .write()\n            .map_err(|e| format!(\"Lock poisoned: {}\", e))?;\n        if let Some(p) = pipelines.get_mut(name) {\n            p.status = ComponentStatus::Degraded;\n            p.error_count += 1;\n            p.last_error = Some(error);\n        } else {\n            return Err(format!(\"Pipeline '{}' not registered\", name));\n        }\n        Ok(())\n    }\n\n    pub fn set_kafka_status(\u0026self, status: ComponentStatus) -\u003e Result\u003c(), String\u003e {\n        let mut guard = self\n            .kafka_status\n            .write()\n            .map_err(|e| format!(\"Lock poisoned: {}\", e))?;\n        *guard = status;\n        Ok(())\n    }\n\n    pub fn set_postgres_status(\u0026self, status: ComponentStatus) -\u003e Result\u003c(), String\u003e {\n        let mut guard = self\n            .postgres_status\n            .write()\n            .map_err(|e| format!(\"Lock poisoned: {}\", e))?;\n        *guard = status;\n        Ok(())\n    }\n\n    pub fn get_status(\u0026self) -\u003e SystemHealth {\n        let kafka = self\n            .kafka_status\n            .read()\n            .map(|g| g.clone())\n            .unwrap_or_else(|poisoned| poisoned.into_inner().clone());\n        let postgres = self\n            .postgres_status\n            .read()\n            .map(|g| g.clone())\n            .unwrap_or_else(|poisoned| poisoned.into_inner().clone());\n\n        let pipelines_guard = self\n            .pipelines\n            .read()\n            .unwrap_or_else(|poisoned| poisoned.into_inner());\n\n        // Initialize status with Healthy, then update based on kafka and postgres immediately\n        let mut status = ComponentStatus::Healthy;\n        if kafka == ComponentStatus::Unhealthy || postgres == ComponentStatus::Unhealthy {\n            status = ComponentStatus::Unhealthy;\n        } else if kafka == ComponentStatus::Degraded || postgres == ComponentStatus::Degraded {\n            status = ComponentStatus::Degraded;\n        }\n\n        let mut pipelines = HashMap::with_capacity(pipelines_guard.len());\n        let timeout = chrono::Duration::from_std(self.timeout).unwrap_or(chrono::Duration::MAX);\n        let now = Utc::now();\n\n        // Single pass: compute pipeline health, insert into map, and update overall status inline\n        for (name, p) in pipelines_guard.iter() {\n            let mut p_health = p.clone();\n            let last_activity = p_health.last_processed_at.unwrap_or(p_health.registered_at);\n\n            if now.signed_duration_since(last_activity) \u003e timeout\n                \u0026\u0026 p_health.status == ComponentStatus::Healthy\n            {\n                p_health.status = ComponentStatus::Degraded;\n                p_health.last_error = Some(\"Pipeline stalled\".to_string());\n            }\n\n            // Update overall status inline: Unhealthy immediately, Degraded only if not already Unhealthy\n            if p_health.status == ComponentStatus::Unhealthy {\n                status = ComponentStatus::Unhealthy;\n            } else if p_health.status == ComponentStatus::Degraded\n                \u0026\u0026 status != ComponentStatus::Unhealthy\n            {\n                status = ComponentStatus::Degraded;\n            }\n\n            pipelines.insert(name.clone(), p_health);\n        }\n\n        SystemHealth {\n            status,\n            kafka,\n            postgres,\n            pipelines,\n        }\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n\n    #[test]\n    fn test_register_and_update_pipeline() {\n        let reg = HealthRegistry::new(std::time::Duration::from_secs(60));\n        reg.register_pipeline(\"p1\");\n\n        // update success should work\n        assert!(reg.update_pipeline_success(\"p1\").is_ok());\n\n        // update error increments count\n        assert!(reg.update_pipeline_error(\"p1\", \"err\".to_string()).is_ok());\n\n        let status = reg.get_status();\n        assert!(status.pipelines.contains_key(\"p1\"));\n        let p = status.pipelines.get(\"p1\").unwrap();\n        assert_eq!(p.error_count, 1);\n        assert_eq!(p.status, ComponentStatus::Degraded);\n    }\n\n    #[test]\n    fn test_set_component_status_changes_overall() {\n        let reg = HealthRegistry::new(std::time::Duration::from_secs(60));\n        reg.register_pipeline(\"p2\");\n        assert!(reg.set_kafka_status(ComponentStatus::Unhealthy).is_ok());\n        let s = reg.get_status();\n        assert_eq!(s.kafka, ComponentStatus::Unhealthy);\n        assert_eq!(s.status, ComponentStatus::Unhealthy);\n    }\n\n    #[test]\n    fn test_pipeline_stall_becomes_degraded() {\n        // zero timeout causes immediate stall detection\n        let reg = HealthRegistry::new(std::time::Duration::from_secs(0));\n        reg.register_pipeline(\"p3\");\n        let s = reg.get_status();\n        // pipeline should be degraded due to zero timeout\n        let p = s.pipelines.get(\"p3\").unwrap();\n        assert_eq!(p.status, ComponentStatus::Degraded);\n        assert_eq!(s.status, ComponentStatus::Degraded);\n    }\n\n    #[test]\n    fn test_update_unregistered_pipeline_returns_error() rr(anyhow::anyhow!(\"rate must be \u003e 0\"));\n    }\n\n    let producer: FutureProducer = rdkafka::config::ClientConfig::new()\n        .set(\"bootstrap.servers\", \u0026cfg.kafka.brokers)\n        .set(\"message.timeout.ms\", \"5000\")\n        .create()?;\n\n    let topic = cfg\n        .pipelines\n        .first()\n        .ok_or_else(|| anyhow::anyhow!(\"No pipelines configured\"))?\n        .topic\n        .as_str();\n    println!(\n        \"Starting load test on topic {} at {} msg/s for {}s\",\n        topic, rate, duration_sec\n    );\n\n    let start = Instant::now();\n    let interval = Duration::from_micros(1_000_000 / rate as u64);\n    let mut interval_timer = time::interval(interval);\n    interval_timer.set_missed_tick_behavior(MissedTickBehavior::Delay);\n    let mut count = 0;\n\n    while start.elapsed().as_secs() \u003c duration_sec {\n        interval_timer.tick().await;\n\n        let payload = serde_json::json!({\n            \"op\": \"c\",\n            \"after\": {\n                \"id\": count,\n                \"data\": \"synthetic-data\",\n                \"ts\": chrono::Utc::now().to_rfc3339()\n            }\n        })\n        .to_string();\n\n        let key = count.to_string();\n        let record = FutureRecord::to(topic).payload(\u0026payload).key(\u0026key);\n\n        if let Err((e, _)) = producer.send(record, Duration::from_secs(5)).await {\n            eprintln!(\"Failed to send: {}\", e);\n        }\n\n        count += 1;\n        if count % rate == 0 {\n            println!(\"Sent {} messages\", count);\n        }\n    }\n\n    println!(\"Load test complete. Sent {} messages.\", count);\n    Ok(())\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use crate::config::Config;\n\n    #[tokio::test]\n    async fn test_run_rate_zero_errors() {\n        // Minimal config with placeholders - we won't reach producer creation because rate==0 check comes first\n        let cfg = Config {\n            service: crate::config::Ser g = ServiceConfig {\n            log_level: LogLevel::Info,\n            metrics_port: 9000,\n            otlp_endpoint: None,\n            health_check_timeout_ms: 5000,\n            shutdown_timeout: \"30s\".to_string(),\n        };\n\n        let guard = init(\u0026cfg).expect(\"init should succeed\");\n        // No OTLP endpoint configured\n        assert!(!guard._has_otlp);\n    }\n}\n","traces":[{"line":12,"address":[],"length":0,"stats":{"Line":1}},{"line":13,"address":[],"length":0,"stats":{"Line":1}},{"line":14,"address":[],"length":0,"stats":{"Line":0}},{"line":19,"address":[],"length":0,"stats":{"Line":1}},{"line":22,"address":[],"length":0,"stats":{"Line":2}},{"line":24,"address":[],"length":0,"stats":{"Line":3}},{"line":25,"address":[],"length":0,"stats":{"Line":1}},{"line":26,"address":[],"length":0,"stats":{"Line":4}},{"line":28,"address":[],"length":0,"stats":{"Line":4}},{"line":30,"address":[],"length":0,"stats":{"Line":6}},{"line":32,"address":[],"length":0,"stats":{"Line":2}},{"line":33,"address":[],"length":0,"stats":{"Line":0}},{"line":40,"address":[],"length":0,"stats":{"Line":0}},{"line":43,"address":[],"length":0,"stats":{"Line":0}},{"line":44,"address":[],"length":0,"stats":{"Line":0}},{"line":46,"address":[],"length":0,"stats":{"Line":2}},{"line":47,"address":[],"length":0,"stats":{"Line":1}}],"covered":12,"coverable":17},{"path":["/","Users","rcs","git","rcl","src","main.rs"],"content":"mod batcher;\nmod config;\nmod consumer;\nmod decoder;\nmod dlq;\nmod eip;\nmod errors;\nmod health;\nmod load_test;\nmod logging;\nmod metrics;\nmod shutdown;\nmod stages;\nmod types;\nmod writer;\n\nuse crate::config::Config;\nuse crate::health::HealthRegistry;\nuse crate::metrics::Metrics;\nuse crate::writer::{Writer, WriterTrait};\nuse anyhow::Result;\nuse clap::{Parser, Subcommand};\nuse prometheus::Registry;\nuse std::sync::Arc;\nuse tracing::{error, info};\n\n#[derive(Parser)]\n#[command(author, version, about, long_about = None)]\nstruct Cli {\n    #[command(subcommand)]\n    command: Option\u003cCommands\u003e,\n\n    /// Validate configuration and exit\n    #[arg(long)]\n    validate_config: bool,\n}\n\n#[derive(Subcommand)]\nenum Commands {\n    /// Run the ingestion service (default)\n    Run,\n    /// Replay messages from a specific offset range\n    Replay {\n        #[arg(short, long)]\n        topic: String,\n        #[arg(short, long)]\n        partition: i32,\n        #[arg(long)]\n        start_offset: i64,\n        #[arg(long)]\n        end_offset: i64,\n    },\n    /// Inspect or drain DLQ\n    Dlq {\n        #[arg(short, long)]\n        topic: String,\n        #[command(subcommand)]\n        action: DlqAction,\n    },\n    /// Run load test\n    LoadTest {\n        #[arg(short, long, default_value_t = 1000)]\n        rate: u32,\n        #[arg(short, long, default_value_t = 60)]\n        duration_sec: u64,\n    },\n}\n\n#[derive(Subcommand)]\nenum DlqAction {\n    Inspect {\n        #[arg(short, long, default_value_t = 10)]\n        limit: usize,\n    },\n    Drain {\n        #[arg(short, long)]\n        output: Option\u003cString\u003e,\n        #[arg(long)]\n        requeue: bool,\n    },\n}\n\n#[tokio::main]\nasync fn main() -\u003e Result\u003c()\u003e {\n    dotenvy::dotenv().ok();\n    let cli = Cli::parse();\n    let cfg = Config::from_env()?;\n\n    if cli.validate_config {\n        println!(\"Configuration is valid\");\n        return Ok(());\n    }\n\n    let _guard = logging::init(\u0026cfg.service).map_err(|e| anyhow::anyhow!(e.to_string()))?;\n\n    match cli.command.unwrap_or(Commands::Run) {\n        Commands::Run =\u003e run_service(cfg).await,\n        Commands::Replay {\n            topic,\n            partition,\n            start_offset,\n            end_offset,\n        } =\u003e {\n            let cfg = Arc::new(cfg);\n            let registry = Registry::new();\n            let metrics = Metrics::register(\u0026registry)?;\n            let writer_cfg = Arc::new(cfg.postgres.clone());\n            let health = Arc::new(HealthRegistry::new(std::time::Duration::from_millis(\n                cfg.service.health_check_timeout_ms,\n            )));\n            let writer: Arc\u003cdyn WriterTrait\u003e =\n                Arc::new(Writer::new(writer_cfg, metrics.clone(), health).await?);\n\n            consumer::replay(\n                cfg,\n                writer,\n                metrics,\n                topic,\n                partition,\n                start_offset,\n                end_offset,\n            )\n            .await\n        }\n        Commands::Dlq { topic, action } =\u003e match action {\n            DlqAction::Inspect { limit } =\u003e dlq::inspect(\u0026cfg.kafka, \u0026topic, limit).await,\n            DlqAction::Drain { output, requeue } =\u003e {\n                dlq::drain(\u0026cfg.kafka, \u0026topic, output, requeue).await\n            }\n        },\n        Commands::LoadTest { rate, duration_sec } =\u003e load_test::run(cfg, rate, duration_sec).await,\n    }\n}\n\nasync fn run_service(cfg: Config) -\u003e Result\u003c()\u003e {\n    let health = Arc::new(HealthRegistry::new(std::time::Duration::from_millis(\n        cfg.service.health_check_timeout_ms,\n    )));\n    let registry = Registry::new();\n    let metrics = Metrics::register(\u0026registry)?;\n    metrics::spawn_exporter(registry.clone(), health.clone(), cfg.service.metrics_port);\n\n    let cfg = Arc::new(cfg);\n    let shutdown_timeout = cfg.service.shutdown_timeout_duration();\n    let writer_cfg = Arc::new(cfg.postgres.clone());\n    let writer: Arc\u003cdyn WriterTrait\u003e =\n        Arc::new(Writer::new(writer_cfg, metrics.clone(), health.clone()).await?);\n\n    let (coordinator, shutdown_rx) = shutdown::ShutdownCoordinator::new();\n\n    let consumer_handle = tokio::spawn(consumer::run(\n        cfg.clone(),\n        writer,\n        metrics,\n        shutdown_rx,\n        health.clone(),\n    ));\n\n    coordinator.wait_for_signal().await;         let write_latency_seconds = Histogram::with_opts(HistogramOpts::new(\n            \"write_latency_seconds\",\n            \"Latency of storage writes\",\n        ))?;\n        let batch_size = Histogram::with_opts(\n            HistogramOpts::new(\"batch_size\", \"Number of records per batch\").buckets(vec![\n                1.0, 5.0, 10.0, 25.0, 50.0, 100.0, 250.0, 500.0, 1000.0, 2500.0, 5000.0,\n            ]),\n        )?;\n        let last_poll_timestamp = IntGauge::with_opts(Opts::new(\n            \"last_poll_timestamp\",\n            \"Timestamp of last successful poll in milliseconds since epoch\",\n        ))?;\n\n        // Batch-specific metrics\n        let batch_messages_total = IntCounter::with_opts(Opts::new(\n            \"batch_messages_total\",\n            \"Total messages processed through batcher\",\n        ))?;\n        let batch_flush_total = IntCounterVec::new(\n            Opts::new(\"batch_flush_total\", \"Total batch flushes by reason\"),\n            \u0026[\"reason\"],\n        )?;\n        let batch_bytes_total = IntCounter::with_opts(Opts::new(\n            \"batch_bytes_total\",\n            \"Total bytes processed through batcher\",\n        ))?;\n        // Tuned buckets for batch latency (seconds): fine-grained ms up to several seconds\n        let batch_latency_opts = HistogramOpts::new(\n            \"batch_latency_seconds\",\n            \"Time from first message to batch flush\",\n        )\n        .buckets(vec![\n            0.001, // 1ms\n            0.002, // 2ms\n            0.005, // 5ms\n            0.01,  // 10ms\n            0.02,  // 20ms\n            0.05,  // 50ms\n            0.1,   // 100ms\n            0.2,   // 200ms\n            0.5,   // 500ms\n            1.0,   // 1s\n            2.0,   // 2s\n            5.0,   // 5s\n            10.0,  // 10s\n        ]);\n\n        let batch_latency_seconds = Histogram::with_opts(batch_latency_opts)?;\n\n        // Register all metrics directly - they're already created above\n        registry.register(Box::new(messages_total.clone()))?;\n        registry.register(Box::new(decode_failures.clone()))?;\n        registry.register(Box::new(processing_failures.clone()))?;\n        registry.register(Box::new(dlq_total.clone()))?;\n        registry.register(Box::new(lag_ms.clone()))?;\n        registry.register(Box::new(write_latency_seconds.clone()))?;\n        registry.register(Box::new(batch_size.clone()))?;\n        registry.register(Box::new(last_poll_timestamp.clone()))?;\n        registry.register(Box::new(batch_messages_total.clone()))?;\n        registry.register(Box::new(batch_flush_total.clone()))?;\n        registry.register(Box::new(batch_bytes_total.clone()))?;\n        registry.register(Box::new(batch_latency_seconds.clone()))?;\n\n        Ok(Self {\n            messages_total,\n            decode_failures,\n            processing_failures,\n            dlq_total,\n            lag_ms,\n            write_latency_seconds,\n            batch_size,\n            last_poll_timestamp,\n            batch_messages_total,\n            batch_flush_total,\n            batch_bytes_total,\n            batch_latency_seconds,\n        })\n    }\n}\n\nfn metrics_handler(registry: Registry) -\u003e Result\u003cString, String\u003e {\n    let encoder = TextEncoder::new();\n    let metric_families = registry.gather();\n    let mut buffer = Vec::new();\n    encoder\n        .encode(\u0026metric_families, \u0026mut buffer)\n        .map_err(|e| e.to_string())?;\n    String::from_utf8(buffer).map_err(|e| e.to_string())\n}\n\npub fn spawn_exporter(\n    registry: Registry,\n    health: Arc\u003cHealthRegistry\u003e,\n    port: u16,\n) -\u003e JoinHandle\u003c()\u003e {\n    let registry_clone = registry.clone();\n    let health_clone = health.clone();\n    let app = Router::new()\n        .route(\n            \"/metrics\",\n            get(move || {\n                let registry = registry_clone.clone();\n                async move {\n                    match metrics_handler(registry) {\n                        Ok(body) =\u003e axum::response::Response::builder()\n                            .status(200)\n                            .header(\"Content-Type\", \"text/plain; version=0.0.4\")\n                            .body(body)\n                            .unwrap(),\n                        Err(err) =\u003e axum::response::Response::builder()\n                            .status(500)\n                            .body(err)\n                            .unwrap(),\n                    }\n                }\n            }),\n        )\n        .route(\"/health\", get(|| async { \"ok\" }))\n        .route(\n            \"/ready\",\n            get(move || {\n                let health = health_clone.clone();\n                async move {\n                    let status = health.get_status();\n                    let code = match status.status {\n                        ComponentStatus::Healthy =\u003e 200,\n                        ComponentStatus::Degraded =\u003e 200,\n                        ComponentStatus::Unhealthy =\u003e 503,\n                    };\n                    match serde_json::to_string(\u0026status) {\n                        Ok(body) =\u003e axum::response::Response::builder()\n                            .status(code)\n                            .header(\"Content-Type\", \"application/json\")\n                            .body(body)\n                            .unwrap(),\n                        Err(err) =\u003e axum::response::Response::builder()\n                            .status(500)\n                            .body(format!(\"Failed to serialize status: {}\", err))\n                            .unwrap(),\n                    }\n                }\n            }),\n        );\n\n    let addr = SocketAddr::from(([0, 0, 0, 0], port));\n    tokio::spawn(async move {\n        match TcpListener::bind(addr).await {\n            Ok(listener) =\u003e {\n                if let Err(err) = axum::serve(listener, app.into_make_service()).await {\n                    error!(\"metrics server error: {}\", err);\n                }\n            }\n            Err(err) =\u003e error!(\"metrics listener bind error: {}\", err),\n        }\n    })\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n\n    #[test]\n    fn test_metrics_register_creates_all_metrics() {\n        let registry = Registry::new();\n        let metrics = Metrics::register(\u0026registry).expect(\"should register metrics\");\n\n        // Check that all metrics were created\n        assert_eq!(metrics.messages_total.get(), 0);\n        assert_eq!(metrics.decode_failures.get(), 0);\n        assert_eq!(metrics.processing_failures.get(), 0);\n        assert_eq!(metrics.dlq_total.get(), 0);\n        assert_eq!(metrics.batch_messages_total.get(), 0);\n        assert_eq!(metrics.batch_bytes_total.get(), 0);\n    }\n\n    #[test]\n    fn test_metrics_increment_counters() {\n        let registry = Registry::new();\n        let metrics = Metrics::register(\u0026registry).expect(\"should register metrics\");\n\n        // Test message counter\n        assert_eq!(metrics.messages_total.get(), 0);\n        metrics.messages_total.inc();\n        assert_eq!(metrics.messages_total.get(), 1);\n        metrics.messages_total.inc();\n        assert_eq!(metrics.messages_total.get(), 2);\n    }\n\n    #[test]\n    fn test_metrics_increment_decode_failures() {\n        let registry = Registry::new();\n        let metrics = Metrics::register(\u0026registry).expect(\"should register metrics\");\n\n        assert_eq!(metrics.decode_failures.get(), 0);\n        metrics.decode_failures.inc();\n        assert_eq!(metrics.decode_failures.get(), 1);\n    }\n\n    #[test]\n    fn test_metrics_increment_processing_failures() {\n        let registry = Registry::new();\n        let metrics = Metrics::register(\u0026registry).expect(\"should register metrics\");\n\n        assert_eq!(metrics.processing_failures.get(),
