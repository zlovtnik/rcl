d, then send a notification to all subscribers.\n    pub async fn wait_for_signal(\u0026self) {\n        let ctrl_c = async {\n            signal::ctrl_c()\n                .await\n                .expect(\"failed to install Ctrl+C handler\");\n        };\n\n        #[cfg(unix)]\n        let terminate = async {\n            signal::unix::signal(signal::unix::SignalKind::terminate())\n                .expect(\"failed to install signal handler\")\n                .recv()\n                .await;\n        };\n\n        #[cfg(not(unix))]\n        let terminate = std::future::pending::\u003c()\u003e();\n\n        tokio::select! {\n            _ = ctrl_c =\u003e info!(\"received ctrl-c signal\"),\n            _ = terminate =\u003e info!(\"received terminate signal\"),\n        }\n\n        info!(\"signal received, starting graceful shutdown\");\n        if let Err(err) = self.notify_shutdown.send(()) {\n            warn!(%err, \"shutdown broadcast had no receivers\");\n        }\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n\n    #[test]\n    fn test_shutdown_coordinator_new() {\n        let (coordinator, _rx) = ShutdownCoordinator::new();\n        let _subscriber = coordinator.subscribe();\n        // Verify creation succeeded without panic\n        assert!(true);\n    }\n\n    #[test]\n    fn test_shutdown_coordinator_default() {\n        let coordinator = ShutdownCoordinator::default();\n        let _subscriber = coordinator.subscribe();\n        // Verify creation succeeded without panic\n        assert!(true);\n    }\n\n    #[test]\n    fn test_shutdown_coordinator_subscribe_multiple() {\n        let coordinator = ShutdownCoordinator::new().0;\n        let _sub1 = coordinator.subscribe();\n        let _sub2 = coordinator.subscribe();\n        let _sub3 = coordinator.subscribe();\n        // All subscribers should be created successfully\n        assert!(true);\n    }\n\n    #[tokio::test]\n    async fn test_shutdown_coordinator_broadcast() {\n        let (coordinator, mut rx) = ShutdownCoordinator::new();\n\n        // Clone for the spawn\n        let coordinator_clone = ShutdownCoordinator {\n            notify_shutdown: coordinator.notify_shutdown.clone(),\n        };\n\n        // Spawn a task that will send the shutdown signal\n        tokio::spawn(async move {\n            tokio::time::sleep(std::time::Duration::from_millis(10)).await;\n            let _ = coordinator_clone.notify_shutdown.send(());\n        });\n\n        // Wait for the signal\n        let result = tokio::time::timeout(std::time::Duration::from_millis(100), rx.recv()).await;\n\n        assert!(result.is_ok(), \"should receive shutdown signal\");\n    }\n\n    #[tokio::test]\n    async fn test_shutdown_coordinator_multiple_receivers() {\n        let (coordinator, mut rx1) = ShutdownCoordinator::new();\n        let mut rx2 = coordinator.subscribe();\n        let mut rx3 = coordinator.subscribe();\n\n        let coordinator_clone = ShutdownCoordinator {\n            notify_shutdown: coordinator.notify_shutdown.clone(),\n        };\n\n        tokio::spawn(async move {\n            tokio::time::sleep(std::time::Duration::from_millis(10)).await;\n            let _ = coordinator_clone.notify_shutdown.send(());\n        });\n\n        // All receivers should get the signal\n        let timeout = std::time::Duration::from_millis(100);\n\n        let r1 = tokio::time::timeout(timeout, rx1.recv()).await;\n        let r2 = tokio::time::timeout(timeout, rx2.recv()).await;\n        let r3 = tokio::time::timeout(timeout, rx3.recv()).await;\n\n        assert!(r1.is_ok());\n        assert!(r2.is_ok());\n        assert!(r3.is_ok());\n    }\n\n    #[test]\n    fn test_shutdown_broadcast_capacity() {\n        // Verify the broadcast capacity constant\n        assert_eq!(SHUTDOWN_BROADCAST_CAPACITY, 16);\n    }\n}\n","traces":[{"line":16,"address":[],"length":0,"stats":{"Line":1}},{"line":17,"address":[],"length":0,"stats":{"Line":2}},{"line":26,"address":[],"length":0,"stats":{"Line":10}},{"line":27,"address":[],"length":0,"stats":{"Line":30}},{"line":28,"address":[],"length":0,"stats":{"Line":10}},{"line":35,"address":[],"length":0,"stats":{"Line":13}},{"line":36,"address":[],"length":0,"stats":{"Line":26}},{"line":43,"address":[],"length":0,"stats":{"Line":0}},{"line":44,"address":[],"length":0,"stats":{"Line":0}},{"line":45,"address":[],"length":0,"stats":{"Line":0}},{"line":46,"address":[],"length":0,"stats":{"Line":0}},{"line":51,"address":[],"length":0,"stats":{"Line":0}},{"line":52,"address":[],"length":0,"stats":{"Line":0}},{"line":55,"address":[],"length":0,"stats":{"Line":0}},{"line":61,"address":[],"length":0,"stats":{"Line":0}},{"line":62,"address":[],"length":0,"stats":{"Line":0}},{"line":63,"address":[],"length":0,"stats":{"Line":0}},{"line":66,"address":[],"length":0,"stats":{"Line":0}},{"line":67,"address":[],"length":0,"stats":{"Line":0}},{"line":68,"address":[],"length":0,"stats":{"Line":0}}],"covered":7,"coverable":20},{"path":["/","Users","rcs","git","rcl","src","stages.rs"],"content":"use crate::eip::{Stage, StageContext, StageError, StageResult};\nuse crate::errors::{ProcessingError, ValidationError};\nuse anyhow::Result;\nuse async_trait::async_trait;\nuse redis::aio::MultiplexedConnection;\nuse regex::Regex;\nuse serde_json::Value;\nuse std::collections::HashMap;\nuse std::time::Duration;\n\n/// Filter Stage - Skip messages that don't match criteria\npub struct FilterStage {\n    #[allow(dead_code)]\n    name: String,\n    mode: FilterMode,\n    conditions: Vec\u003cCondition\u003e,\n    logic: Logic,\n}\n\n#[derive(Clone, Debug)]\nenum FilterMode {\n    Include,\n    Exclude,\n}\n\n#[derive(Clone, Debug)]\nenum Logic {\n    And,\n    Or,\n}\n\n#[derive(Clone, Debug)]\nstruct Condition {\n    field: String,\n    operator: Operator,\n}\n\n#[derive(Clone, Debug)]\nenum Operator {\n    Equals(Value),\n    NotEquals(Value),\n    GreaterThan(f64),\n    LessThan(f64),\n    Contains(String),\n    Regex(Regex),\n    Exists,\n    In(Vec\u003cValue\u003e),\n}\n\nimpl FilterStage {\n    pub fn from_config(name: String, config: Value) -\u003e Result\u003cSelf\u003e {\n        let mode = match config.get(\"mode\").and_then(|v| v.as_str()) {\n            Some(\"include\") | None =\u003e FilterMode::Include,\n            Some(\"exclude\") =\u003e FilterMode::Exclude,\n            Some(other) =\u003e return Err(anyhow::anyhow!(\"invalid filter mode: {}\", other)),\n        };\n\n        let logic = match config.get(\"logic\").and_then(|v| v.as_str()) {\n            Some(\"OR\") =\u003e Logic::Or,\n            Some(\"AND\") | None =\u003e Logic::And,\n            Some(other) =\u003e return Err(anyhow::anyhow!(\"invalid logic: {}\", other)),\n        };\n\n        let conditions_config = config\n            .get(\"conditions\")\n            .and_then(|v| v.as_array())\n            .ok_or_else(|| anyhow::anyhow!(\"missing conditions array\"))?;\n\n        let mut conditions = Vec::new();\n        for cond_config in conditions_config {\n            let field = cond_config\n                .get(\"field\")\n                .and_then(|v| v.as_str())\n                .ok_or_else(|| anyhow::anyhow!(\"missing field in condition\"))?\n                .to_string();\n\n            let operator = Self::parse_operator(cond_config)?;\n            conditions.push(Condition { field, operator });\n        }\n\n        Ok(Self {\n            name,\n            mode,\n            conditions,\n            logic,\n        })\n    }\n\n    fn parse_operator(config: \u0026Value) -\u003e Result\u003cOperator\u003e {\n        if let Some(eq_val) = config.get(\"equals\") {\n            return Ok(Operator::Equals(eq_val.clone()));\n        }\n        if let Some(neq_val) = config.get(\"not_equals\") {\n            return Ok(Operator::NotEquals(neq_val.clone()));\n        }\n        if let Some(gt) = config.get(\"greater_than\").and_then(|v| v.as_f64()) {\n            return Ok(Operator::GreaterThan(gt));\n        }\n        if let Some(lt) = config.get(\"less_than\").and_then(|v| v.as_f64()) {\n            return Ok(Operator::LessThan(lt));\n        }\n        if let Some(contains) = config.get(\"contains\").and_then(|v| v.as_str()) {\n            return Ok(Operator::Contains(contains.to_string()));\n        }\n        if let Some(regex_str) = config.get(\"regex\").and_then(|v| v.as_str()) {\n            let regex = Regex::new(regex_str)?;\n            return Ok(Operator::Regex(regex));\n        }\n        if config.get(\"exists\").is_some() {\n            return Ok(Operator::Exists);\n        }\n        if let Some(in_array) = config.get(\"in\").and_then(|v| v.as_array()) {\n            return Ok(Operator::In(in_array.clone()));\n        }\n\n        Err(anyhow::anyhow!(\"no valid operator found in condition\"))\n    }\n\n    fn evaluate(\u0026self, msg: \u0026Value) -\u003e Result\u003cbool, ProcessingError\u003e {\n        let results: Vec\u003cbool\u003e = self.conditions.iter().map(|c| c.evaluate(msg)).collect();\n\n        match self.logic {\n            Logic::And =\u003e Ok(results.iter().all(|\u0026b| b)),\n            Logic::Or =\u003e Ok(results.iter().any(|\u0026b| b)),\n        }\n    }\n}\n\nimpl Condition {\n    fn evaluate(\u0026self, msg: \u0026Value) -\u003e bool {\n        let field_value = get_field(msg, \u0026self.field);\n\n        match \u0026self.operator {\n            Operator::Equals(expected) =\u003e field_value == Some(expected),\n            Operator::NotEquals(expected) =\u003e field_value != Some(expected),\n            Operator::GreaterThan(thresh) =\u003e {\n                if let Some(Value::Number(n)) = field_value {\n                    if let Some(num_val) = n.as_f64() {\n                        num_val \u003e *thresh\n                    } else {\n                        false\n                    }\n                } else {\n                    false\n                }\n            }\n            Operator::LessThan(thresh) =\u003e {\n                if let Some(Value::Number(n)) = field_value {\n                    if let Some(num_val) = n.as_f64() {\n                        num_val \u003c *thresh\n                    } else {\n                        false\n                    }\n                } else {\n                    false\n                }\n            }\n            Operator::Contains(substring) =\u003e {\n                if let Some(Value::String(s)) = field_value {\n                    s.contains(substring)\n                } else {\n                    false\n                }\n            }\n            Operator::Regex(regex) =\u003e {\n                if let Some(Value::String(s)) = field_value {\n                    regex.is_match(s)\n                } else {\n                    false\n                }\n            }\n            Operator::Exists =\u003e field_value.is_some(),\n            Operator::In(values) =\u003e field_value.is_some_and(|v| values.contains(v)),\n        }\n    }\n}\n\n#[async_trait]\nimpl Stage for FilterStage {\n    async fn process(\n        \u0026self,\n        _ctx: \u0026StageContext,\n        msg: Value,\n    ) -\u003e Result\u003cStageResult, ProcessingError\u003e {\n        let matches = self.evaluate(\u0026msg)?;\n\n        let should_pass = match self.mode {\n            FilterMode::Include =\u003e matches,\n            FilterMode::Exclude =\u003e !matches,\n        };\n\n        if should_pass {\n            Ok(StageResult::Continue(msg))\n        } else {\n            Ok(StageResult::Skip)\n        }\n    }\n\n    fn name(\u0026self) -\u003e \u0026str {\n        \u0026self.name\n    }\n}\n\n/// Transformer Stage - Modify message structure and content\npub struct TransformerStage {\n    #[allow(dead_code)]\n    name: String,\n    transformations: Vec\u003cTransformation\u003e,\n}\n\n#[derive(Clone, Debug)]\nenum Transformation {\n    Rename { from: String, to: String },\n    Convert { field: String, converter: Converter },\n    AddField { name: String, value: ValueGenerator },\n    RemoveField { name: String },\n}\n\n#[allow(clippy::enum_variant_names)]\n#[derive(Clone, Debug)]\nenum Converter {\n    ToDecimal,\n    ToInteger,\n    ToString,\n}\n\n#[derive(Clone, Debug)]\nenum ValueGenerator {\n    Literal(Value),\n    Now,\n}\n\nimpl TransformerStage {\n    pub fn from_config(name: String, config: Value) -\u003e Result\u003cSelf\u003e {\n        let transformations_config = config\n            .get(\"transformations\")\n            .and_then(|v| v.as_array())\n            .ok_or_else(|| anyhow::anyhow!(\"missing transformations array\"))?;\n\n        let mut transformations = Vec::new();\n        for trans_config in transformations_config {\n            let transformation = Self::parse_transformation(trans_config)?;\n            transformations.push(transformation);\n        }\n\n        Ok(Self {\n            name,\n            transformations,\n        })\n    }\n\n    fn parse_transformation(config: \u0026Value) -\u003e Result\u003cTransformation\u003e {\n        let type_str = config\n            .get(\"type\")\n            .and_then(|v| v.as_str())\n            .ok_or_else(|| anyhow::anyhow!(\"missing type in transformation\"))?;\n\n        match type_str {\n            \"rename\" =\u003e {\n                let from = config\n                    .get(\"from\")\n                    .and_then(|v| v.as_str())\n                    .ok_or_else(|| anyhow::anyhow!(\"missing from in rename\"))?\n                    .to_string();\n                let to = config\n                    .get(\"to\")\n                    .and_then(|v| v.as_str())\n                    .ok_or_else(|| anyhow::anyhow!(\"missing to in rename\"))?\n                    .to_string();\n                Ok(Transformation::Rename { from, to })\n            }\n            \"convert\" =\u003e {\n                let field = config\n                    .get(\"field\")\n                    .and_then(|v| v.as_str())\n                    .ok_or_else(|| anyhow::anyhow!(\"missing field in convert\"))?\n                    .to_string();\n                let to = config\n                    .get(\"to\")\n                    .and_then(|v| v.as_str())\n                    .ok_or_else(|| anyhow::anyhow!(\"missing to in convert\"))?;\n                let converter = match to {\n                    \"decimal\" =\u003e Converter::ToDecimal,\n                    \"integer\" =\u003e Converter::ToInteger,\n                    \"string\" =\u003e Converter::ToString,\n                    other =\u003e return Err(anyhow::anyhow!(\"unknown converter: {}\", other)),\n                };\n                Ok(Transformation::Convert { field, converter })\n            }\n            \"add_field\" =\u003e {\n                let name = config\n                    .get(\"name\")\n                    .and_then(|v| v.as_str())\n                    .ok_or_else(|| anyhow::anyhow!(\"missing name in add_field\"))?\n                    .to_string();\n                let value = if config.get(\"value\").and_then(|v| v.as_str()) == Some(\"{{now}}\") {\n                    ValueGenerator::Now\n                } else if let Some(literal) = config.get(\"value\") {\n                    ValueGenerator::Literal(literal.clone())\n                } else {\n                    return Err(anyhow::anyhow!(\"invalid value in add_field\"));\n                };\n                Ok(Transformation::AddField { name, value })\n            }\n            \"remove_field\" =\u003e {\n                let name = config\n                    .get(\"name\")\n                    .and_then(|v| v.as_str())\n                    .ok_or_else(|| anyhow::anyhow!(\"missing name in remove_field\"))?\n                    .to_string();\n                Ok(Transformation::RemoveField { name })\n            }\n            other =\u003e Err(anyhow::anyhow!(\"unknown transformation type: {}\", other)),\n        }\n    }\n}\n\nimpl Transformation {\n    fn apply(\u0026self, msg: \u0026mut Value, ctx: \u0026StageContext) -\u003e Result\u003c(), ProcessingError\u003e {\n        match self {\n            Transformation::Rename { from, to } =\u003e {\n                if let Some(value) = remove_field(msg, from).map_err(|e| {\n                    ProcessingError::Stage(StageError::new(\"field_error\", e.to_string()))\n                })? {\n                    set_field(msg, to, value).map_err(|e| {\n                        ProcessingError::Stage(StageError::new(\"field_error\", e.to_string()))\n                    })?;\n                }\n            }\n            Transformation::Convert { field, converter } =\u003e {\n                if let Some(value) = get_field(msg, field).cloned() {\n                    let converted = converter.convert(value)?;\n                    set_field(msg, field, converted).map_err(|e| {\n                        ProcessingError::Stage(StageError::new(\"field_error\", e.to_string()))\n                    })?;\n                }\n            }\n            Transformation::AddField { name, value } =\u003e {\n                let generated = value.generate(ctx)?;\n                set_field(msg, name, generated).map_err(|e| {\n                    ProcessingError::Stage(StageError::new(\"field_error\", e.to_string()))\n                })?;\n            }\n            Transformation::RemoveField { name } =\u003e {\n                remove_field(msg, name).map_err(|e| {\n                    ProcessingError::Stage(StageError::new(\"field_error\", e.to_string()))\n                })?;\n            }\n        }\n        Ok(())\n    }\n}\n\nimpl Converter {\n    fn convert(\u0026self, value: Value) -\u003e Result\u003cValue, ProcessingError\u003e {\n        match self {\n            Converter::ToDecimal =\u003e {\n                if let Value::String(s) = value {\n                    let f: f64 = s.parse().map_err(|e| {\n                        ProcessingError::Stage(StageError::new(\n                            \"conversion_error\",\n                            format!(\"Parse decimal error: {}\", e),\n                        ))\n                    })?;\n                    let num = serde_json::Number::from_f64(f).ok_or_else(|| {\n                        ProcessingError::Stage(StageError::new(\n                            \"conversion_error\",\n                            \"Invalid decimal: NaN or infinity\",\n                        ))\n                    })?;\n                    Ok(Value::Number(num))\n                } else {\n                    Err(ProcessingError::Stage(StageError::new(\n                        \"conversion_error\",\n                        \"cannot convert to decimal\",\n                    )))\n                }\n            }\n            Converter::ToInteger =\u003e {\n                if let Value::String(s) = value {\n                    let i: i64 = s.parse().map_err(|e| {\n                        ProcessingError::Stage(StageError::new(\n                            \"conversion_error\",\n                            format!(\"Parse integer error: {}\", e),\n                        ))\n                    })?;\n                    Ok(Value::Number(serde_json::Number::from(i)))\n                } else {\n                    Err(ProcessingError::Stage(StageError::new(\n                        \"conversion_error\",\n                        \"cannot convert to integer\",\n                    )))\n                }\n            }\n            Converter::ToString =\u003e Ok(Value::String(value.to_string())),\n        }\n    }\n}\n\nimpl ValueGenerator {\n    fn generate(\u0026self, _ctx: \u0026StageContext) -\u003e Result\u003cValue, ProcessingError\u003e {\n        match self {\n            ValueGenerator::Literal(v) =\u003e Ok(v.clone()),\n            ValueGenerator::Now =\u003e {\n                let now = std::time::SystemTime::now()\n                    .duration_since(std::time::UNIX_EPOCH)\n                    .map_err(|e| {\n                        ProcessingError::Stage(StageError::new(\n                            \"time_error\",\n                            format!(\"Time error: {}\", e),\n                        ))\n                    })?\n                    .as_secs() as i64;\n                Ok(Value::Number(serde_json::Number::from(now)))\n            }\n        }\n    }\n}\n\n#[async_trait]\nimpl Stage for TransformerStage {\n    async fn process(\n        \u0026self,\n        ctx: \u0026StageContext,\n        mut msg: Value,\n    ) -\u003e Result\u003cStageResult, ProcessingError\u003e {\n        for transform in \u0026self.transformations {\n            transform.apply(\u0026mut msg, ctx)?;\n        }\n        Ok(StageResult::Continue(msg))\n    }\n\n    fn name(\u0026self) -\u003e \u0026str {\n        \u0026self.name\n    }\n}\n\n/// Router Stage - Route messages to different destinations\npub struct RouterStage {\n    #[allow(dead_code)]\n    name: String,\n    route_by: String,\n    routes: HashMap\u003cString, String\u003e,\n    default: Option\u003cString\u003e,\n    metadata_field: String,\n}\n\nimpl RouterStage {\n    pub fn from_config(name: String, config: Value) -\u003e Result\u003cSelf\u003e {\n        let route_by = config\n            .get(\"route_by\")\n            .and_then(|v| v.as_str())\n            .ok_or_else(|| anyhow::anyhow!(\"missing route_by\"))?\n            .to_string();\n\n        let routes = config\n            .get(\"routes\")\n            .and_then(|v| v.as_object())\n            .ok_or_else(|| anyhow::anyhow!(\"missing routes object\"))?\n            .iter()\n            .map(|(k, v)| {\n                let dest = v\n                    .as_str()\n                    .ok_or_else(|| anyhow::anyhow!(\"route value must be string\"))?;\n                Ok((k.clone(), dest.to_string()))\n            })\n            .collect::\u003cResult\u003cHashMap\u003c_, _\u003e\u003e\u003e()?;\n\n        let default = config\n            .get(\"default\")\n            .and_then(|v| v.as_str())\n            .map(|s| s.to_string());\n\n        let metadata_field = config\n            .get(\"metadata_field\")\n            .and_then(|v| v.as_str())\n            .unwrap_or(\"_destination_table\")\n            .to_string();\n\n        Ok(Self {\n            name,\n            route_by,\n            routes,\n            default,\n            metadata_field,\n        })\n    }\n}\n\n#[async_trait]\nimpl Stage for RouterStage {\n    async fn process(\n        \u0026self,\n        _ctx: \u0026StageContext,\n        mut msg: Value,\n    ) -\u003e Result\u003cStageResult, ProcessingError\u003e {\n        let route_key = get_field(\u0026msg, \u0026self.route_by)\n            .and_then(|v| v.as_str())\n            .ok_or_else(|| {\n                ProcessingError::Stage(StageError::new(\"routing_error\", \"route key not found\"))\n            })?;\n\n        let destination = self\n            .routes\n            .get(route_key)\n            .or(self.default.as_ref())\n            .ok_or_else(|| {\n                ProcessingError::Stage(StageError::new(\n                    \"routing_error\",\n                    format!(\"no route for key: {}\", route_key),\n                ))\n            })?;\n\n        set_field(\n            \u0026mut msg,\n            \u0026self.metadata_field,\n            Value::String(destination.clone()),\n        )\n        .map_err(|e| ProcessingError::Stage(StageError::new(\"field_error\", e.to_string())))?;\n\n        Ok(StageResult::Continue(msg))\n    }\n\n    fn name(\u0026self) -\u003e \u0026str {\n        \u0026self.name\n    }\n}\n\n/// Splitter Stage - Split one message into many\npub struct SplitterStage {\n    #[allow(dead_code)]\n    name: String,\n    split_field: String,\n    preserve_fields: Vec\u003cString\u003e,\n    flatten: bool,\n}\n\nimpl SplitterStage {\n    pub fn from_config(name: String, config: Value) -\u003e Result\u003cSelf\u003e {\n        let split_field = config\n            .get(\"split_field\")\n            .and_then(|v| v.as_str())\n            .ok_or_else(|| anyhow::anyhow!(\"missing split_field\"))?\n            .to_string();\n\n        let preserve_fields = config\n            .get(\"preserve_fields\")\n            .and_then(|v| v.as_array())\n            .map(|arr| {\n                arr.iter()\n                    .filter_map(|v| v.as_str().map(|s| s.to_string()))\n                    .collect()\n            })\n            .unwrap_or_default();\n\n        let flatten = config\n            .get(\"flatten\")\n            .and_then(|v| v.as_bool())\n            .unwrap_or(true);\n\n        Ok(Self {\n            name,\n            split_field,\n            preserve_fields,\n            flatten,\n        })\n    }\n}\n\n#[async_trait]\nimpl Stage for SplitterStage {\n    async fn process(\n        \u0026self,\n        _ctx: \u0026StageContext,\n        msg: Value,\n    ) -\u003e Result\u003cStageResult, ProcessingError\u003e {\n        let array = get_field(\u0026msg, \u0026self.split_field)\n            .and_then(|v| v.as_array())\n            .ok_or_else(|| {\n                ProcessingError::Stage(StageError::new(\n                    \"split_error\",\n                    \"split field is not an array\",\n                ))\n            })?;\n\n        let preserved: Value = {\n            let mut obj = serde_json::json!({});\n            for field in \u0026self.preserve_fields {\n                if let Some(value) = get_field(\u0026msg, field) {\n                    set_field(\u0026mut obj, field, value.clone()).map_err(|e| {\n                        ProcessingError::Stage(StageError::new(\"field_error\", e.to_string()))\n                    })?;\n                }\n            }\n            obj\n        };\n\n        let mut split_messages = Vec::new();\n        for item in array {\n            let new_msg = if self.flatten {\n                merge_objects(preserved.clone(), item.clone())\n            } else {\n                let mut obj = preserved.clone();\n                set_field(\u0026mut obj, \u0026self.split_field, item.clone()).map_err(|e| {\n                    ProcessingError::Stage(StageError::new(\"field_error\", e.to_string()))\n                })?;\n                obj\n            };\n            split_messages.push(new_msg);\n        }\n\n        Ok(StageResult::Split(split_messages))\n    }\n\n    fn name(\u0026self) -\u003e \u0026str {\n        \u0026self.name\n    }\n}\n\n/// Utility functions for JSON manipulation\nfn get_field\u003c'a\u003e(value: \u0026'a Value, field: \u0026str) -\u003e Option\u003c\u0026'a Value\u003e {\n    let mut current = Some(value);\n    for part in field.split('.') {\n        current = current.and_then(|v| v.get(part));\n    }\n    current\n}\n\n/// Helper function to get the JSON type name for error messages\nfn value_type_name(v: \u0026Value) -\u003e \u0026'static str {\n    match v {\n        Value::Null =\u003e \"null\",\n        Value::Bool(_) =\u003e \"bool\",\n        Value::Number(_) =\u003e \"number\",\n        Value::String(_) =\u003e \"string\",\n        Value::Array(_) =\u003e \"array\",\n        Value::Object(_) =\u003e \"object\",\n    }\n}\n\nfn set_field(value: \u0026mut Value, field: \u0026str, new_value: Value) -\u003e Result\u003c()\u003e {\n    let parts: Vec\u003c\u0026str\u003e = field.split('.').collect();\n    if parts.is_empty() {\n        return Err(anyhow::anyhow!(\"empty field path\"));\n    }\n\n    let mut current = value;\n    let mut new_value_opt = Some(new_value);\n    for (i, part) in parts.iter().enumerate() {\n        if i == parts.len() - 1 {\n            // Last part, set the value\n            if let Value::Object(ref mut map) = current {\n                map.insert((*part).to_string(), new_value_opt.take().unwrap());\n            } else {\n                return Err(anyhow::anyhow!(\"cannot set field on non-object\"));\n            }\n        } else {\n            // Intermediate part, check that current is an object\n            if !current.is_object() {\n                return Err(anyhow::anyhow!(\n                    \"invalid path: cannot traverse through non-object at intermediate segment\"\n                ));\n            }\n            if let Value::Object(ref mut map) = current {\n                // Check if the key exists and is not an object\n                if let Some(existing) = map.get(*part) {\n                    if !existing.is_object() {\n                        return Err(anyhow::anyhow!(\n                            \"invalid path: intermediate key '{}' exists but is not an object (type: {})\",\n                            part,\n                            value_type_name(existing)\n                        ));\n                    }\n                }\n                // Key either doesn't exist or is already an object, safe to proceed\n                map.entry((*part).to_string())\n                    .or_insert_with(|| Value::Object(serde_json::Map::new()));\n                current = map.get_mut(*part).unwrap();\n            }\n        }\n    }\n    Ok(())\n}\n\nfn remove_field(value: \u0026mut Value, field: \u0026str) -\u003e Result\u003cOption\u003cValue\u003e\u003e {\n    let parts: Vec\u003c\u0026str\u003e = field.split('.').collect();\n    if parts.is_empty() {\n        return Ok(None);\n    }\n\n    let mut current = value;\n    for (i, part) in parts.iter().enumerate() {\n        if i == parts.len() - 1 {\n            // Last part, remove the value\n            if let Value::Object(ref mut map) = current {\n                return Ok(map.remove(*part));\n            } else {\n                return Ok(None);\n            }\n        } else {\n            // Intermediate part\n            if let Value::Object(ref mut map) = current {\n                if let Some(next) = map.get_mut(*part) {\n                    current = next;\n                } else {\n                    return Ok(None);\n                }\n            } else {\n                return Ok(None);\n            }\n        }\n    }\n    Ok(None)\n}\n\nfn merge_objects(mut base: Value, other: Value) -\u003e Value {\n    if let (Value::Object(ref mut base_map), Value::Object(other_map)) = (\u0026mut base, other) {\n        for (k, v) in other_map {\n            base_map.insert(k, v);\n        }\n    }\n    base\n}\n\n/// Idempotent Receiver Stage - Detect and skip duplicate messages\n#[derive(Clone, Debug)]\nenum FallbackMode {\n    Pass,\n    Fail,\n}\n\n#[async_trait]\ntrait DeduplicationStorage: Send + Sync {\n    async fn check_and_set(\u0026self, key: \u0026str, ttl: Duration) -\u003e Result\u003cbool\u003e;\n}\n\nstruct RedisStorage {\n    client: redis::Client,\n    connection: tokio::sync::OnceCell\u003cMultiplexedConnection\u003e,\n}\n\n#[async_trait]\nimpl DeduplicationStorage for RedisStorage {\n    async fn check_and_set(\u0026self, key: \u0026str, ttl: Duration) -\u003e Result\u003cbool\u003e {\n        let conn = self\n            .connection\n            .get_or_try_init(|| async { self.client.get_multiplexed_async_connection().await })\n            .await?;\n\n        let mut conn = conn.clone();\n        let result: Option\u003cString\u003e = redis::cmd(\"SET\")\n            .arg(key)\n            .arg(\"1\")\n            .arg(\"NX\")\n            .arg(\"EX\")\n            .arg(ttl.as_secs())\n            .query_async(\u0026mut conn)\n            .await?;\n        Ok(result.is_some())\n    }\n}\n\npub struct IdempotentReceiverStage {\n    #[allow(dead_code)]\n    name: String,\n    key_field: String,\n    storage: Box\u003cdyn DeduplicationStorage\u003e,\n    ttl: Duration,\n    fallback: FallbackMode,\n}\n\nimpl IdempotentReceiverStage {\n    pub fn from_config(name: String, config: Value) -\u003e Result\u003cSelf\u003e {\n        let key_field = config\n            .get(\"key_field\")\n            .and_then(|v| v.as_str())\n            .ok_or_else(|| anyhow::anyhow!(\"key_field is required\"))?\n            .to_string();\n\n        let ttl_seconds = config\n            .get(\"ttl_seconds\")\n            .and_then(|v| v.as_u64())\n            .unwrap_or(86400);\n\n        let ttl = Duration::from_secs(ttl_seconds);\n\n        let storage_type = config\n            .get(\"storage\")\n            .and_then(|v| v.as_str())\n            .unwrap_or(\"redis\");\n\n        let storage: Box\u003cdyn DeduplicationStorage\u003e = match storage_type {\n            \"redis\" =\u003e {\n                let redis_url = config\n                    .get(\"redis_url\")\n                    .and_then(|v| v.as_str())\n                    .unwrap_or(\"redis://localhost:6379\");\n                let client = redis::Client::open(redis_url)?;\n                Box::new(RedisStorage {\n                    client,\n                    connection: tokio::sync::OnceCell::new(),\n                })\n            }\n            _ =\u003e {\n                return Err(anyhow::anyhow!(\n                    \"unsupported storage type: {}\",\n                    storage_type\n                ))\n            }\n        };\n\n        let fallback = match config\n            .get(\"fallback_on_error\")\n            .and_then(|v| v.as_str())\n            .unwrap_or(\"pass\")\n        {\n            \"pass\" =\u003e FallbackMode::Pass,\n            \"fail\" =\u003e FallbackMode::Fail,\n            _ =\u003e FallbackMode::Pass,\n        };\n\n        Ok(Self {\n            name,\n            key_field,\n            storage,\n            ttl,\n            fallback,\n        })\n    }\n}\n\n#[async_trait]\nimpl Stage for IdempotentReceiverStage {\n    async fn process(\n        \u0026self,\n        _ctx: \u0026StageContext,\n        msg: Value,\n    ) -\u003e Result\u003cStageResult, ProcessingError\u003e {\n        let key = match get_field(\u0026msg, \u0026self.key_field) {\n            Some(Value::String(field_value)) =\u003e field_value.clone(),\n            _ =\u003e {\n                return Err(ProcessingError::Validation(ValidationError::new(format!(\n                    \"key field '{}' not found or not a string\",\n                    self.key_field\n                ))));\n            }\n        };\n\n        match self.storage.check_and_set(\u0026key, self.ttl).await {\n            Ok(is_new) =\u003e {\n                if is_new {\n                    Ok(StageResult::Continue(msg))\n                } else {\n                    Ok(StageResult::Skip)\n                }\n            }\n            Err(e) =\u003e match self.fallback {\n                FallbackMode::Pass =\u003e {\n                    tracing::warn!(\"deduplication check failed, passing message: {}\", e);\n                    Ok(StageResult::Continue(msg))\n                }\n                FallbackMode::Fail =\u003e Err(ProcessingError::Stage(StageError::new(\n                    \"deduplication check failed\",\n                    e.to_string(),\n                ))),\n            },\n        }\n    }\n\n    fn name(\u0026self) -\u003e \u0026str {\n        \u0026self.name\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use serde_json::json;\n\n    #[tokio::test]\n    async fn test_filter_stage_include() {\n        let stage = FilterStage {\n            name: \"test\".to_string(),\n            mode: FilterMode::Include,\n            conditions: vec![Condition {\n                field: \"status\".to_string(),\n                operator: Operator::Equals(json!(\"active\")),\n            }],\n            logic: Logic::And,\n        };\n\n        let ctx = StageContext {\n            correlation_id: \"test\".to_string(),\n            pipeline_name: \"test\".to_string(),\n            message_metadata: crate::eip::MessageMetadata::from_kafka(\n                \"test\".to_string(),\n                0,\n                0,\n                None,\n            ),\n        };\n        let msg = json!({\"status\": \"active\", \"id\": 123});\n\n        let result = stage.process(\u0026ctx, msg).await.unwrap();\n        assert!(matches!(result, StageResult::Continue(_)));\n    }\n\n    #[tokio::test]\n    async fn test_filter_stage_include_skip() {\n        let stage = FilterStage {\n            name: \"test\".to_string(),\n            mode: FilterMode::Include,\n            conditions: vec![Condition {\n                field: \"status\".to_string(),\n                operator: Operator::Equals(json!(\"inactive\")),\n            }],\n            logic: Logic::And,\n        };\n\n        let ctx = StageContext {\n            correlation_id: \"test\".to_string(),\n            pipeline_name: \"test\".to_string(),\n            message_metadata: crate::eip::MessageMetadata::from_kafka(\n                \"test\".to_string(),\n                0,\n                0,\n                None,\n            ),\n        };\n        let msg = json!({\"status\": \"active\", \"id\": 123});\n\n        let result = stage.process(\u0026ctx, msg).await.unwrap();\n        assert!(matches!(result, StageResult::Skip));\n    }\n\n    #[tokio::test]\n    async fn test_transformer_stage_rename() {\n        let stage = TransformerStage {\n            name: \"test\".to_string(),\n            transformations: vec![Transformation::Rename {\n                from: \"old_field\".to_string(),\n                to: \"new_field\".to_string(),\n            }],\n        };\n\n        let ctx = StageContext {\n            correlation_id: \"test\".to_string(),\n            pipeline_name: \"test\".to_string(),\n            message_metadata: crate::eip::MessageMetadata::from_kafka(\n                \"test\".to_string(),\n                0,\n                0,\n                None,\n            ),\n        };\n        let msg = json!({\"old_field\": \"value\", \"id\": 123});\n\n        let result = stage.process(\u0026ctx, msg).await.unwrap();\n        match result {\n            StageResult::Continue(new_msg) =\u003e {\n                assert_eq!(new_msg.get(\"new_field\"), Some(\u0026json!(\"value\")));\n                assert!(new_msg.get(\"old_field\").is_none());\n            }\n            _ =\u003e panic!(\"Expected Continue result\"),\n        }\n    }\n\n    #[tokio::test]\n    async fn test_router_stage() {\n        let stage = RouterStage {\n            name: \"test\".to_string(),\n            route_by: \"category\".to_string(),\n            routes: [(\"electronics\".to_string(), \"inventory\".to_string())].into(),\n            default: Some(\"general\".to_string()),\n            metadata_field: \"destination\".to_string(),\n        };\n\n        let ctx = StageContext {\n            correlation_id: \"test\".to_string(),\n            pipeline_name: \"test\".to_string(),\n            message_metadata: crate::eip::MessageMetadata::from_kafka(\n                \"test\".to_string(),\n                0,\n                0,\n                None,\n            ),\n        };\n        let msg = json!({\"category\": \"electronics\", \"id\": 123});\n\n        let result = stage.process(\u0026ctx, msg).await.unwrap();\n        match result {\n            StageResult::Continue(new_msg) =\u003e {\n                assert_eq!(new_msg.get(\"destination\"), Some(\u0026json!(\"inventory\")));\n            }\n            _ =\u003e panic!(\"Expected Continue result\"),\n        }\n    }\n\n    #[tokio::test]\n    async fn test_splitter_stage() {\n        let stage = SplitterStage {\n            name: \"test\".to_string(),\n            split_field: \"items\".to_string(),\n            preserve_fields: vec![\"order_id\".to_string()],\n            flatten: false,\n        };\n\n        let ctx = StageContext {\n            correlation_id: \"test\".to_string(),\n            pipeline_name: \"test\".to_string(),\n            message_metadata: crate::eip::MessageMetadata::from_kafka(\n                \"test\".to_string(),\n                0,\n                0,\n                None,\n            ),\n        };\n        let msg = json!({\n            \"order_id\": 123,\n            \"items\": [{\"name\": \"item1\"}, {\"name\": \"item2\"}]\n        });\n\n        let result = stage.process(\u0026ctx, msg).await.unwrap();\n        match result {\n            StageResult::Split(messages) =\u003e {\n                assert_eq!(messages.len(), 2);\n                for msg in \u0026messages {\n                    assert_eq!(msg.get(\"order_id\"), Some(\u0026json!(123)));\n                    assert!(msg.get(\"items\").is_some());\n                }\n            }\n            _ =\u003e panic!(\"Expected Split result\"),\n        }\n    }\n\n    #[tokio::test]\n    async fn test_transformer_conversions_and_add_remove() {\n        let stage = TransformerStage {\n            name: \"test\".to_string(),\n            transformations: vec![\n                Transformation::Convert {\n                    field: \"n1\".to_string(),\n                    converter: Converter::ToDecimal,\n                },\n                Transformation::Convert {\n                    field: \"n2\".to_string(),\n                    converter: Converter::ToInteger,\n                },\n                Transformation::Convert {\n                    field: \"x\".to_string(),\n                    converter: Converter::ToString,\n                },\n                Transformation::AddField {\n                    name: \"now_ts\".to_string(),\n                    value: ValueGenerator::Now,\n                },\n                Transformation::RemoveField {\n                    name: \"remove_me\".to_string(),\n                },\n            ],\n        };\n\n        let ctx = StageContext {\n            correlation_id: \"test\".to_string(),\n            pipeline_name: \"test\".to_string(),\n            message_metadata: crate::eip::MessageMetadata::from_kafka(\n                \"test\".to_string(),\n                0,\n                0,\n                None,\n            ),\n        };\n\n        let msg = json!({\"n1\": \"3.14\", \"n2\": \"42\", \"x\": 10, \"remove_me\": \"bye\"});\n        let result = stage.process(\u0026ctx, msg).await.unwrap();\n        match result {\n            StageResult::Continue(new_msg) =\u003e {\n                // n1 should be number\n                assert!(new_msg.get(\"n1\").and_then(|v| v.as_f64()).is_some());\n                // n2 should be integer number\n                assert!(new_msg.get(\"n2\").and_then(|v| v.as_i64()).is_some());\n                // x should be string\n                assert!(new_msg.get(\"x\").and_then(|v| v.as_str()).is_some());\n                // now_ts exists\n                assert!(new_msg.get(\"now_ts\").is_some());\n                // remove_me removed\n                assert!(new_msg.get(\"remove_me\").is_none());\n            }\n            _ =\u003e panic!(\"Expected Continue result\"),\n        }\n    }\n\n    #[tokio::test]\n    async fn test_condition_operators() {\n        // contains\n        let cond = Condition {\n            field: \"a\".to_string(),\n            operator: Operator::Contains(\"ell\".to_string()),\n        };\n        assert!(cond.evaluate(\u0026json!({\"a\": \"hello\"})));\n\n        // regex\n        let cond = Condition {\n            field: \"a\".to_string(),\n            operator: Operator::Regex(regex::Regex::new(\"^h.*o$\").unwrap()),\n        };\n        assert!(cond.evaluate(\u0026json!({\"a\": \"hello\"})));\n\n        // in\n        let cond = Condition {\n            field: \"a\".to_string(),\n            operator: Operator::In(vec![json!(1), json!(2), json!(3)]),\n        };\n        assert!(cond.evaluate(\u0026json!({\"a\": 2})));\n\n        // greater/less than\n        let cond = Condition {\n            field: \"n\".to_string(),\n            operator: Operator::GreaterThan(5.0),\n        };\n        assert!(cond.evaluate(\u0026json!({\"n\": 6})));\n        let cond = Condition {\n            field: \"n\".to_string(),\n            operator: Operator::LessThan(5.0),\n        };\n        assert!(cond.evaluate(\u0026json!({\"n\": 4})));\n\n        // exis   }\n}\n\n#[derive(Clone, Debug, Serialize, Deserialize)]\npub struct MessageContext {\n    pub topic: String,\n    pub partition: i32,\n    pub offset: i64,\n    pub timestamp: i64,\n}\n\nimpl MessageContext {\n    #[allow(dead_code)]\n    pub fn new(topic: String, partition: i32, offset: i64, timestamp: i64) -\u003e Self {\n        Self {\n            topic,\n            partition,\n            offset,\n            timestamp,\n        }\n    }\n\n    pub fn correlation_id(\u0026self) -\u003e String {\n        format!(\"{}:{}:{}\", self.topic, self.partition, self.offset)\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n\n    #[test]\n    fn test_operation_try_from_and_display() {\n        assert_eq!(Operation::try_from(\"c\").unwrap(), Operation::Create);\n        assert_eq!(Operation::try_from(\"r\").unwrap(), Operation::Read);\n        assert_eq!(Operation::try_from(\"u\").unwrap(), Operation::Update);\n        assert_eq!(Operation::try_from(\"d\").unwrap(), Operation::Delete);\n\n        let op = Operation::Create;\n        assert_eq!(op.to_string(), \"c\");\n    }\n\n    #[test]\n    fn test_operation_try_from_invalid() {\n        let err = Operation::try_from(\"x\").unwrap_err();\n        assert_eq!(err.input, \"x\");\n    }\n\n    #[test]\n    fn test_message_context_correlation_id() {\n        let ctx = MessageContext::new(\"topic\".to_string(), 1, 42, 0);\n        assert_eq!(ctx.correlation_id(), \"topic:1:42\");\n    }\n}\n","traces":[{"line":19,"address":[],"length":0,"stats":{"Line":0}},{"line":20,"address":[],"length":0,"stats":{"Line":0}},{"line":27,"address":[],"length":0,"stats":{"Line":2}},{"line":28,"address":[],"length":0,"stats":{"Line":4}},{"line":29,"address":[],"length":0,"stats":{"Line":2}},{"line":30,"address":[],"length":0,"stats":{"Line":0}},{"line":31,"address":[],"length":0,"stats":{"Line":0}},{"line":32,"address":[],"length":0,"stats":{"Line":0}},{"line":34,"address":[],"length":0,"stats":{"Line":6}},{"line":41,"address":[],"length":0,"stats":{"Line":14}},{"line":42,"address":[],"length":0,"stats":{"Line":14}},{"line":43,"address":[],"length":0,"stats":{"Line":20}},{"line":44,"address":[],"length":0,"stats":{"Line":10}},{"line":45,"address":[],"length":0,"stats":{"Line":9}},{"line":46,"address":[],"length":0,"stats":{"Line":5}},{"line":47,"address":[],"length":0,"stats":{"Line":1}},{"line":48,"address":[],"length":0,"stats":{"Line":1}},{"line":64,"address":[],"length":0,"stats":{"Line":20}},{"line":73,"address":[],"length":0,"stats":{"Line":13}},{"line":74,"address":[],"length":0,"stats":{"Line":26}}],"covered":15,"coverable":20},{"path":["/","Users","rcs","git","rcl","src","writer.rs"],"content":"use crate::config::{validate_table_identifier, PostgresConfig};\nuse crate::errors::{ProcessingError, TransportError, ValidationError};\nuse crate::health::{ComponentStatus, HealthRegistry};\nuse crate::metrics::Metrics;\nuse crate::types::Operation;\nuse backoff::future::retry;\nuse backoff::ExponentialBackoff;\nuse chrono::Utc;\nuse csv::Writer as CsvWriter;\n\nuse async_trait::async_trait;\nuse serde_json::Value;\nuse sqlx::postgres::{PgConnectOptions, PgConnection, PgPoolOptions, PgSslMode};\nuse sqlx::types::Json;\nuse sqlx::{PgPool, QueryBuilder};\nuse std::str::FromStr;\nuse std::sync::Arc;\nuse std::time::Duration;\nuse tracing::warn;\n\n#[derive(Clone, Debug)]\npub struct RecordMeta {\n    pub topic: String,\n    pub partition: i64,\n    pub offset: i64,\n    pub ingest_ts: i64,\n    pub operation: Operation,\n    pub payload: Value,\n}\n\nimpl RecordMeta {\n    pub fn extract(val: \u0026Value) -\u003e Self {\n        let topic = val\n            .get(\"_meta_topic\")\n            .and_then(|v| v.as_str())\n            .unwrap_or(\"\")\n            .to_string();\n        let partition = val\n            .get(\"_meta_partition\")\n            .and_then(|v| v.as_i64())\n            .unwrap_or(0);\n        let offset = val\n            .get(\"_meta_offset\")\n            .and_then(|v| v.as_i64())\n            .unwrap_or(0);\n        let ingest_ts = val\n            .get(\"_meta_ingest_ts\")\n            .and_then(|v| v.as_i64())\n            .unwrap_or(0);\n\n        let operation = val\n            .get(\"operation_type\")\n            .and_then(|v| v.as_str())\n            .and_then(|s| Operation::try_from(s).ok())\n            .unwrap_or(Operation::Create); // default, but should be present\n\n        let mut payload = val.clone();\n        if let Value::Object(ref mut map) = payload {\n            map.remove(\"_meta_topic\");\n            map.remove(\"_meta_partition\");\n            map.remove(\"_meta_offset\");\n            map.remove(\"_meta_ingest_ts\");\n        }\n\n        Self {\n            topic,\n            partition,\n            offset,\n            ingest_ts,\n            operation,\n            payload,\n        }\n    }\n}\n\n#[derive(Clone)]\npub struct Writer {\n    pool: PgPool,\n    cfg: Arc\u003cPostgresConfig\u003e,\n    metrics: Metrics,\n    health: Arc\u003cHealthRegistry\u003e,\n}\n\n#[async_trait]\npub trait WriterTrait: Send + Sync {\n    async fn write(\n        \u0026self,\n        value: \u0026Value,\n        table: \u0026str,\n        pipeline_name: \u0026str,\n    ) -\u003e Result\u003c(), ProcessingError\u003e;\n\n    async fn write_batch(\n        \u0026self,\n        values: \u0026[Value],\n        table: \u0026str,\n        pipeline_name: \u0026str,\n    ) -\u003e Result\u003c(), ProcessingError\u003e;\n}\n\n#[async_trait]\nimpl WriterTrait for Writer {\n    async fn write(\n        \u0026self,\n        value: \u0026Value,\n        table: \u0026str,\n        pipeline_name: \u0026str,\n    ) -\u003e Result\u003c(), ProcessingError\u003e {\n        Writer::write(self, value, table, pipeline_name).await\n    }\n\n    async fn write_batch(\n        \u0026self,\n        values: \u0026[Value],\n        table: \u0026str,\n        pipeline_name: \u0026str,\n    ) -\u003e Result\u003c(), ProcessingError\u003e {\n        Writer::write_batch(self, values, table, pipeline_name).await\n    }\n}\n\nimpl Writer {\n    pub async fn new(\n        cfg: Arc\u003cPostgresConfig\u003e,\n        metrics: Metrics,\n        health: Arc\u003cHealthRegistry\u003e,\n    ) -\u003e Result\u003cSelf, ProcessingError\u003e {\n        let mut url = cfg.url.clone();\n        if let Some(root_cert) = \u0026cfg.ssl_root_cert {\n            if !url.contains(\"sslrootcert=\") {\n                let separator = if url.contains('?') { \"\u0026\" } else { \"?\" };\n                // Encode spaces in the cert path for URL safety\n                let encoded_cert = root_cert.replace(' ', \"%20\");\n                url.push_str(\u0026format!(\"{}sslrootcert={}\", separator, encoded_cert));\n            }\n        }\n\n        let mut options = PgConnectOptions::from_str(\u0026url).map_err(|e| {\n            ProcessingError::from(ValidationError::new(format!(\"invalid pg url: {}\", e)))\n        })?;\n\n        if let Some(mode) = \u0026cfg.ssl_mode {\n            let valid_modes = [\n                \"disable\",\n                \"allow\",\n                \"prefer\",\n                \"require\",\n                \"verify-ca\",\n                \"verify-full\",\n            ];\n            let lower_mode = mode.to_lowercase();\n            if !valid_modes.contains(\u0026lower_mode.as_str()) {\n                warn!(\"invalid ssl_mode '{}', expected one of: disable, allow, prefer, require, verify-ca, verify-full; defaulting to 'prefer'\", mode);\n            }\n            let ssl_mode = match lower_mode.as_str() {\n                \"disable\" =\u003e PgSslMode::Disable,\n                \"allow\" =\u003e PgSslMode::Allow,\n                \"prefer\" =\u003e PgSslMode::Prefer,\n                \"require\" =\u003e PgSslMode::Require,\n                \"verify-ca\" =\u003e PgSslMode::VerifyCa,\n                \"verify-full\" =\u003e PgSslMode::VerifyFull,\n                _ =\u003e PgSslMode::Prefer,\n            };\n            options = options.ssl_mode(ssl_mode);\n        }\n\n        let max_connections = cfg.pool.as_ref().map(|p| p.max_connections).unwrap_or(10);\n        let acquire_timeout = cfg\n            .pool\n            .as_ref()\n            .map(|p| Duration::from_millis(p.acquire_timeout_ms))\n            .unwrap_or(Duration::from_secs(5));\n\n        let pool = PgPoolOptions::new()\n            .max_connections(max_connections)\n            .acquire_timeout(acquire_timeout)\n            .connect_with(options)\n            .await\n            .map_err(|e| {\n                let _ = health.set_postgres_status(ComponentStatus::Unhealthy);\n                ProcessingError::from(TransportError::new(\"pg connect\", e))\n            })?;\n\n        let _ = health.set_postgres_status(ComponentStatus::Healthy);\n\n        Ok(Self {\n            pool,\n            cfg,\n            metrics,\n            health,\n        })\n    }\n\n    pub async fn write(\n        \u0026self,\n        value: \u0026Value,\n        table: \u0026str,\n        pipeline_name: \u0026str,\n    ) -\u003e Result\u003c(), ProcessingError\u003e {\n        self.write_batch(std::slice::from_ref(value), table, pipeline_name)\n            .await\n    }\n\n    #[tracing::instrument(skip(self, values, table), fields(batch_size = values.len()))]\n    pub async fn write_batch(\n        \u0026self,\n        values: \u0026[Value],\n        table: \u0026str,\n        pipeline_name: \u0026str,\n    ) -\u003e Result\u003c(), ProcessingError\u003e {\n        self.metrics.batch_size.observe(values.len() as f64);\n        let timer = self.metrics.write_latency_seconds.start_timer();\n\n        // Log operations for debugging\n        for val in values {\n            let meta = RecordMeta::extract(val);\n            tracing::trace!(operation = %meta.operation, \"processing operation\");\n        }\n\n        let op = || async {\n            let res = if self.cfg.copy_enabled {\n                let mut conn = self\n                    .pool\n                    .acquire()\n                    .await\n                    .map_err(|e| ProcessingError::from(TransportError::new(\"pg acquire\", e)))?;\n\n                match copy_into(\u0026mut conn, table, values).await {\n                    Ok(_) =\u003e Ok(()),\n                    Err(err) =\u003e {\n                        warn!(table = %table, error = %err, \"copy failed, falling back to insert\");\n                        insert_batch(\u0026self.pool, table, values).await\n                    }\n                }\n            } else {\n                insert_batch(\u0026self.pool, table, values).await\n            };\n\n            res.map_err(|e| {\n                if e.is_retryable() {\n                    backoff::Error::transient(e)\n                } else {\n                    backoff::Error::permanent(e)\n                }\n            })\n        };\n\n        let backoff = ExponentialBackoff::default();\n        let res = retry(backoff, op).await;\n\n        timer.observe_duration();\n\n        match \u0026res {\n            Ok(_) =\u003e {\n                let _ = self.health.set_postgres_status(ComponentStatus::Healthy);\n                let _ = self.health.update_pipeline_success(pipeline_name);\n            }\n            Err(e) =\u003e {\n                if let Err(err) = self\n                    .health\n                    .update_pipeline_error(pipeline_name, e.to_string())\n                {\n                    warn!(\"Failed to update pipeline error status: {}\", err);\n                }\n                if !e.is_retryable() {\n                    let _ = self.health.set_postgres_status(ComponentStatus::Unhealthy);\n                }\n            }\n        }\n\n        res\n    }\n}\n\nasync fn copy_into(\n    conn: \u0026mut PgConnection,\n    table: \u0026str,\n    values: \u0026[Value],\n) -\u003e Result\u003c(), ProcessingError\u003e {\n    // Validate table name to prevent SQL injection\n    validate_table_identifier(table)\n        .map_err(|e| ProcessingError::Validation(ValidationError::new(e.to_string())))?;\n\n    // Escape any double quotes in table name and wrap in quotes for safe SQL identifier\n    let quoted_table = format!(\"\\\"{}\\\"\", table.replace('\"', \"\\\"\\\"\"));\n    let copy_sql = format!(\n        \"COPY {} (payload, ingest_system_time, _meta_topic, _meta_partition, _meta_offset, _meta_ingest_ts) FROM STDIN WITH (FORMAT csv)\",\n        quoted_table\n    );\n    let mut writer = conn\n        .copy_in_raw(\u0026copy_sql)\n        .await\n        .map_err(|e| ProcessingError::from(TransportError::new(\"copy start\", e)))?;\n\n    for val in values {\n        let meta = RecordMeta::extract(val);\n\n        let json = serde_json::to_string(\u0026meta.payload)\n            .map_err(|e| ProcessingError::from(TransportError::new(\"json encode\", e)))?;\n        let mut wtr = CsvWriter::from_writer(vec![]);\n        wtr.write_record([\n            json.as_str(),\n            \u0026Utc::now().timestamp_millis().to_string(),\n            \u0026meta.topic,\n            \u0026meta.partition.to_string(),\n            \u0026meta.offset.to_string(),\n            \u0026meta.ingest_ts.to_string(),\n        ])\n        .map_err(|e| {\n            ProcessingError::Validation(ValidationError::new(format!(\"csv write: {}\", e)))\n        })?;\n        let csv_data = wtr.into_inner().map_err(|e| {\n            ProcessingError::Validation(ValidationError::new(format!(\"csv flush: {}\", e)))\n        })?;\n        let line = String::from_utf8(csv_data).map_err(|e| {\n            ProcessingError::Validation(ValidationError::new(format!(\"utf8 decode: {}\", e)))\n        })?;\n        writer\n            .send(line.into_bytes())\n            .await\n            .map_err(|e| ProcessingError::from(TransportError::new(\"copy send\", e)))?;\n    }\n\n    writer\n        .finish()\n        .await\n        .map_err(|e| ProcessingError::from(TransportError::new(\"copy finish\", e)))?;\n    Ok(())\n}\n\nasync fn insert_batch(pool: \u0026PgPool, table: \u0026str, values: \u0026[Value]) -\u003e Result\u003c(), ProcessingError\u003e {\n    if values.is_empty() {\n        return Ok(());\n    }\n\n    // Validate table name to prevent SQL injection\n    validate_table_identifier(table)\n        .map_err(|e| ProcessingError::Validation(ValidationError::new(e.to_string())))?;\n\n    // Escape any double quotes in table name and wrap in quotes for safe SQL identifier\n    let quoted_table = format!(\"\\\"{}\\\"\", table.replace('\"', \"\\\"\\\"\"));\n    let mut builder = QueryBuilder::new(format!(\n        \"INSERT INTO {} (payload, ingest_system_time, _meta_topic, _meta_partition, _meta_offset, _meta_ingest_ts) VALUES \",\n        quoted_table\n    ));\n\n    builder.push_values(values, |mut b, val| {\n        let meta = RecordMeta::extract(val);\n\n        b.push_bind(Json(meta.payload));\n        b.push_bind(Utc::now());\n        b.push_bind(meta.topic);\n        b.push_bind(meta.partition);\n        b.push_bind(meta.offset);\n        b.push_bind(meta.ingest_ts);\n    });\n\n    let query = builder.build();\n    query\n        .execute(pool)\n        .await\n        .map_err(|e| ProcessingError::from(TransportError::new(\"insert\", e)))?;\n    Ok(())\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n\n    #[test]\n    fn test_table_validation_valid_names() {\n        // Valid single table names\n        assert!(validate_table_identifier(\"users\").is_ok());\n        assert!(validate_table_identifier(\"user_data\").is_ok());\n        assert!(validate_table_identifier(\"_private_table\").is_ok());\n        assert!(validate_table_identifier(\"table123\").is_ok());\n\n        // Valid schema.table names\n        assert!(validate_table_identifier(\"public.users\").is_ok());\n        assert!(validate_table_identifier(\"staging.orders\").is_ok());\n        assert!(validate_table_identifier(\"schema_name.table_name\").is_ok());\n\n        // Edge cases that should be valid\n        assert!(validate_table_identifier(\"a.b\").is_ok()); // single character parts\n        assert!(validate_table_identifier(\"_._\").is_ok()); // underscores\n    }\n\n    #[test]\n    fn test_table_validation_invalid_names() {\n        // Empty string\n        assert!(validate_table_identifier(\"\").is_err());\n\n        // Invalid characters\n        assert!(validate_table_identifier(\"user-data\").is_err()); // dash not allowed\n        assert!(validate_table_identifier(\"user data\").is_err()); // space not allowed\n        assert!(validate_table_identifier(\"user;data\").is_err()); // semicolon injection attempt\n        assert!(validate_table_identifier(\"user--data\").is_err()); // SQL comment attempt\n        assert!(validate_table_identifier(\"user' OR '1'='1\").is_err()); // SQL injection attempt\n\n        // Invalid starting characters\n        assert!(validate_table_identifier(\"123table\").is_err()); // starts with number\n        assert!(validate_table_identifier(\"-table\").is_err()); // starts with dash\n\n        // Too many dots\n        assert!(validate_table_identifier(\"a.b.c\").is_err()); // more than one dot\n\n        // Empty parts\n        assert!(validate_table_identifier(\".table\").is_err()); // empty schema\n        assert!(validate_table_identifier(\"schema.\").is_err()); // empty table\n\n        // Names too long (over 63 characters)\n        let long_name = \"a\".repeat(64);\n        assert!(validate_table_identifier(\u0026long_name).is_err());\n    }\n\n    #[test]\n    fn test_copy_into_validation_rejection() {\n        // This test verifies that copy_into rejects invalid table names\n        // We can't fully test the async function without a database connection,\n        // but we can test that validation happens early by checking the error type\n\n        // Create a mock connection that would fail anyway, but validation should happen first\n        // Since we can't easily create a PgConnection without a database, we'll test the validation\n        // separately. The integration test below would need a test database.\n\n        // Test that validation function works as expected\n        assert!(validate_table_identifier(\"users; DROP TABLE users;--\").is_err());\n        assert!(validate_table_identifier(\"users' OR '1'='1\").is_err());\n    }\n\n    #[test]\n    fn test_insert_batch_validation_rejection() {\n        // Similar to copy_into test - validation should prevent SQL injection\n\n        assert!(validate_table_identifier(\"users; DROP TABLE users;--\").is_err());\n        assert!(validate_table_identifier(\"users' OR '1'='1\").is_err());\n    }\n\n    #[test]\n    fn test_record_meta_extract() {\n        let v = serde_json::json!({\n            \"_meta_topic\": \"t1\",\n            \"_meta_partition\": 3,\n            \"_meta_offset\": 7,\n            \"_meta_ingest_ts\": 12345,\n            \"operation_type\": \"u\",\n            \"name\": \"bob\"\n        });\n\n        let meta = RecordMeta::extract(\u0026v);\n        assert_eq!(meta.topic, \"t1\");\n        assert_eq!(meta.partition, 3);\n        assert_eq!(meta.offset, 7);\n        assert_eq!(meta.ingest_ts, 12345);\n        assert_eq!(meta.operation, Operation::Update);\n        // payload should no longer contain meta fields\n        if let serde_json::Value::Object(map) = meta.payload {\n            assert!(map.get(\"_meta_topic\").is_none());\n            assert_eq!(map.get(\"name\").and_then(|v| v.as_str()), Some(\"bob\"));\n        } else {\n            panic!(\"payload not object\")\n        }\n    }\n\n    #[test]\n    fn test_copy_csv_generation_contains_meta_and_payload() {\n        let v = serde_json::json!({\n            \"_meta_topic\": \"t1\",\n            \"_meta_partition\": 3,\n            \"_meta_offset\": 7,\n            \"_meta_ingest_ts\": 12345,\n            \"operation_type\": \"c\",\n            \"name\": \"bob\"\n        });\n\n        let meta = RecordMeta::extract(\u0026v);\n\n        // replicate the CSV generation logic from copy_into\n        let json_payload = serde_json::to_string(\u0026meta.payload).expect(\"json encode\");\n        let mut wtr = CsvWriter::from_writer(vec![]);\n        wtr.write_record(\u0026[\n            json_payload.as_str(),\n            \u0026Utc::now().timestamp_millis().to_string(),\n            \u0026meta.topic,\n            \u0026meta.partition.to_string(),\n            \u0026meta.offset.to_string(),\n            \u0026meta.ingest_ts.to_string(),\n        ])\n        .expect(\"csv write\");\n        let csv_data = wtr.into_inner().expect(\"csv into_inner\");\n        let line = String::from_utf8(csv_data).expect(\"utf8\");\n\n        // Check that CSV line contains the expected metadata and payload fields\n        assert!(line.contains(\"t1\"));\n        assert!(line.contains(\"3\"));\n        assert!(line.contains(\"7\"));\n        assert!(line.contains(\"12345\"));\n        assert!(line.contains(\"name\"));\n        assert!(line.contains(\"bob\"));\n    }\n\n    #[test]\n    fn test_record_meta_extract_with_all_operations() {\n        // Test each operation type\n        let operations = vec![\n            (\"c\", Operation::Create),\n            (\"r\", Operation::Read),\n            (\"u\", Operation::Update),\n            (\"d\", Operation::Delete),\n        ];\n\n        for (op_str, expected_op) in operations {\n            let v = serde_json::json!({\n                \"_meta_topic\": \"test_topic\",\n                \"_meta_partition\": 0,\n                \"_meta_offset\": 0,\n                \"_meta_ingest_ts\": 1000,\n                \"operation_type\": op_str,\n                \"data\": \"test\"\n            });\n\n            let meta = RecordMeta::extract(\u0026v);\n            assert_eq!(meta.operation, expected_op);\n        }\n    }\n\n    #[test]\n    fn test_record_meta_extract_missing_meta_fields() {\n        // Test extraction when some meta fields clear();\n        self.current_bytes = 0;\n        self.last_flush = Instant::now();\n        self.first_message_time = None;\n    }\n\n    pub fn is_empty(\u0026self) -\u003e bool {\n        self.messages.is_empty()\n    }\n\n    #[allow(dead_code)]\n    pub fn len(\u0026self) -\u003e usize {\n        self.messages.len()\n    }\n}\n\n#[derive(Clone, Debug, PartialEq, Eq)]\npub enum FlushReason {\n    Time,\n    Size,\n    Bytes,\n    Shutdown,\n}\n\nimpl std::fmt::Display for FlushReason {\n    fn fmt(\u0026self, f: \u0026mut std::fmt::Formatter\u003c'_\u003e) -\u003e std::fmt::Result {\n        match self {\n            FlushReason::Time =\u003e write!(f, \"time\"),\n            FlushReason::Size =\u003e write!(f, \"size\"),\n            FlushReason::Bytes =\u003e write!(f, \"bytes\"),\n            FlushReason::Shutdown =\u003e write!(f, \"shutdown\"),\n        }\n    }\n}\n\npub struct Batcher {\n    buffers: HashMap\u003cString, PipelineBuffer\u003e,\n    config: BatcherConfig,\n    writer: Arc\u003cdyn WriterTrait\u003e,\n    metrics: Metrics,\n    #[allow(dead_code)]\n    shutdown_rx: broadcast::Receiver\u003c()\u003e,\n}\n\nimpl Batcher {\n    pub fn new(\n        config: BatcherConfig,\n        writer: Arc\u003cdyn WriterTrait\u003e,\n        metrics: Metrics,\n        shutdown_rx: broadcast::Receiver\u003c()\u003e,\n    ) -\u003e Self {\n        Self {\n            buffers: HashMap::new(),\n            config,\n            writer,\n            metrics,\n            shutdown_rx,\n        }\n    }\n\n    pub async fn add_message(\n        \u0026mut self,\n        pipeline_name: \u0026str,\n        table: \u0026str,\n        message: Value,\n    ) -\u003e Result\u003c(), ProcessingError\u003e {\n        let buffer_key = format!(\"{}:{}\", pipeline_name, table);\n\n        // Check if we need to flush first\n        let should_flush = {\n            if let Some(buffer) = self.buffers.get(\u0026buffer_key) {\n                let now = Instant::now();\n n_since(t))\n            .unwrap_or(Duration::from_secs(0));\n\n        let messages = buffer.messages.clone();\n        buffer.clear();\n\n        self.metrics.batch_size.observe(batch_size as f64);\n        self.metrics.batch_bytes_total.inc_by(batch_bytes as u64);\n        self.metrics\n            .batch_latency_seconds\n            .observe(latency.as_secs_f64());\n        self.metrics\n            .batch_flush_total\n            .with_label_values(\u0026[\u0026reason.to_string()])\n            .inc();\n\n        info!(\n            pipeline = %buffer.pipeline_name,\n            table = %buffer.table,\n            batch_size = %batch_size,\n            batch_bytes = %batch_bytes,\n            reason = %reason,\n            \"flushing batch\"\n        );\n\n        // Attempt batch write with fallback to individual writes\n        match self\n            .writer\n            .write_batch(\u0026messages, \u0026buffer.table, \u0026buffer.pipeline_name)\n            .await\n        {\n            Ok(()) =\u003e Ok(()),\n            Err(e) =\u003e {\n                warn!(\n                    pipeline = %buffer.pipeline_name,\n                    table = %buffer.table,\n                    batch_size = %batch_size,\n                    error = %e,\n                    \"batch write failed, falling back to individual writes\"\n                );\n\n                // Fallback: try individual writes\n                let mut success_count = 0;\n                let mut failed_messages = Vec::new();\n\n                for message in messages {\n                    match self\n                        .writer\n                        .write(\u0026message, \u0026buffer.table, \u0026buffer.pipeline_name)\n                        .await\n                    {\n                        Ok(()) =\u003e success_count += 1,\n                        Err(write_err) =\u003e {\n                            error!(\n                                pipeline = %buffer.pipeline_name,\n                                table = %buffer.table,\n                                error = %write_err,\n                                \"individual message write failed\"\n                            );\n                            failed_messages.push((message, write_err));\n                        }\n                    }\n                }\n\n                if success_count == 0 {\n                    return Err(e); // All writes failed, return original batch error\n                }\n\n                // Some messages failed - track and return detailed error\n                let failed_count = batch_size - success_count;\n                warn!(\n                    pipeline = %buffer.pipeline_name,\n                    table = %buffer.table,\n                    success_count = %success_count,\n                    failed_count = %failed_count,\n                    total_count = %batch_size,\n                    \"partial batch write failure - some messages failed\"\n                );\n\n                Err(BatchPartialFailure::new(failed_count, batch_size, failed_messages).into())\n            }\n        }\n    }\n\n    #[allow(dead_code)]\n    pub async fn run_background_flush(\u0026mut self) -\u003e Result\u003c(), ProcessingError\u003e {\n        let _interval = time::interval(Duration::from_millis(1000)); // Check every second\n\n        loop {\n            tokio::select! {\n                result = self.shutdown_rx.recv() =\u003e {\n                    match result {\n                        Ok(()) | Err(broadcast::error::RecvError::Closed) =\u003e {\n                            info!(\"batcher received shutdown signal, flushing all buffers\");\n                            self.flush_all_buffers(FlushReason::Shutdown).await?;\n                            break;\n                        }\n                        Err(broadcast::error::RecvError::Lagged(n)) =\u003e {\n                            warn!(missed = n, \"batcher shutdown receiver lagged, continuing\");\n                            // Continue loop - this isn't a shutdown signal\n                        }\n                    }\n                }\n            }\n        }\n\n        Ok(())\n    }\n\n    pub async fn flush_pending_buffers(\u0026mut self) -\u003e Result\u003c(), ProcessingError\u003e {\n        let now = Instant::now();\n\n        // Collect keys that need flushing and flush them immediately\n        let buffer_keys: Vec\u003cString\u003e = self.buffers.keys().cloned().collect();\n\n        for key in buffer_keys {\n            if let Some(mut buffer) = self.buffers.remove(\u0026key) {\n                if let Some(reason) = buffer.should_flush(\u0026self.config, now) {\n                    if let Err(e) = self.flush_buffer(\u0026mut buffer, reason).await {\n                        // Re-insert buffer to prevent data loss, then propagate error\n                        self.buffers.insert(key, buffer);\n                        return Err(e);\n                    }\n                }\n                if !buffer.is_empty() {\n                    self.buffers.insert(key, buffer);\n                }\n            }\n        }\n\n        Ok(())\n    }\n\n    pub async fn flush_all_buffers(\u0026mut self, reason: FlushReason) -\u003e Result\u003c(), ProcessingError\u003e {\n        let buffer_keys: Vec\u003cString\u003e = self.buffers.keys().cloned().collect();\n\n        for key in buffer_keys {\n            if let Some(mut buffer) = self.buffers.remove(\u0026key) {\n                if !buffer.is_empty() {\n                    self.flush_buffer(\u0026mut buffer, reason.clone()).await?;\n                }\n            }\n        }\n\n        Ok(())\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use std::sync::Arc;\n\n    fn create_test_config() -\u003e BatcherConfig {\n        BatcherConfig {\n            flush_interval_ms: 100, // Short for testing\n            max_batch_size: 3,\n            max_batch_bytes: 1000,\n            shutdown_timeout: Duration::from_secs(1),\n        }\n    }\n\n    fn create_test_message(id: u32) -\u003e Value {\n        serde_json::json!({\n            \"id\": id,\n            \"data\": \"test data\",\n            \"operation_type\": \"c\"\n        })\n    }\n\n    #[test]\n    fn test_pipeline_buffer_add_message() {\n        let mut buffer = PipelineBuffer::new(\"test-pipeline\".to_string(), \"test-table\".to_string());\n        let config = create_test_config();\n\n        assert!(buffer.is_empty());\n        assert_eq!(buffer.len(), 0);\n\n        let msg = create_test_message(1);\n        buffer.add_message(msg, \u0026config).unwrap();\n\n        assert!(!buffer.is_empty());\n        assert_eq!(buffer.len(), 1);\n        assert!(buffer.first_message_time.is_some());\n    }\n\n    #[test]\n    fn test_pipeline_buffer_size_flush() {\n        let mut buffer = PipelineBuffer::new(\"test-pipeline\".to_string(), \"test-table\".to_string());\n        let config = create_test_config();\n\n        // Add messages up to batch size\n        for i in 0..config.max_batch_size {\n            buffer\n                .add_message(create_test_message(i as u32), \u0026config)\n                .unwrap();\n        }\n\n        // Should trigger size-based flush\n        let now = Instant::now();\n        assert_eq!(buffer.should_flush(\u0026config, now), Some(FlushReason::Size));\n    }\n\n    #[tokio::test]\n    async fn test_batcher_add_message() {\n        let config = create_test_config();\n        let (shutdown_coordinator, _) = crate::shutdown::ShutdownCoordinator::new();\n        let metrics = Metrics::register(\u0026prometheus::Registry::new()).unwrap();\n        // Simple mock writer that always returns Ok(())\n        use async_trait::async_trait;\n\n        struct MockWriter;\n\n        #[async_trait]\n        impl crate::writer::WriterTrait for MockWriter {\n            async fn write(\n                \u0026self,\n                _value: \u0026serde_json::Value,\n ize, Serialize)]\npub struct ServiceConfig {\n    pub log_level: LogLevel,\n    pub metrics_port: u16,\n    pub otlp_endpoint: Option\u003cString\u003e,\n    #[serde(default = \"default_health_check_timeout_ms\")]\n    pub health_check_timeout_ms: u64,\n    #[serde(default = \"default_shutdown_timeout\")]\n    pub shutdown_timeout: String,\n}\n\nfn default_health_check_timeout_ms() -\u003e u64 {\n    5000\n}\n\nfn default_shutdown_timeout() -\u003e String {\n    \"30s\".to_string()\n}\n\nimpl ServiceConfig {\n    pub fn shutdown_timeout_duration(\u0026self) -\u003e std::time::Duration {\n        parse_duration(\u0026self.shutdown_timeout).unwrap_or(std::time::Duration::from_secs(30))\n    }\n}\n\nfn parse_duration(s: \u0026str) -\u003e Result\u003cstd::time::Duration, std::num::ParseIntError\u003e {\n    if s.ends_with('s') {\n        let secs: u64 = s.trim_end_matches('s').parse()?;\n        Ok(std::time::Duration::from_secs(secs))\n    } else {\n        // fallback to seconds if no suffix\n        let secs: u64 = s.parse()?;\n        Ok(std::time::Duration::from_secs(secs))\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n\n    #[test]\n    fn test_parse_duration_with_s() {\n        let d = parse_duration(\"45s\").unwrap();\n        assert_eq!(d.as_secs(), 45);\n    }\n\n    #[test]\n    fn test_parse_duration_plain_number() {\n        let d = parse_duration(\"10\").unwrap();\n        assert_eq!(d.as_secs(), 10);\n    }\n\n    #[test]\n    fn test_parse_duration_invalid() {\n        assert!(parse_duration(\"1m\").is_err());\n    }\n\n    #[test]\n    fn test_service_shutdown_timeout_duration() {\n        let svc = ServiceConfig {\n            log_level: LogLevel::Info,\n            metrics_port: 9000,\n            otlp_endpoint: None,\n            health_check_timeout_ms: 5000,\n            shutdown_timeout: \"60s\".to_string(),\n        };\n        let dur = svc.shutdown_timeout_duration();\n        assert_eq!(dur.as_secs(), 60);\n    }\n\n    #[test]\n
